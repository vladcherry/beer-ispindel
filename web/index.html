  }

  const ACT_ICONS = {
    play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor"/></svg>`,
    book: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>`,
    list: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>`,
    ext: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>`,
  };
  const actionBar = (first) => `<div class="actbar">
      <button type="button" class="main" id="new-batch">${ACT_ICONS.play}${escapeHtml(first)}</button>
      <button type="button" id="about-style">${ACT_ICONS.book}${escapeHtml(t("act.style"))}</button>
      <button type="button" id="open-catalog">${ACT_ICONS.list}${escapeHtml(t("act.catalog"))}</button>
    </div>`;

  // ---------- Справочник стилей и карточка стиля (лист снизу) ----------
  const sheet = $("sheet");
  let catState = { cat: "all", q: "" };
  const COLOURS = { pale: "#e8c55c", amber: "#c4782a", dark: "#4a2c1d" };
  const closeBtn = `<button class="x" type="button" data-close aria-label="${escapeHtml(t("sheet.close"))}">×</button>`;
  function openSheet(html) {
    $("sheet-body").innerHTML = html;
    if (!sheet.open) sheet.showModal();

  }
  sheet.addEventListener("click", (e) => {
    if (e.target === sheet || e.target.closest("[data-close]")) sheet.close();
    const back = e.target.closest("[data-back]");
    if (back) openCatalog();
    const pick = e.target.closest("[data-style]");
    if (pick) openStyle(pick.dataset.style, true);
    const cat = e.target.closest("[data-cat]");
    if (cat) { catState.cat = cat.dataset.cat; renderCatalog(); }
    const choose = e.target.closest("[data-choose]");
    if (choose) chooseStyle(choose.dataset.choose);
  });

  function openCatalog() { openSheet(catalogHtml()); bindSearch(); }
  function renderCatalog() {
    const keep = sheet.querySelector(".cat-search");
    const pos = keep ? keep.selectionStart : null;
    $("sheet-body").innerHTML = catalogHtml();
    bindSearch(pos);
  }
  function bindSearch(pos) {
    const inp = sheet.querySelector(".cat-search");
    inp.oninput = (e) => { catState.q = e.target.value; renderCatalog(); };
    if (pos != null) { inp.focus(); inp.setSelectionRange(pos, pos); }
  }
  function catalogHtml() {
    const lang = I18N.lang(), cur0 = cur() && cur().style;
    const q = catState.q.trim().toLowerCase();
    const items = Brew.STYLES
      .filter((x) => StyleGuide.inCategory(x, catState.cat))
      .filter((x) => !q || (x.name[lang] || x.name.en).toLowerCase().includes(q) || x.name.en.toLowerCase().includes(q))
      .sort((p, q2) => (p.name[lang] || p.name.en).localeCompare(q2.name[lang] || q2.name.en, I18N.locale()));
    const cats = StyleGuide.CATEGORIES.map((c) =>
      `<button type="button" data-cat="${c}" aria-pressed="${c === catState.cat}">${escapeHtml(t("catalog.cat." + c))}</button>`).join("");
    const rows = items.map((x) => `<li><button type="button" data-style="${x.id}">
        <span><span class="dot" style="background:${COLOURS[StyleGuide.colour(x.id)]}"></span>${escapeHtml(x.name[lang] || x.name.en)}${x.id === cur0 ? ` <span class="cur">✓</span>` : ""}</span>
        <small>${rangeText(x.t)} °C · ${rangeText(x.abv)}%</small></button></li>`).join("");
    return `<div class="top-line"><h2>${escapeHtml(t("catalog.title"))}</h2>${closeBtn}</div>
      <input class="cat-search" type="search" value="${escapeHtml(catState.q)}" placeholder="${escapeHtml(t("catalog.search"))}" autocomplete="off">
      <div class="cats">${cats}</div>
      ${rows ? `<ul class="cat-list">${rows}</ul>` : `<p class="hint">${escapeHtml(t("catalog.empty"))}</p>`}`;
  }

  function openStyle(id, fromCatalog = false) {
    const x = Brew.byId[id];
    if (!x) return;
    const lang = I18N.lang();
    const name = x.name[lang] || x.name.en;
    const st = cur();
    const isCurrent = st && st.style === id;
    // Сравнение с текущей партией — по её данным, если партия идёт
    let cmp = "";
    if (view && view.hasBatch) {
      const a = view.a, parts = [];
      const mark = (ok) => `<span class="${ok ? "okk" : "out"}">${escapeHtml(t(ok ? "sheet.inRange" : "sheet.out"))}</span>`;
      if (view.og != null) parts.push(`${escapeHtml(t("sheet.ogNow", { og: fmt(view.og, 1) }))} ${mark(view.og >= x.og[0] - 0.5 && view.og <= x.og[1] + 0.5)}`);
      const fg = st.fg ?? (x.fg[0] + x.fg[1]) / 2;
      if (view.og != null) { const pa = Brew.abv(view.og, fg); parts.push(`${escapeHtml(t("sheet.abvProj", { abv: fmt(pa, 1) }))} ${mark(pa >= x.abv[0] - 0.3 && pa <= x.abv[1] + 0.3)}`); }
      const tc = a.temp.stats && a.temp.stats.last;
      if (tc != null) parts.push(`${escapeHtml(t("sheet.tempNow", { t: fmt(tc, 1) }))} ${mark(tc >= x.t[0] - 0.5 && tc <= x.t[1] + 0.5)}`);
      if (parts.length) cmp = `<div class="cmp"><span>${escapeHtml(t("sheet.yourBatch"))}:</span>${parts.map((p) => `<span>${p}</span>`).join("")}</div>`;
    }
    let action = "";
    if (st && view && view.hasBatch && !isCurrent) action = `<button type="button" class="main" data-choose="${id}">${escapeHtml(t("sheet.choose"))}</button>`;
    else if (st && view && !view.hasBatch) action = `<button type="button" class="main" data-choose="${id}">${escapeHtml(t("sheet.startWith"))}</button>`;
    openSheet(`<div class="top-line">${fromCatalog ? `<button class="back" type="button" data-back>← ${escapeHtml(t("act.catalog"))}</button>` : ""}${closeBtn}</div>
      <h2>${escapeHtml(name)}</h2>
      <div class="sub">${escapeHtml([x.name.en !== name ? x.name.en : null, t("sheet.yeast." + x.yeast), "BJCP " + StyleGuide.code(id)].filter(Boolean).join(" · "))}</div>
      ${isCurrent ? `<span class="current-mark">✓ ${escapeHtml(t("sheet.current"))}</span>` : ""}
      <p>${escapeHtml(StyleGuide.desc(id, lang))}</p>
      <div class="facts">
        <div><small>${escapeHtml(t("sheet.ferment"))}</small><b>${rangeText(x.t)} °C</b></div>
        <div><small>${escapeHtml(t("sheet.abv"))}</small><b>${rangeText(x.abv)}%</b></div>
        <div><small>${escapeHtml(t("sheet.og"))}</small><b>${rangeText(x.og)} °P</b></div>
        <div><small>${escapeHtml(t("sheet.fg"))}</small><b>${rangeText(x.fg)} °P</b></div>
      </div>
      ${cmp}
      <h3>${escapeHtml(t("sheet.tips"))}</h3>
      <ul class="tips">${StyleGuide.tips(x.yeast, lang).map((tip) => `<li>${escapeHtml(tip)}</li>`).join("")}</ul>
      <div class="btns">${action}
        <a href="${StyleGuide.wikiUrl(name, lang)}" target="_blank" rel="noopener">${escapeHtml(t("sheet.wiki"))} ${ACT_ICONS.ext}</a>
        <a href="${StyleGuide.bjcpUrl(x.name.en)}" target="_blank" rel="noopener">BJCP ${ACT_ICONS.ext}</a>
      </div>`);
  }

  // Выбрать стиль: для идущей партии — сохранить сразу, без партии — открыть «Новая партия» с этим стилем.
  async function chooseStyle(id) {
    const st = cur();
    if (!st) return;
    if (view && view.hasBatch) {
      try { await postBatch(st, { style: id }); }
      catch (e) { notice(escapeHtml(t("err.batch", { message: e.message })), "error"); return; }
      sheet.close(); refresh();
    } else {
      sheet.close(); openBatchDialog(id);
    }
  }

  // ---------- Всплывающие подсказки ----------
  let popFor = null;
  const dl = (pairs) => `<dl>${pairs.filter(([, v]) => v != null && v !== "").map(([k, v]) => `<dt>${escapeHtml(t(k))}</dt><dd>${escapeHtml(v)}</dd>`).join("")}</dl>`;
  const list = (msgs) => msgs.length ? `<ul>${msgs.map((m) => `<li class="${m.level}">${escapeHtml(msgText(m))}</li>`).join("")}</ul>` : "";
  function popContent(id) {
    if (!view) return "";
    const { a, last, pct, fc, style, og, current } = view;
    const u = tUnit(last.temp_units);
    if (id === "chip-batt") {
      return `<h4>${escapeHtml(t("device.battery"))} ${pct == null ? "–" : pct + "%"} · ${fmt(last.battery, 2)} ${escapeHtml(t("unit.volt"))}</h4><p style="margin:0">${batteryNote(pct, fc)}</p>`;
    }
    if (id === "band-t") {
      const s = a.temp.stats || {};
      return `<h4>${escapeHtml(t("device.temperature"))} ${fmt(last.temperature, 1)} ${u}</h4>` + dl([
        ["pop.temp.mean", s.mean != null ? fmt(s.mean, 1) + " °C" : null],
        ["pop.temp.range", s.min != null ? `${fmt(s.min, 1)} – ${fmt(s.max, 1)} °C` : null],
        ["pop.temp.swing", s.swing != null ? fmt(s.swing, 1) + " °C" : null],
        ["pop.temp.trend", s.trend != null ? (s.trend >= 0 ? "+" : "−") + fmt(Math.abs(s.trend), 1) + " °C" : null],
        ["pop.temp.spikes", s.spikes != null ? String(s.spikes) : null],
        ["pop.temp.style", style ? `${rangeText(style.t)} °C` : null],
      ]) + list(a.temp.msgs);
    }
    if (id === "chip-wifi") {
      return `<h4>${escapeHtml(t("device.wifi"))}: ${escapeHtml(rssiText(last.rssi))}</h4>` + dl([
        ["pop.wifi.rssi", last.rssi != null ? `${wifiPct(last.rssi)}% · ${String(last.rssi).replace("-", "−")} dBm` : null],
        ["device.interval", intervalText(last.interval_s)],
        ["device.tilt", last.angle != null ? fmt(last.angle, 1) + "°" : null],
      ]) + (last.rssi != null && last.rssi < -80 ? `<ul><li class="warn">${escapeHtml(t("pop.wifi.weak"))}</li></ul>` : "");
    }
    if (id === "chip-rate" || id === "band-g") {
      return `<h4>${escapeHtml(t("band.gravity"))} ${current == null ? "–" : fmt(current, 1) + " °P"}</h4>` + dl([
        ["pop.g.og", og != null ? fmt(og, 1) + " °P" : null],
        ["pop.g.fg", a.fg != null ? "≈ " + fmt(a.fg, 1) + " °P" : null],
        ["info.speedLabel", a.rate != null ? fmt(a.rate, 1) + " °P/" + t("unit.dayShort") : null],
        ["pop.g.style", style ? `${rangeText(style.og)} → ${rangeText(style.fg)} °P` : null],
      ]) + list(a.gravity.msgs);
    }
    if (id === "band-abv") {
      return `<h4>${escapeHtml(t("band.abvTitle"))} ${a.abvNow != null ? fmt(a.abvNow, 1) + "%" : "–"}</h4>` + dl([
        ["pop.abv.proj", a.projAbv != null ? "≈ " + fmt(a.projAbv, 1) + "%" : null],
        ["pop.abv.style", style ? `${rangeText(style.abv)}%` : null],
      ]) + (a.abv.msgs.length ? list(a.abv.msgs) : `<p style="margin:0">${escapeHtml(t("pop.abv.needBatch"))}</p>`);
    }
    return "";
  }
  function showPop(id) {
    const pop = $("pop"), anchor = $(id);
    popFor = id;
    pop.innerHTML = `<button class="close" type="button" aria-label="×">×</button>` + popContent(id);
    pop.hidden = false;
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth;
    pop.style.left = Math.max(12, Math.min(r.left + scrollX, scrollX + innerWidth - w - 12)) + "px";
    pop.style.top = (r.bottom + scrollY + 8) + "px";
    pop.querySelector(".close").onclick = hidePop;
  }
  function hidePop() { $("pop").hidden = true; popFor = null; }
  ["chip-batt", "band-t", "chip-wifi", "chip-rate", "band-g", "band-abv"].forEach((id) => {
    $(id).addEventListener("click", (e) => { e.stopPropagation(); if (popFor === id) hidePop(); else showPop(id); });
  });
  document.addEventListener("click", (e) => { if (!$("pop").hidden && !e.target.closest("#pop")) hidePop(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hidePop(); });

  // «Данные получены N секунд назад» — обновляется каждую секунду без запросов
  let seenInfo = null;
  function updateSeen() {
    if (!seenInfo) return;
    const stale = Date.now() - seenInfo.ts > seenInfo.expected * 3 + 120e3;
    const el = $("seen");
    el.textContent = t("status.received", { ago: ago(seenInfo.ts) }) + (stale ? t("status.stale") : "");
    el.classList.toggle("stale", stale);
  }
  setInterval(updateSeen, 1000);

  function renderCharts(rows, last) {
    $("charts").hidden = false;
    const gRaw = rows.filter((r) => plausible(r.g)).map((r) => ({ x: r.ts, y: r.g }));
    const tPts = rows.filter((r) => r.temperature != null).map((r) => ({ x: r.ts, y: r.temperature }));
    const unit = tUnit(last.temp_units);
    const g = cfg.smooth ? smoothSeries(gRaw) : gRaw;
    renderChart("chart-g", g, cfg.smooth ? gRaw : null, css("--amber"), "°P", 1, 2);
    // Температура с полосой нормы стиля
    const style = view && view.style;
    let band = null;
    if (style) {
      const conv = (c) => last.temp_units === "F" ? c * 9 / 5 + 32 : c;
      band = { lo: conv(style.t[0]), hi: conv(style.t[1]), color: "rgba(47, 111, 115, .14)" };
    }
    $("t-note").textContent = style ? t("charts.styleRange", { lo: fmtMax1(style.t[0]), hi: fmtMax1(style.t[1]) }) : "";
    renderChart("chart-t", tPts, null, css("--teal"), unit, 1, 1, band);
    // Алкоголь по ходу партии — от начальной плотности
    const og = view && view.og;
    $("abv-card").hidden = og == null;
    if (og != null) {
      const from = view.st.batchStart;
      const pts = g.filter((p) => p.x >= from && p.y != null).map((p) => ({ x: p.x, y: Brew.abv(og, p.y) }));
      renderChart("chart-a", pts, null, css("--violet"), "%", 1, 1);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------- Управление ----------
  function syncRanges() {
    $("ranges").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.range === cfg.range)));
  }
  $("ranges").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-range]");
    if (!b) return;
    rangePicked = true;
    cfg.range = b.dataset.range; save(); syncRanges(); refresh();
  });
  $("smooth").checked = cfg.smooth;
  $("smooth").onchange = (e) => { cfg.smooth = e.target.checked; save(); refresh(); };
  $("refresh").onclick = refresh;

  // ---------- Стиль пива и новая партия ----------
  function fillStyles(sel, value) {
    const lang = I18N.lang();
    const items = Brew.STYLES.map((x) => [x.id, x.name[lang] || x.name.en]).sort((p, q) => p[1].localeCompare(q[1], I18N.locale()));
    sel.innerHTML = `<option value="">${escapeHtml(t("batchdlg.noStyle"))}</option>` +
      items.map(([id, name]) => `<option value="${id}">${escapeHtml(name)}</option>`).join("");
    sel.value = value || "";
  }
  function styleInfo(id) {
    const x = Brew.byId[id];
    if (!x) return "";
    return t("batchdlg.styleInfo", { t: rangeText(x.t), og: rangeText(x.og), fg: rangeText(x.fg), abv: rangeText(x.abv) });
  }
  const fgPlaceholder = (id) => {
    const x = Brew.byId[id];
    return x ? t("batchdlg.fgFromStyle", { fg: fmt((x.fg[0] + x.fg[1]) / 2, 1) }) : t("batchdlg.fgDefault");
  };
  const parseFg = (v) => { const n = parseFloat(String(v).replace(",", ".")); return Number.isFinite(n) ? Math.round(n * 10) / 10 : null; };

  const bdlg = $("batch-dlg"), bform = $("batch-form");
  function openBatchDialog(preStyle) {
    const st = cur();
    if (!st) { $("open-settings").click(); return; }
    fillStyles(bform.elements.style, preStyle || st.style);
    bform.elements.fg.value = st.fg ?? "";
    bform.elements.fg.placeholder = fgPlaceholder(preStyle || st.style);
    bform.elements.start.value = toLocalInput(Date.now());
    $("style-info").textContent = styleInfo(preStyle || st.style);
    $("batchdlg-error").textContent = "";
    bdlg.showModal();
  }
  bform.elements.style.addEventListener("change", (e) => {
    $("style-info").textContent = styleInfo(e.target.value);
    bform.elements.fg.placeholder = fgPlaceholder(e.target.value);
  });
  bform.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (e.submitter && e.submitter.value === "cancel") { bdlg.close(); return; }
    const st = cur();
    const start = bform.elements.start.value ? new Date(bform.elements.start.value).getTime() : Date.now();
    if (!confirmReset(st, start)) return;
    try { await postBatch(st, { start, style: bform.elements.style.value || null, fg: parseFg(bform.elements.fg.value) }); }
    catch (err) { $("batchdlg-error").textContent = t("err.batch", { message: err.message }); return; }
    cfg.range = "batch"; rangePicked = false;
    bdlg.close(); syncRanges(); refresh();
  });

  const dlg = $("settings"), form = $("settings-form");
  const toLocalInput = (ms) => {
    if (!ms) return "";
    const d = new Date(ms);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  };

  // Токен стика: те же правила, что и на воркере (iSpindel хранит его в JSON-конфиге).
  const TOKEN_MIN = 8, TOKEN_MAX = 64;
  function tokenProblem(tok) {
    if (tok.length < TOKEN_MIN) return t("err.tokenShort", { n: TOKEN_MIN });
    if (tok.length > TOKEN_MAX) return t("err.tokenLong", { n: TOKEN_MAX });
    if (!/^[\x21-\x7e]+$/.test(tok) || /["\\]/.test(tok)) return t("err.tokenChars");
    return null;
  }
  function generateToken() {
    const abc = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
    const bytes = crypto.getRandomValues(new Uint8Array(20));
    return Array.from(bytes, (b) => abc[b % abc.length]).join("");
  }
  async function post(path, body, access) {
    const headers = { "Content-Type": "application/json" };
    if (access) headers["X-Access"] = access;
    const res = await fetch(apiBase() + path, { method: "POST", headers, body: JSON.stringify(body || {}) });
    let data = {};
    try { data = await res.json(); } catch { /* не JSON */ }
    if (!res.ok) { const e = new Error(data.error || String(res.status)); e.code = data.code; e.status = res.status; throw e; }
    return data;
  }

  // Регистрация токена: сервер заводит стик и выдаёт ключ доступа. Токен, который уже занят, не отдаётся.
  async function addStick(tok, extra = {}) {
    const { stick, access } = await post("/api/register", { token: tok });
    const existing = cfg.sticks.find((x) => x.id === stick);
    const entry = Object.assign(existing || { id: stick, name: "", batchStart: null, formula: "" }, extra, { access, token: tok });
    if (!existing) cfg.sticks.push(entry);
    cfg.current = stick; cfg.device = "";
    save();
    return entry;
  }

  // Ссылка «Поделиться»: #join=<ключ доступа>. Открыл — стик добавился.
  let joined = false;
  async function handleJoin() {
    const m = /[#&]join=([A-Za-z0-9_-]{16,})/.exec(location.hash);
    if (!m) return;
    history.replaceState(null, "", location.pathname + location.search);
    const access = m[1];
    try {
      const data = await api("/api/devices", {}, access);
      let entry = cfg.sticks.find((x) => x.id === data.stick);
      if (!entry) {
        entry = { id: data.stick, access, token: null, name: (data.devices[0] || {}).device || "", batchStart: null, formula: "" };
        cfg.sticks.push(entry);
      }
      cfg.current = entry.id; cfg.device = "";
      save();
      joined = true;
    } catch (e) {
      notice(escapeHtml(t("err.joinFailed", { message: e.message })), "error");
    }
  }

  // Переход со старой версии, где был один токен: забираем его стик.
  async function migrateLegacy() {
    if (!cfg.legacy) return;
    const { token, batchStart, formula } = cfg.legacy;
    try {
      const st = await addStick(token, { formula });
      delete cfg.legacy; save();
      if (batchStart) {
        await fetch(apiBase() + "/api/batch", { method: "POST", headers: { "Content-Type": "application/json", "X-Access": st.access },
          body: JSON.stringify({ start: batchStart }) }).catch(() => {});
      }
    } catch (e) {
      if (e.code === "taken" || e.status === 400) { delete cfg.legacy; save(); }
    }
  }

  // ---------- Окно настроек ----------
  // Права админа хранит сервер (у ключа доступа); до первого ответа — по токену, он есть у зарегистрировавшего.
  const isAdmin = (st) => !!st && (st.admin ?? !!st.token);
  function renderSticks() {
    const st = cur();
    $("stick-list").innerHTML = cfg.sticks.length ? cfg.sticks.map((x) => `
      <li><button type="button" class="set-row" data-id="${escapeHtml(x.id)}"><span class="dot${x === st ? " on" : ""}"></span>
        <span class="t"><b>${escapeHtml(stickName(x))}</b><small>${escapeHtml(stickSub(x))}</small></span>
        <span class="tag${isAdmin(x) ? "" : " guest"}">${escapeHtml(t(isAdmin(x) ? "role.owner" : "role.guest"))}</span><span class="ch">›</span></button></li>`).join("")
      : `<li class="empty">${escapeHtml(t("sticks.empty"))}</li>`;
  }
  // Подпись в списке: стиль и день партии.
  function stickSub(x) {
    const style = x.style && Brew.byId[x.style];
    const parts = style ? [style.name[I18N.lang()] || style.name.en] : [];
    parts.push(x.batchStart ? t("set.day", { n: Math.floor((Date.now() - x.batchStart) / 86400e3) + 1 }) : t("set.noBatch"));
    return parts.join(" · ");
  }

  // Экраны настроек: корень (стики, сервер, язык) → страница стика с разделами, добавление, сервер.
  let setPage = "root", setSeg = "batch";
  function showPage(page) {
    const st = cur();
    if (page === "stick" && !st) page = "root";
    setPage = page;
    dlg.querySelectorAll(".set-page").forEach((el) => { el.hidden = el.dataset.page !== page; });
    $("set-back").hidden = page === "root";
    $("set-title").textContent = page === "stick" ? stickName(st)
      : t({ root: "settings.title", add: "sticks.add", server: "settings.server" }[page]);
    $("set-role").hidden = page !== "stick";
    if (page === "stick") {
      $("set-role").textContent = t(isAdmin(st) ? "role.owner" : "role.guest");
      $("set-role").classList.toggle("guest", !isAdmin(st));
    }
    if (page === "root") {
      renderSticks();
      $("set-server-v").textContent = t(cfg.api ? "set.serverCustom" : "set.serverDefault");
      $("set-lang-v").textContent = I18N.name(I18N.lang());
    }
    showSeg(setSeg);
    form.scrollTop = 0;
  }
  function showSeg(seg) {
    setSeg = seg;
    $("set-seg").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.seg === seg)));
    dlg.querySelectorAll(".set-seg").forEach((el) => { el.hidden = el.dataset.segPage !== seg; });
    $("set-actions").hidden = !(setPage === "server" || (setPage === "stick" && seg !== "access"));
    if (setPage === "stick" && seg === "access") syncAccess();
  }
  // Доступ: у гостя — пояснение; список подключённых и очистка истории — только у владельца.
  function syncAccess() {
    const st = cur(), owner = isAdmin(st);
    $("acc-guest").hidden = owner;
    $("history-row").hidden = !owner;
    $("share-box").hidden = true;
    $("stick-error").textContent = $("history-msg").textContent = "";
    $("members").hidden = true; renderMembers();
  }

  // ---------- Кто подключён к стику ----------
  // Из User-Agent достаём браузер и систему: «Chrome · Android».
  function parseUA(ua) {
    if (!ua) return null;
    const os = /iPhone|iPad|iPod/.test(ua) ? (/iPad/.test(ua) ? "iPadOS" : "iOS")
      : /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows" : /Mac OS X|Macintosh/.test(ua) ? "macOS"
      : /CrOS/.test(ua) ? "ChromeOS" : /Linux/.test(ua) ? "Linux" : null;
    const br = /Edg\//.test(ua) ? "Edge" : /SamsungBrowser/.test(ua) ? "Samsung Internet" : /OPR\/|Opera/.test(ua) ? "Opera"
      : /YaBrowser/.test(ua) ? "Yandex" : /Firefox|FxiOS/.test(ua) ? "Firefox" : /CriOS|Chrome\//.test(ua) ? "Chrome"
      : /Safari\//.test(ua) ? "Safari" : null;
    const mobile = /Mobile|Android|iPhone|iPad/.test(ua);
    return { label: [br, os].filter(Boolean).join(" · ") || ua.slice(0, 40), mobile };
  }
  const DEVICE_ICONS = {
    phone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>`,
    desktop: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg>`,
    link: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>`,
  };
  // Список видит и правит только тот, кто зарегистрировал стик (у остальных воркер отвечает 403).
  async function renderMembers() {
    const box = $("members"), st = cur();
    if (!isAdmin(st)) { box.hidden = true; return; }
    let list;
    try { list = (await api("/api/members", {}, st.access)).members || []; }
    catch { box.hidden = true; return; }
    if (cur() !== st) return;
    const used = list.filter((m) => m.last_used != null);
    const pending = list.filter((m) => m.last_used == null);
    const revokeBtn = (m, key) => m.you ? ""
      : `<button type="button" class="revoke" data-revoke="${escapeHtml(m.id)}">${escapeHtml(t(key))}</button>`;
    const adminBtn = (m) => m.you ? ""
      : `<button type="button" class="role" data-admin="${escapeHtml(m.id)}" data-to="${m.kind === "owner" ? "0" : "1"}">${escapeHtml(t(m.kind === "owner" ? "members.unAdmin" : "members.makeAdmin"))}</button>`;
    box.innerHTML = `<h4>${escapeHtml(t("members.title", { name: stickName(st), n: used.length }))}</h4>
      <ul>${used.map((m) => {
        const p = parseUA(m.user_agent);
        const icon = p && p.mobile ? DEVICE_ICONS.phone : DEVICE_ICONS.desktop;
        return `<li>${icon}<span class="who">${escapeHtml(p ? p.label : t("members.unknown"))}${m.you ? ` <span class="you">· ${escapeHtml(t("members.you"))}</span>` : ""}</span>
          <span class="acts">${adminBtn(m)}${revokeBtn(m, "members.revoke")}</span>
          <small>${escapeHtml(t(m.kind === "owner" ? "members.owner" : "members.shared"))} · ${escapeHtml(Date.now() - m.last_used < 5 * 60e3 ? t("members.now") : t("members.active", { ago: ago(m.last_used) }))}</small></li>`;
      }).join("")}
      ${pending.map((m) => `<li>${DEVICE_ICONS.link}<span class="who">${escapeHtml(t("members.link", { date: dayTime(m.created) }))}</span>
          <span class="acts">${revokeBtn(m, "members.revokeLink")}</span><small>${escapeHtml(t("members.notOpened"))}</small></li>`).join("")}</ul>
      <p class="note">${escapeHtml(t("members.hint"))}</p>
      <small class="field-error" id="members-error"></small>`;
    box.hidden = false;
  }
  $("members").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-revoke], [data-admin]");
    if (!b) return;
    const st = cur(), revoke = "revoke" in b.dataset, toAdmin = b.dataset.to === "1";
    if (!confirm(t(revoke ? "members.confirm" : toAdmin ? "members.adminConfirm" : "members.unAdminConfirm"))) return;
    b.disabled = true;
    try {
      if (revoke) await post("/api/members/revoke", { id: b.dataset.revoke }, st.access);
      else await post("/api/members/admin", { id: b.dataset.admin, admin: toAdmin }, st.access);
      renderMembers();
    } catch (err) {
      b.disabled = false;
      $("members-error").textContent = t(revoke ? "members.revokeFail" : "members.adminFail", { message: err.message });
    }
  });

  // Очистить историю выбранного стика (только владелец): на сервере остаётся последнее показание.
  async function clearHistory(btn) {
    const st = cur();
    if (!isAdmin(st) || !confirm(t("history.confirm", { name: stickName(st) }))) return;
    btn.disabled = true;
    try {
      const { deleted } = await post("/api/history/clear", {}, st.access);
      hist = null;
      for (const k of Object.keys(localStorage)) if (k.startsWith(`ispindel.batt.${st.id}.`)) localStorage.removeItem(k);
      $("history-msg").textContent = t("history.done", { n: deleted });
      refresh();
    } catch (err) {
      $("history-msg").textContent = t("history.fail", { message: err.message });
    }
    btn.disabled = false;
  }

  $("stick-list").addEventListener("click", (e) => {
    const row = e.target.closest("[data-id]");
    if (!row) return;
    if (cfg.current !== row.dataset.id) switchStick(row.dataset.id);
    syncForm();
    showPage("stick");
  });
  dlg.querySelectorAll("[data-go]").forEach((b) => { b.onclick = () => showPage(b.dataset.go); });
  $("set-back").onclick = () => { syncForm(); syncServerForm(); showPage("root"); };
  $("set-close").onclick = () => dlg.close();
  $("set-seg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-seg]");
    if (b) showSeg(b.dataset.seg);
  });
  $("set-lang").onclick = () => cycleLang();
  $("set-newbatch").onclick = () => { dlg.close(); openBatchDialog(); };
  $("history-clear").onclick = () => clearHistory($("history-clear"));
  $("share-new").onclick = async () => {
    const x = cur(), btn = $("share-new");
    $("stick-error").textContent = "";
    btn.disabled = true;
    try {
      const { access } = await post("/api/share", {}, x.access);
      const link = location.origin + location.pathname + "#join=" + access;
      $("share-link").textContent = link;
      $("share-box").hidden = false;
      if (navigator.share) {
        try { await navigator.share({ title: t("app.name"), text: stickName(x), url: link }); } catch { /* закрыли */ }
      } else {
        try { await navigator.clipboard.writeText(link); } catch { /* скопируют кнопкой */ }
      }
      renderMembers();
    } catch (err) {
      $("stick-error").textContent = t("sticks.shareFail", { message: err.message });
    } finally { btn.disabled = false; }
  };
  $("stick-remove").onclick = () => {
    const x = cur();
    if (!x || !confirm(t("sticks.removeConfirm", { name: stickName(x) }))) return;
    cfg.sticks = cfg.sticks.filter((s) => s !== x);
    switchStick(cfg.sticks[0] ? cfg.sticks[0].id : "");
    syncForm(); showPage("root");
  };


  // Сервер: по умолчанию скрыт, свой адрес — по кнопке.
  let serverCustom = false;
  function syncServer() {
    $("server-field").hidden = !serverCustom;
    $("server-edit").hidden = serverCustom;
    $("server-default").hidden = serverCustom;
    const shown = serverCustom ? (form.elements.api.value.trim() || "–") : DEFAULT_API;
    $("server-name").textContent = shown.replace(/^https?:\/\//, "");
    syncGuide();
  }
  function formBase() {
    return (serverCustom ? form.elements.api.value.trim() : DEFAULT_API).replace(/\/+$/, "");
  }
  // Инструкция показывает либо вводимый новый токен, либо токен выбранного стика.
  function syncGuide() {
    const base = formBase();
    const typed = form.elements.token.value.trim();
    const st = cur();
    const tok = typed || (st && st.token) || "";
    $("guide-url").textContent = base ? base + "/ingest" : "–";
    $("guide-token").textContent = tok || t(st && !typed ? "guide.tokenOwnerOnly" : "guide.tokenUnset");
    $("guide-token").nextElementSibling.hidden = !tok;
    let host = "–";
    try { host = new URL(base).hostname; } catch { /* ещё не адрес */ }
    $("guide-fallback").textContent = t("guide.fallback", { host });
  }
  // Партия и формула — у каждого стика свои.
  function syncForm() {
    const st = cur();
    form.elements.batchStart.value = toLocalInput(st && st.batchStart);
    form.elements.formula.value = st ? st.formula : "";
    fillStyles(form.elements.style, st && st.style);
    form.elements.fg.value = st && st.fg != null ? st.fg : "";
    form.elements.fg.placeholder = fgPlaceholder(st && st.style);
    form.elements.style.onchange = (e) => { form.elements.fg.placeholder = fgPlaceholder(e.target.value); };
    form.elements.style.disabled = form.elements.fg.disabled = !st;
    $("profile-error").textContent = "";
    form.elements.units.value = (st && st.units) || "auto";
    form.elements.units.disabled = !st;
    $("units-detected").textContent = detectedUnits ? t("units.detected", { units: t("units." + detectedUnits) }) : "";
    $("units-error").textContent = "";
    form.elements.batchStart.disabled = form.elements.formula.disabled = $("batch-now").disabled = !st;
    syncGuide();
  }

  // Поля сервера — как в сохранённых настройках (при открытии и при возврате к списку).
  function syncServerForm() {
    form.elements.api.value = cfg.api;
    serverCustom = !!cfg.api;
    $("api-error").textContent = "";
    syncServer();
  }
  $("open-settings").onclick = () => {
    form.elements.token.value = "";
    form.elements.token.type = "password";
    $("token-show").textContent = t("settings.show");
    $("token-error").textContent = "";
    $("formula-error").textContent = "";
    $("guide").open = !cfg.sticks.length;
    syncForm(); syncServerForm();
    setSeg = "batch";
    showPage(cfg.sticks.length ? "root" : "add");
    dlg.showModal();
  };
  $("batch-now").onclick = () => { form.elements.batchStart.value = toLocalInput(Date.now()); };
  $("token-show").onclick = () => {
    const hidden = form.elements.token.type === "password";
    form.elements.token.type = hidden ? "text" : "password";
    $("token-show").textContent = t(hidden ? "settings.hide" : "settings.show");
  };
  $("token-gen").onclick = () => {
    form.elements.token.value = generateToken();
    form.elements.token.type = "text";
    $("token-show").textContent = t("settings.hide");
    $("token-error").textContent = "";
    $("guide").open = true;
    syncGuide();
  };
  async function onAdd() {
    const tok = form.elements.token.value.trim();
    const problem = tokenProblem(tok);
    if (problem) { $("token-error").textContent = problem; form.elements.token.focus(); return; }
    // Свой сервер — сначала применяем адрес, токен регистрируется на нём.
    if (serverCustom) cfg.api = form.elements.api.value.trim().replace(/\/+$/, "") === DEFAULT_API ? "" : form.elements.api.value.trim().replace(/\/+$/, "");
    const btn = $("token-add"); btn.disabled = true;
    try {
      await addStick(tok);
      $("token-error").textContent = "";
      form.elements.token.value = "";
      renderSticks(); syncForm();
      $("guide").open = true;
      devices = []; refresh();
    } catch (err) {
      $("token-error").textContent = err.code === "taken" ? t("err.tokenTaken") : t("err.register", { message: err.message });
    } finally { btn.disabled = false; }
  }
  $("token-add").onclick = onAdd;
  form.elements.token.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); onAdd(); } });
  form.elements.token.addEventListener("input", () => { $("token-error").textContent = ""; syncGuide(); });
  form.elements.api.addEventListener("input", () => { $("api-error").textContent = ""; syncServer(); });
  $("server-edit").onclick = () => {
    serverCustom = true;
    if (!form.elements.api.value) form.elements.api.value = DEFAULT_API;
    syncServer();
    form.elements.api.focus();
    form.elements.api.select();
  };
  $("server-reset").onclick = () => {
    serverCustom = false;
    form.elements.api.value = "";
    $("api-error").textContent = "";
    syncServer();
  };
  dlg.addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-copy]");
    if (!b) return;
    const text = $(b.dataset.copy).textContent;
    try { await navigator.clipboard.writeText(text); }
    catch {
      const r = document.createRange(); r.selectNodeContents($(b.dataset.copy));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      return;
    }
    b.textContent = t("ui.copied");
    setTimeout(() => { b.textContent = t("ui.copy"); }, 1500);
  });

  // Сохранить: адрес сервера, партия и формула выбранного стика. Стики добавляются и удаляются сразу.
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (e.submitter && e.submitter.value === "cancel") { dlg.close(); return; }
    let api = serverCustom ? form.elements.api.value.trim().replace(/\/+$/, "") : "";
    if (api === DEFAULT_API) api = "";
    if (serverCustom && api && !/^https?:\/\/[^/\s]+/.test(api)) { $("api-error").textContent = t("err.badUrl"); return; }
    cfg.api = api;
    const st = cur();
    if (st) {
      // Полином общий для всех, кто подключён к стику: проверяем, предупреждаем и сохраняем на сервере.
      // Стиль и ожидаемая конечная плотность партии — общие, сохраняем на сервере.
      const style = form.elements.style.value || null, fg = parseFg(form.elements.fg.value);
      if (style !== (st.style ?? null) || fg !== (st.fg ?? null)) {
        try { await postBatch(st, { style, fg }); }
        catch (err) { $("profile-error").textContent = t("err.batch", { message: err.message }); return; }
      }
      // Единицы тоже общие: предупреждаем и сохраняем на сервере.
      const units = form.elements.units.value;
      if (units !== (st.units || "auto")) {
        if (!confirm(t("units.confirm"))) return;
        try {
          const res = await fetch(apiBase() + "/api/units", {
            method: "POST", headers: { "Content-Type": "application/json", "X-Access": st.access }, body: JSON.stringify({ units }),
          });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || String(res.status));
        } catch (err) { $("units-error").textContent = t("err.unitsSave", { message: err.message }); return; }
        st.units = units;
        save();
      }
      const formula = form.elements.formula.value.trim();
      if (formula !== (st.formula || "")) {
        try { compileFormula(formula); }
        catch (err) { $("formula-error").textContent = err.message; form.elements.formula.focus(); return; }
        if (!confirm(t("formula.confirm"))) return;
        try { await postFormula(st, formula); }
        catch (err) { $("formula-error").textContent = t("err.formulaSave", { message: err.message }); return; }
        st.formula = formula;
        save();
      }
      const v = form.elements.batchStart.value;
      const start = v ? new Date(v).getTime() : null;
      // datetime-local хранит минуты — сравниваем с точностью до минуты.
      const same = (start === null && !st.batchStart) || (start !== null && st.batchStart && Math.abs(start - st.batchStart) < 60e3);
      if (!same) {
        save();
        if (!(await setBatch(start))) return;
      }
    }
    save(); syncRanges(); dlg.close(); refresh();
  });

  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    Object.values(charts).forEach((c) => c.destroy()); charts = {}; refresh();
  });

  // Приложение с главного экрана часто висит в фоне: обновляем при возврате и при появлении сети.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  addEventListener("online", refresh);

  // ---------- Установка на телефон ----------
  // Android/Chrome: ловим beforeinstallprompt и показываем свою кнопку.
  // iOS: такого события нет — показываем инструкцию «Поделиться → На экран „Домой“».
  // Не показываем, если приложение уже запущено как установленное или недавно нажали «Не сейчас».
  const INSTALL_STORE = "ispindel.installLater";
  const installed = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let deferredInstall = null, installIOS = false;
  const syncInstallText = () => { $("install-later").textContent = t(installIOS ? "install.ok" : "install.later"); };
  function installSnoozed() {
    try { return Date.now() - Number(localStorage.getItem(INSTALL_STORE) || 0) < 14 * 86400e3; } catch { return false; }
  }
  function showInstall(ios) {
    if (installed() || installSnoozed()) return;
    installIOS = ios;
    $("install-android").hidden = ios;
    $("install-ios").hidden = !ios;
    $("install-go").hidden = ios;
    syncInstallText();
    $("install").hidden = false;
    document.body.classList.add("has-install");
  }
  addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstall = e;
    showInstall(false);
  });
  const hideInstall = () => { $("install").hidden = true; document.body.classList.remove("has-install"); };
  addEventListener("appinstalled", () => { hideInstall(); deferredInstall = null; });
  $("install-go").onclick = async () => {
    hideInstall();
    if (!deferredInstall) return;
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch { /* закрыли */ }
    deferredInstall = null;
  };
  $("install-later").onclick = () => {
    hideInstall();
    try { localStorage.setItem(INSTALL_STORE, String(Date.now())); } catch { /* приватный режим */ }
  };
  if (isIOS) setTimeout(() => showInstall(true), 2500);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch((e) => console.warn("Service worker not registered", e));
  }

  // Язык — маленькая кнопка: каждый клик переключает на следующий по кругу.
  const LANG_CYCLE = ["en", "uk", "ru", "es"];
  I18N.use(I18N.detect());
  // Язык переключается по кругу в настройках (строка «Язык»).
  function cycleLang() {
    const next = LANG_CYCLE[(LANG_CYCLE.indexOf(I18N.lang()) + 1) % LANG_CYCLE.length];
    I18N.use(next, true);
    applyStatic(); syncInstallText();
    if (dlg.open) { showPage(setPage); syncServer(); }
    // Axis ticks and tooltips are baked into the chart options, so rebuild them.
    Object.values(charts).forEach((c) => c.destroy());
    charts = {};
    refresh();
  }
  applyStatic();

  syncRanges();
  (async () => {
    await handleJoin();
    await migrateLegacy();
    refresh();
  })();
  setInterval(() => { if (!document.hidden) refresh(); }, 60e3);
})();
</script>
</body>
</html>
