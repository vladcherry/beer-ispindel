<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beer iSpindel</title>
<meta name="description" content="Gravity, temperature and battery from an iSpindel while the beer ferments.">
<meta name="theme-color" content="#eef1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131715" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beer iSpindel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="vendor/chart-4.4.1.umd.min.js"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="analysis.js"></script>
<script src="styles.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #eef1ec;
  --surface: #f8faf6;
  --ink: #1e2522;
  --muted: #5e6a64;
  --rule: #cfd6cf;
  --amber: #c9861a;
  --amber-soft: rgba(201, 134, 26, .18);
  --amber-deep: #8a5a0f;
  --teal: #2f6f73;
  --violet: #7a4fa3;
  --alert: #b4412c;
  --ok: #3f7a4a;
  --glass: rgba(255, 255, 255, .55);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #131715;
    --surface: #1b201d;
    --ink: #e6ebe7;
    --muted: #94a199;
    --rule: #2e3631;
    --amber: #e3a43a;
    --amber-soft: rgba(227, 164, 58, .2);
    --amber-deep: #f0c070;
    --teal: #6bb3b6;
    --violet: #b48ed8;
    --alert: #e0735c;
    --ok: #7fbf8a;
    --glass: rgba(255, 255, 255, .06);
  }
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
}
main { max-width: 980px; margin: 0 auto; padding: 20px 20px 48px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* Шапка */
.top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { font: 600 28px/1.1 var(--display); margin: 0; letter-spacing: .01em; min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top h1 select { max-width: 100%; }
.seen-row { display: flex; align-items: center; gap: 4px; min-height: 32px; }
.icon-btn.round {
  display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0; flex: none;
  border: 0; border-radius: 50%; background: transparent; color: var(--muted);
}
.icon-btn.round.small { width: 32px; height: 32px; }
.icon-btn.round:hover { background: var(--surface); color: var(--ink); }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .icon-btn.spin svg { animation: none; opacity: .5; } }
.top h1 select {
  font: 600 28px/1.1 var(--display); border: 0; background: transparent; padding: 0; cursor: pointer;
}
.top-actions select.icon-btn { padding: 6px 8px; }
.seen { color: var(--muted); font-size: 15px; }
.seen.stale { color: var(--alert); }
.top-actions { display: flex; gap: 8px; align-items: center; flex: none; }
.icon-btn {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; font-size: 15px;
}
.icon-btn:hover { border-color: var(--muted); }

/* Главная плашка: две одинаковые плитки — плотность (с алкоголем) и температура.
   Цвет каждой — по своему показателю: зелёный в норме, жёлтый у границы, красный — проблема. */
.hero { margin-top: 16px; display: grid; gap: 10px; }
.band { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile {
  display: flex; flex-direction: column; gap: 6px; min-width: 0; border-radius: 18px; padding: 12px 13px; color: #fff;
  background: linear-gradient(140deg, #8f9b94, #67746c);
}
.tile.good { background: linear-gradient(140deg, #4f9a5b, #2f6f45); }
.tile.warn { background: linear-gradient(140deg, #d99a2b, #b4740f); }
.tile.bad { background: linear-gradient(140deg, #c95a3f, #9b3220); }
.band button { border: 0; background: none; color: inherit; padding: 0; text-align: left; cursor: pointer; display: grid; gap: 5px; align-content: start; border-radius: 10px; font: inherit; min-width: 0; }
.band button.tile { display: flex; padding: 12px 13px; border-radius: 18px; color: #fff; }
.band button:focus-visible { outline-color: #fff; }
.band-label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; opacity: .92; }
.band-label svg { width: 22px; height: 22px; }
.band .big { font: 500 clamp(44px, 13.5vw, 66px)/.9 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.band .big small { font-size: .36em; margin-left: 3px; opacity: .85; }
.band .sub { font-size: 12.5px; opacity: .92; }
.band .bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .3); overflow: hidden; }
.band .bar i { display: block; height: 100%; background: #fff; border-radius: 3px; }
.band .scale { position: relative; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .3); margin-top: 4px; }
.band .scale .zone { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: rgba(255, 255, 255, .6); }
.band .scale .mark { position: absolute; top: -4px; width: 4px; height: 14px; border-radius: 2px; background: #fff; transform: translateX(-50%); box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .25); }
.band .scale-l { display: flex; justify-content: space-between; font-size: 12px; opacity: .92; }
.band .msg { font-size: 12.5px; background: rgba(0, 0, 0, .14); border-radius: 8px; padding: 4px 7px; }
.band-g { flex: 1; }
.band-abv { gap: 2px !important; margin-top: auto; border-top: 1px solid rgba(255, 255, 255, .3); padding-top: 6px !important; border-radius: 0 !important; }
.band-abv span { font-size: 12.5px; opacity: .92; }
.band-abv b { font: 600 24px/1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.band-abv b small { font: 500 13px var(--body); opacity: .9; margin-left: 4px; }
.band-abv { position: relative; }
.band-abv.bad::after {
  content: "!"; position: absolute; top: -9px; right: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--alert); color: #fff;
  font: 700 12px/18px var(--body); text-align: center; box-shadow: 0 0 0 2px #fff;
}

/* Демо: пока не добавлено ни одного iSpindel */
.demo { margin-top: 14px; display: grid; gap: 8px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px dashed var(--amber); }
.demo-head { display: flex; align-items: center; gap: 8px; }
.demo-tag { font: 700 12px/1 var(--body); letter-spacing: .08em; color: #fff; background: var(--amber); border-radius: 6px; padding: 4px 7px; }
.demo p, .demo ul { margin: 0; font-size: 14px; color: var(--muted); }
.demo ul { padding-left: 18px; display: grid; gap: 4px; }
.demo button { justify-self: start; }
body.is-demo .hero, body.is-demo .charts { position: relative; }
body.is-demo .hero::before, body.is-demo .charts::before {
  content: attr(data-demo); position: absolute; z-index: 2; top: -9px; left: 50%; transform: translateX(-50%);
  font: 700 11px/1 var(--body); letter-spacing: .2em; color: #fff; background: var(--amber); border-radius: 6px; padding: 4px 8px; pointer-events: none;
}

/* Значки показателей */
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.chip {
  display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 0;
  border: 1px solid var(--rule); background: var(--surface); border-radius: 12px; padding: 8px 4px; cursor: pointer;
  font: 600 17px/1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip svg { width: 22px; height: 22px; flex: none; }
.chip:hover { border-color: var(--muted); }
/* Уровень: зелёный — в норме с запасом, жёлтый — у границы, красный — за пределами */
.chip.good { border-color: color-mix(in srgb, var(--ok) 55%, var(--rule)); background: color-mix(in srgb, var(--ok) 7%, var(--surface)); }
.chip.good svg { color: var(--ok) !important; }
.chip.warn { border-color: var(--amber); color: var(--amber-deep); background: color-mix(in srgb, var(--amber) 10%, var(--surface)); }
.chip.warn svg { color: var(--amber) !important; }
.chip.bad { border-color: var(--alert); color: var(--alert); background: color-mix(in srgb, var(--alert) 8%, var(--surface)); }
.chip.bad svg { color: var(--alert) !important; }

/* Информационная панель брожения */
.info { background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--muted); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.info.ok { border-left-color: var(--ok); } .info.ok b { color: var(--ok); }
.info.idle { border-left-color: var(--amber); } .info.idle b { color: var(--amber-deep); }
.info.bad { border-left-color: var(--alert); } .info.bad b { color: var(--alert); }
.info .row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; color: var(--muted); font-size: 13px; }

/* Панель партии */
.batchp { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
.batchp h3 { margin: 0; font: 600 18px/1.2 var(--display); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.batchp h3 small { font: 400 13px var(--body); color: var(--muted); }
.batchp .style { color: var(--muted); font-size: 13px; margin-top: 2px; }
.prog { height: 10px; border-radius: 5px; background: var(--rule); position: relative; margin: 12px 0 6px; overflow: hidden; }
.prog i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #d99a2b, #b8741a); border-radius: 5px; }
.scale { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.kv { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; }
.kv div { display: grid; }
.kv small { font-size: 12px; color: var(--muted); }
.kv b { font: 600 21px/1.15 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.eta { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.eta b { color: var(--ink); }
.batchp .hint { color: var(--muted); font-size: 14px; margin: 0; }
.batchp button.act {
  margin-top: 10px; padding: 8px 14px; border: 1px solid var(--amber); border-radius: 8px;
  background: transparent; color: var(--amber-deep); font-size: 15px; font-weight: 600; cursor: pointer;
}
.batchp button.act:hover { background: var(--amber-soft); }

/* Панель действий партии */
.actbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 12px -12px -12px; border-top: 1px solid var(--rule); }
.actbar button {
  display: grid; justify-items: center; gap: 3px; padding: 9px 4px; border: 0; background: none; cursor: pointer;
  font-size: 13px; color: var(--ink); line-height: 1.2;
}
.actbar button + button { border-left: 1px solid var(--rule); }
.actbar button.main { color: var(--amber-deep); font-weight: 600; }
.actbar button:hover { background: var(--amber-soft); }
.actbar button:first-child { border-bottom-left-radius: 12px; } .actbar button:last-child { border-bottom-right-radius: 12px; }
.actbar svg { width: 20px; height: 20px; }

/* Карточка стиля и справочник — лист снизу */
dialog.sheet {
  margin: auto auto 0; width: min(560px, 100%); max-width: 100%; max-height: 88vh; overflow: auto;
  border-radius: 18px 18px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px));
}
dialog.sheet::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--rule); margin: 0 auto 10px; }
@media (prefers-reduced-motion: no-preference) {
  dialog.sheet[open] { animation: sheet-in .28s cubic-bezier(.2, .7, .2, 1); }
  @keyframes sheet-in { from { transform: translateY(40px); opacity: .4; } }
}
.sheet .top-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.sheet .back, .sheet .x { border: 0; background: none; color: var(--amber-deep); font-size: 14px; cursor: pointer; padding: 4px 0; }
.sheet .x { color: var(--muted); font-size: 22px; line-height: 1; margin-left: auto; }
.sheet h2 { font: 600 26px/1.1 var(--display); margin: 0; }
.sheet .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.sheet p { font-size: 15px; margin: 10px 0; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
.facts div { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.facts small { display: block; font-size: 12px; color: var(--muted); }
.facts b { font: 600 19px/1.2 var(--display); }
.cmp { font-size: 13px; color: var(--muted); margin: 8px 0; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.cmp .okk { color: var(--ok); font-weight: 600; } .cmp .out { color: var(--alert); font-weight: 600; }
.sheet h3 { font: 600 17px/1.2 var(--display); margin: 12px 0 4px; }
.tips { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 4px; }
.sheet .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.sheet .btns a, .sheet .btns button {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-size: 15px; font-weight: 600;
  border: 1px solid var(--rule); background: transparent; color: var(--ink); text-decoration: none; cursor: pointer;
}
.sheet .btns .main { border-color: var(--amber); background: var(--amber); color: #fff; }
.sheet .btns svg { width: 16px; height: 16px; }
.current-mark { display: inline-block; font-size: 12px; color: var(--ok); font-weight: 600; margin-top: 4px; }
.cat-search { width: 100%; border: 1px solid var(--rule); border-radius: 10px; padding: 9px 12px; background: var(--bg); color: var(--ink); font-size: 15px; margin: 10px 0 8px; }
.cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.cats button { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; cursor: pointer; color: var(--ink); }
.cats button[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: #fff; }
.cat-list { list-style: none; margin: 0; padding: 0; }
.cat-list button {
  width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 0;
  border: 0; border-top: 1px solid var(--rule); background: none; cursor: pointer; text-align: left; color: var(--ink); font-size: 15px;
}
.cat-list small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.cat-list .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.cat-list .cur { color: var(--ok); font-weight: 600; }

/* Кто подключён к стику */
.members { background: var(--bg); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
.members h4 { margin: 0 0 6px; font: 600 16px/1.2 var(--display); }
.members ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.members li {
  display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: start; gap: 0 8px; font-size: 14px;
  padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none;
}
.members li svg { width: 20px; height: 20px; color: var(--muted); margin-top: 1px; }
.members li small { grid-column: 2 / 4; color: var(--muted); font-size: 12px; }
.members .revoke { font-size: 12px; padding: 2px 8px; border: 1px solid var(--alert); color: var(--alert); background: transparent; border-radius: 6px; cursor: pointer; }
.members .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.members .role { font-size: 12px; padding: 2px 8px; border: 1px solid var(--rule); color: var(--ink); background: var(--surface); border-radius: 6px; cursor: pointer; }
.members .revoke:hover { background: color-mix(in srgb, var(--alert) 10%, transparent); }
.members .you { color: var(--ok); font-weight: 600; }
.members .note { margin: 6px 0 0; font-size: 12px; color: var(--muted); }

/* Рекомендации */
.recs { margin-top: 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
.recs h2 { font: 600 20px/1.2 var(--display); margin: 0 0 6px; }
.rec { display: grid; grid-template-columns: 22px 1fr; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--rule); }
.rec:first-of-type { border-top: 0; }
.rec .mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--body); color: #fff; background: var(--ok); margin-top: 1px; }
.rec.warn .mark, .rec.bad .mark { background: var(--alert); }
.rec b { font-weight: 600; }
.rec ul { margin: 2px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; color: var(--muted); grid-column: 2; }
.rec li.warn, .rec li.bad { color: var(--ink); }
.rec li.warn::before, .rec li.bad::before { content: "▲ "; color: var(--alert); font-size: 11px; }
.rec li.warn::before { color: var(--amber); }

/* Всплывающая подсказка у показателей */
.pop {
  position: absolute; z-index: 20; width: min(330px, calc(100vw - 24px));
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.4;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .28);
}
.pop h4 { margin: 0 0 6px; font: 600 17px/1.2 var(--display); }
.pop dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 8px; font-size: 13px; }
.pop dt { opacity: .7; } .pop dd { margin: 0; font-variant-numeric: tabular-nums; }
.pop ul { margin: 0; padding-left: 16px; display: grid; gap: 4px; }
.pop li.warn { color: #ffd27a; }
.pop li.bad { color: #ffb4a6; }
.pop .close { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: inherit; opacity: .6; font-size: 18px; cursor: pointer; }

/* Графики */
.charts { margin-top: 24px; display: grid; gap: 10px; }
.chart-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 8px 10px; }
.chart-card .chart-label { margin-top: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; }
.chart-note { margin-left: auto; font-size: 12px; }
.charts-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.charts-head h2 { font: 600 22px/1.2 var(--display); margin: 0; }
.ranges { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.ranges button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.ranges button + button { border-left: 1px solid var(--rule); }
.ranges button[aria-pressed="true"] { background: var(--amber); color: #fff; }
.ranges button[hidden] { display: none; }
.chart-box { position: relative; height: 200px; margin-top: 6px; }
.chart-label { font-size: 14px; color: var(--muted); margin-top: 18px; }
.chart-label .sw { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.smooth { font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; margin-left: 12px; }

.notice { margin-top: 24px; padding: 14px 16px; border-left: 3px solid var(--amber); background: var(--surface); border-radius: 0 8px 8px 0; }
.notice.error { border-left-color: var(--alert); }

/* Настройки */
dialog {
  border: 0; border-radius: 14px; padding: 0; width: min(520px, calc(100vw - 32px));
  background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
dialog::backdrop { background: rgba(10, 14, 12, .45); }
dialog form { padding: 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (max-width: 480px) { dialog form { padding: 18px 16px; } }
dialog h2 { font: 600 24px/1.1 var(--display); margin: 0; }
label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
label select { min-width: 0; border: 1px solid var(--rule); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 15px; color: var(--ink); width: 100%; }
label input { border: 1px solid var(--rule); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 15px; color: var(--ink); min-width: 0; width: 100%; }
label small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: end; }
.row label { flex: 1; min-width: 0; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
.field-row { display: flex; gap: 6px; flex-wrap: wrap; }
.field-row button { flex: none; }
.field-row input { flex: 1 1 160px; min-width: 0; width: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.field-error { color: var(--alert); font-size: 13px; }
.field-error:empty { display: none; }
.link { background: none; border: 0; padding: 0; color: var(--amber-deep); text-decoration: underline; cursor: pointer; font-size: 14px; }
.server { font-size: 14px; color: var(--muted); display: grid; gap: 6px; }
.server b { color: var(--ink); font-weight: 500; word-break: break-all; }
.guide { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; background: var(--bg); }
.guide summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.guide ol { margin: 10px 0 4px; padding-left: 20px; display: grid; gap: 8px; font-size: 14px; }
.guide dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; margin: 8px 0 0; align-items: center; }
.guide dt { color: var(--muted); font-size: 13px; }
.guide dd { margin: 0; display: flex; gap: 6px; align-items: center; min-width: 0; }
.guide code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 2px 6px; overflow-wrap: anywhere; }
.copy { font-size: 12px; padding: 2px 8px; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; cursor: pointer; flex: none; }
.guide .note { color: var(--muted); font-size: 13px; }
/* Настройки: список → страница стика (разделы Партия / Измерения / Доступ) */
.set-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.set-head h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set-icon { flex: none; border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 6px; cursor: pointer; }
.set-icon.back { color: var(--teal); font-size: 30px; margin-left: -6px; }
.tag { flex: none; font-size: 12px; border-radius: 999px; padding: 2px 8px; background: var(--amber-soft); color: var(--amber-deep); white-space: nowrap; }
.tag.guest { background: var(--bg); color: var(--muted); border: 1px solid var(--rule); }
.set-page, .set-seg { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.gl { font: 600 12px/1 var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 4px -6px; }
.set-list { list-style: none; margin: 0; padding: 0; background: var(--bg); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.set-list li + li { border-top: 1px solid var(--rule); }
.set-list li.empty { padding: 12px; color: var(--muted); font-size: 14px; }
.set-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; border: 0; background: none; text-align: left; color: var(--ink); font: inherit; cursor: pointer; }
.set-row .t { flex: 1; min-width: 0; }
.set-row .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set-row .t small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set-row .accent { color: var(--teal); }
.set-row .ic { flex: none; width: 22px; display: flex; justify-content: center; color: var(--teal); }
.set-row .ic svg { width: 20px; height: 20px; }
.set-row .v { color: var(--muted); font-size: 13px; white-space: nowrap; }
.set-row .ch { color: var(--muted); font-size: 20px; line-height: 1; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--rule); margin: 0 6px; }
.dot.on { background: var(--ok); }
.seg { display: flex; gap: 2px; padding: 3px; background: var(--bg); border: 1px solid var(--rule); border-radius: 10px; }
.seg button { flex: 1; min-width: 0; border: 0; background: none; padding: 7px 4px; border-radius: 7px; font: 600 14px var(--body); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
.set-card { display: grid; gap: 8px; padding: 12px; background: var(--bg); border: 1px solid var(--rule); border-radius: 12px; }
.set-card h4 { margin: 0; font: 600 16px/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.set-card.danger { border-color: color-mix(in srgb, var(--alert) 45%, transparent); }
.set-card.danger h4 { color: var(--alert); }
.set-card .note { color: var(--muted); font-size: 13px; }
.set-card .note:empty { display: none; }
.set-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
.set-note { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--bg); color: var(--muted); font-size: 14px; }
.btn-danger { flex: none; font-size: 13px; padding: 5px 10px; border: 1px solid var(--alert); color: var(--alert); background: transparent; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn-danger:hover { background: color-mix(in srgb, var(--alert) 10%, transparent); }
.muted { color: var(--muted); font-size: 14px; margin: 0; }
.share-box { display: grid; gap: 6px; }
.share-box code { flex: 1; min-width: 0; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 6px; overflow-wrap: anywhere; }
#stick-switch { font: 600 28px/1.1 var(--display); border: 0; background: transparent; padding: 0; cursor: pointer; max-width: 100%; }
#device-switch { margin-top: 4px; font-size: 15px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); padding: 2px 6px; }
.guide dd code { flex: 1 1 auto; min-width: 0; }
@media (max-width: 480px) {
  .guide { padding: 10px 12px; }
  .guide ol { padding-left: 18px; }
  .guide dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .guide dt { margin-top: 6px; }
}
.primary { background: var(--amber); color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
.secondary { background: transparent; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 14px; cursor: pointer; }

/* Предложение установить приложение */
.install {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  max-width: 520px; margin: 0 auto; display: flex; gap: 12px; align-items: flex-start;
  padding: 14px; border-radius: 14px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--rule); box-shadow: 0 12px 40px rgba(0, 0, 0, .22);
}
.install img { border-radius: 10px; flex: none; }
body.has-install main { padding-bottom: 220px; }
.install-body { flex: 1; min-width: 0; display: grid; gap: 6px; font-size: 14px; }
.install-body b { font: 600 18px/1.2 var(--display); }
.install-body p { margin: 0; color: var(--muted); }
.install-body ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.install-actions { display: flex; gap: 8px; margin-top: 4px; }
.ios-share { width: 18px; height: 18px; vertical-align: -3px; color: #0a84ff; }
@media (prefers-reduced-motion: no-preference) {
  .install:not([hidden]) { animation: install-in .35s cubic-bezier(.2, .7, .2, 1); }
  @keyframes install-in { from { transform: translateY(24px); opacity: 0; } }
}

@media (max-width: 640px) {
  main { padding: 16px 14px 40px; }
  .chart-box { height: 170px; }
}

</style>
</head>
<body>
<main>
  <header class="top">
    <div class="title-row">
      <h1 id="title" data-i18n="app.name"></h1>
      <div class="top-actions">
        <button class="icon-btn round" id="open-settings" type="button" data-i18n-label="ui.settings" data-i18n-title="ui.settings"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </div>
    <div class="seen-row">
      <span class="seen" id="seen" data-i18n="status.loading"></span>
      <button class="icon-btn round small" id="refresh" type="button" data-i18n-label="ui.refresh" data-i18n-title="ui.refresh"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
    </div>
  </header>

  <section class="demo" id="demo" hidden>
    <div class="demo-head"><span class="demo-tag" data-i18n="demo.tag"></span><b data-i18n="demo.title"></b></div>
    <p data-i18n="demo.text"></p>
    <ul>
      <li data-i18n="demo.share"></li>
      <li data-i18n="demo.token"></li>
    </ul>
    <button class="primary" type="button" id="demo-add" data-i18n="sticks.add"></button>
  </section>
  <div id="notice"></div>

  <section class="hero" id="hero" hidden>
    <div class="band">
      <div class="tile" id="tile-g">
        <button class="band-g" id="band-g" type="button">
          <span class="band-label"><span id="g-icon"></span><span data-i18n="band.gravity"></span></span>
          <span class="big"><span id="g-value">–</span><small>°P</small></span>
          <span class="sub" id="g-sg"></span>
          <span class="bar" id="g-bar"><i></i></span>
          <span class="sub" id="g-prog"></span>
        </button>
        <button class="band-abv" id="band-abv" type="button">
          <span data-i18n="band.abv"></span>
          <b id="abv-value">–</b>
        </button>
      </div>
      <button class="tile" id="band-t" type="button">
        <span class="band-label"><span id="t-icon"></span><span data-i18n="device.temperature"></span></span>
        <span class="big"><span id="t-value">–</span><small id="t-unit">°C</small></span>
        <span class="scale" id="t-scale"><span class="zone"></span><span class="mark"></span></span>
        <span class="scale-l" id="t-scale-l"><span></span><span data-i18n="tile.norm"></span><span></span></span>
        <span class="msg" id="t-msg"></span>
      </button>
    </div>
    <div class="chips">
      <button class="chip" id="chip-batt" type="button"></button>
      <button class="chip" id="chip-wifi" type="button"></button>
      <button class="chip" id="chip-rate" type="button"></button>
    </div>
    <div class="info" id="info"></div>
    <div class="batchp" id="batchp"></div>
  </section>

  <section class="charts" id="charts" hidden>
    <div class="charts-head">
      <h2 data-i18n="charts.history"></h2>
      <div class="ranges" id="ranges" role="group" data-i18n-label="charts.period">
        <button type="button" data-range="1h" data-i18n="range.1h"></button>
        <button type="button" data-range="6h" data-i18n="range.6h"></button>
        <button type="button" data-range="24h" data-i18n="range.24h"></button>
        <button type="button" data-range="3d" data-i18n="range.3d"></button>
        <button type="button" data-range="7d" data-i18n="range.7d"></button>
        <button type="button" data-range="batch" hidden data-i18n="range.batch"></button>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-label"><span class="sw" style="background:var(--amber)"></span><span data-i18n="charts.gravity"></span>
        <label class="smooth"><input type="checkbox" id="smooth" checked><span data-i18n="charts.smooth"></span></label></div>
      <div class="chart-box"><canvas id="chart-g"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-label"><span class="sw" style="background:var(--teal)"></span><span data-i18n="charts.temperature"></span>
        <span class="chart-note" id="t-note"></span></div>
      <div class="chart-box"><canvas id="chart-t"></canvas></div>
    </div>
    <div class="chart-card" id="abv-card">
      <div class="chart-label"><span class="sw" style="background:var(--violet)"></span><span data-i18n="charts.abv"></span></div>
      <div class="chart-box"><canvas id="chart-a"></canvas></div>
    </div>
  </section>

  <section class="recs" id="recs" hidden></section>
  <div class="pop" id="pop" hidden role="dialog"></div>
</main>

<dialog id="sheet" class="sheet"><div id="sheet-body"></div></dialog>

<dialog id="batch-dlg">
  <form method="dialog" id="batch-form">
    <h2 data-i18n="batchdlg.title"></h2>
    <label><span data-i18n="batchdlg.style"></span>
      <select name="style" class="style-select"></select>
      <small id="style-info"></small>
    </label>
    <label><span data-i18n="batchdlg.fg"></span>
      <input name="fg" type="number" step="0.1" min="-5" max="30" inputmode="decimal">
      <small data-i18n="batchdlg.fgHint"></small>
    </label>
    <label><span data-i18n="batchdlg.start"></span>
      <input name="start" type="datetime-local">
    </label>
    <small class="field-error" id="batchdlg-error"></small>
    <div class="dialog-actions">
      <button class="secondary" value="cancel" formnovalidate data-i18n="settings.cancel"></button>
      <button class="primary" value="go" data-i18n="batchdlg.go"></button>
    </div>
  </form>
</dialog>

<aside class="install" id="install" hidden role="dialog" aria-labelledby="install-title">
  <img src="icons/icon-192.png" alt="" width="44" height="44">
  <div class="install-body">
    <b id="install-title" data-i18n="install.title"></b>
    <p id="install-android" data-i18n="install.text"></p>
    <ol id="install-ios" hidden>
      <li><span data-i18n="install.ios1"></span> <svg class="ios-share" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 10H6.5A1.5 1.5 0 0 0 5 11.5v8A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-8a1.5 1.5 0 0 0-1.5-1.5H16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></li>
      <li data-i18n="install.ios2"></li>
      <li data-i18n="install.ios3"></li>
    </ol>
    <div class="install-actions">
      <button class="primary" type="button" id="install-go" data-i18n="install.button"></button>
      <button class="secondary" type="button" id="install-later"></button>
    </div>
  </div>
</aside>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <div class="set-head">
      <button class="set-icon back" type="button" id="set-back" hidden data-i18n-label="set.back">‹</button>
      <h2 id="set-title"></h2>
      <span class="tag" id="set-role" hidden></span>
      <button class="set-icon" type="button" id="set-close" data-i18n-label="settings.cancel">✕</button>
    </div>

    <div class="set-page" data-page="root">
      <h3 class="gl" data-i18n="sticks.title"></h3>
      <ul class="set-list" id="stick-list"></ul>
      <ul class="set-list">
        <li><button type="button" class="set-row" data-go="add"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
          <span class="t"><b class="accent" data-i18n="sticks.add"></b><small data-i18n="set.addSub"></small></span><span class="ch">›</span></button></li>
      </ul>
      <h3 class="gl" data-i18n="set.app"></h3>
      <ul class="set-list">
        <li><button type="button" class="set-row" data-go="server"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg></span>
          <span class="t"><b data-i18n="settings.server"></b></span><span class="v" id="set-server-v"></span><span class="ch">›</span></button></li>
        <li><button type="button" class="set-row" id="set-lang"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h8M8 3v2M6 5c0 4 2.5 7 6 8M10 5c0 4-2.5 7-6 8M13 21l4-9 4 9M14.5 18h5"/></svg></span>
          <span class="t"><b data-i18n="ui.language"></b></span><span class="v" id="set-lang-v"></span><span class="ch">›</span></button></li>
      </ul>
    </div>

    <div class="set-page" data-page="stick" hidden>
      <div class="seg" id="set-seg" role="group">
        <button type="button" data-seg="batch" data-i18n="seg.batch"></button>
        <button type="button" data-seg="measure" data-i18n="seg.measure"></button>
        <button type="button" data-seg="access" data-i18n="seg.access"></button>
      </div>
      <div class="set-seg" data-seg-page="batch">
        <div class="row">
          <label><span data-i18n="settings.batchStart"></span>
            <input name="batchStart" type="datetime-local">
            <small data-i18n="settings.batchHint"></small>
          </label>
          <button class="secondary" type="button" id="batch-now" data-i18n="settings.now"></button>
        </div>
        <label><span data-i18n="batchdlg.style"></span>
          <select name="style" class="style-select"></select>
        </label>
        <label><span data-i18n="batchdlg.fg"></span>
          <input name="fg" type="number" step="0.1" min="-5" max="30" inputmode="decimal">
          <small data-i18n="batchdlg.fgHint"></small>
          <small class="field-error" id="profile-error"></small>
        </label>
        <div class="set-card"><div class="set-line"><span data-i18n="set.newBatchText"></span><button class="secondary" type="button" id="set-newbatch" data-i18n="set.newBatch"></button></div></div>
      </div>
      <div class="set-seg" data-seg-page="measure" hidden>
        <label><span data-i18n="settings.units"></span>
          <select name="units">
            <option value="auto" data-i18n="units.auto"></option>
            <option value="P" data-i18n="units.P"></option>
            <option value="SG" data-i18n="units.SG"></option>
          </select>
          <small id="units-detected"></small>
          <small data-i18n="settings.unitsHint"></small>
          <small class="field-error" id="units-error"></small>
        </label>
        <label><span data-i18n="settings.formula"></span>
          <input name="formula" type="text" placeholder="-0.0322987*tilt^2+2.643882645*tilt-38.64180015" autocomplete="off" spellcheck="false">
          <small data-i18n="settings.formulaHint"></small>
          <small data-i18n="settings.formulaShared"></small>
          <small class="field-error" id="formula-error"></small>
        </label>
      </div>
      <div class="set-seg" data-seg-page="access" hidden>
        <p class="set-note" id="acc-guest" data-i18n="acc.guest"></p>
        <div class="set-card">
          <h4 data-i18n="sticks.share"></h4>
          <small class="muted" data-i18n="sticks.shareHint"></small>
          <div class="share-box" id="share-box" hidden>
            <div class="field-row"><code id="share-link"></code><button class="copy" type="button" data-copy="share-link" data-i18n="ui.copy"></button></div>
          </div>
          <div><button class="secondary" type="button" id="share-new" data-i18n="acc.shareBtn"></button></div>
          <small class="field-error" id="stick-error"></small>
        </div>
        <div class="members" id="members" hidden></div>
        <div class="set-card danger">
          <h4 data-i18n="acc.danger"></h4>
          <div class="set-line" id="history-row"><span data-i18n="acc.clear"></span><button class="btn-danger" type="button" id="history-clear" data-i18n="acc.clearBtn"></button></div>
          <small class="note" id="history-msg"></small>
          <div class="set-line"><span data-i18n="acc.remove"></span><button class="btn-danger" type="button" id="stick-remove" data-i18n="acc.removeBtn"></button></div>
        </div>
      </div>
    </div>

    <div class="set-page" data-page="add" hidden>
      <label><span data-i18n="settings.token"></span>
        <span class="field-row">
          <input name="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="64" data-i18n-placeholder="settings.token">
          <button class="secondary" type="button" id="token-show" data-i18n="settings.show"></button>
          <button class="secondary" type="button" id="token-gen" data-i18n="settings.generate"></button>
          <button class="primary" type="button" id="token-add" data-i18n="sticks.addBtn"></button>
        </span>
        <small data-i18n="settings.tokenHint"></small>
        <small class="field-error" id="token-error"></small>
      </label>
      <details class="guide" id="guide">
        <summary data-i18n="guide.title"></summary>
        <ol>
          <li data-i18n="guide.step1"></li>
          <li data-i18n="guide.step2"></li>
          <li><span data-i18n="guide.step3"></span>
            <dl>
              <dt data-i18n="guide.serviceType"></dt><dd><code>HTTPS Post</code></dd>
              <dt data-i18n="guide.serverUrl"></dt><dd><code id="guide-url"></code><button class="copy" type="button" data-copy="guide-url" data-i18n="ui.copy"></button></dd>
              <dt data-i18n="guide.token"></dt><dd><code id="guide-token"></code><button class="copy" type="button" data-copy="guide-token" data-i18n="ui.copy"></button></dd>
              <dt data-i18n="guide.interval"></dt><dd><code data-i18n="guide.intervalValue"></code></dd>
            </dl>
          </li>
          <li data-i18n="guide.step4"></li>
          <li data-i18n="guide.step5"></li>
        </ol>
        <p class="note" id="guide-fallback"></p>
      </details>
    </div>

    <div class="set-page" data-page="server" hidden>
      <div class="server">
        <div><span data-i18n="settings.server"></span>: <b id="server-name"></b> <span id="server-default" data-i18n="settings.serverDefault"></span></div>
        <div><button class="link" type="button" id="server-edit" data-i18n="settings.serverCustom"></button></div>
        <label id="server-field" hidden><span data-i18n="settings.serverAddress"></span>
          <span class="field-row">
            <input name="api" type="url" data-i18n-placeholder="settings.apiPlaceholder" autocomplete="off" spellcheck="false">
            <button class="secondary" type="button" id="server-reset" data-i18n="settings.serverReset"></button>
          </span>
          <small class="field-error" id="api-error"></small>
        </label>
      </div>
    </div>

    <div class="dialog-actions" id="set-actions">
      <button class="primary" value="save" id="set-save" data-i18n="settings.save"></button>
    </div>
  </form>
</dialog>

<script>
(() => {
  "use strict";

  // ---------- Язык ----------
  const t = (key, params) => I18N.t(key, params);

  function applyStatic() {
    document.documentElement.lang = I18N.lang();
    document.title = t("app.name");
    const desc = document.querySelector('meta[name="description"]');
    if (desc) desc.content = t("app.description");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-title]").forEach((el) => { el.title = t(el.dataset.i18nTitle); });
    document.querySelectorAll("[data-i18n-label]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nLabel)); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  }

  // ---------- Настройки ----------
  const STORE = "ispindel.cfg";
  const RANGES = { "1h": 3600e3, "6h": 6 * 3600e3, "24h": 24 * 3600e3, "3d": 3 * 86400e3, "7d": 7 * 86400e3 };
  // Адрес воркера по умолчанию — из config.js; cfg.api хранит только свой адрес, если он задан.
  const DEFAULT_API = ((window.ISPINDEL_DEFAULTS || {}).api || "").replace(/\/+$/, "");
  // sticks: [{ id, access, token, name, batchStart, formula }] — token есть только у того, кто стик зарегистрировал.
  const defaults = { api: "", sticks: [], current: "", device: "", range: "24h", smooth: true };
  let cfg = load();
  const apiBase = () => (cfg.api || DEFAULT_API).replace(/\/+$/, "");
  const cur = () => cfg.sticks.find((x) => x.id === cfg.current) || cfg.sticks[0] || null;
  const stickName = (x) => x.name || `${t("sticks.unnamed")} · ${String(x.id).slice(0, 4)}`;

  function load() {
    let c;
    try { c = Object.assign({}, defaults, JSON.parse(localStorage.getItem(STORE) || "{}")); }
    catch { c = Object.assign({}, defaults); }
    // Старые версии: адрес по умолчанию, ключ чтения, один токен и общие партия/формула.
    if (c.api && c.api.replace(/\/+$/, "") === DEFAULT_API) c.api = "";
    if (!Array.isArray(c.sticks)) c.sticks = [];
    if (c.token && !c.sticks.length) c.legacy = { token: c.token, batchStart: c.batchStart ?? null, formula: c.formula || "" };
    delete c.key; delete c.token; delete c.batchStart; delete c.formula;
    return c;
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch { /* приватный режим */ }
  }

  // ---------- Пиво: пересчёты ----------
  const sgFromPlato = (p) => 1 + p / (258.6 - (p / 258.2) * 227.1);
  const platoFromSG = (sg) => -616.868 + 1111.14 * sg - 630.272 * sg ** 2 + 135.997 * sg ** 3;
  // В режиме «Авто» единицы определяем по медиане: SG почти всегда 0,98–1,15, а °P такой бывает
  // только у почти выбродившего пива. Поэтому смотрим на начало партии (там SG ≈ 1,03–1,12 против 7–28 °P).
  function detectUnits(values) {
    const m = median(values.filter((v) => v != null && Number.isFinite(v)));
    if (m == null) return null;
    return m > 0.95 && m < 1.25 ? "SG" : "P";
  }
  const abv = (ogP, fgP) => (sgFromPlato(ogP) - sgFromPlato(fgP)) * 131.25;
  const BATTERY = [[4.2, 100], [4.1, 90], [4.0, 80], [3.9, 65], [3.8, 50], [3.7, 35], [3.6, 20], [3.5, 8], [3.4, 0]];
  function batteryPct(v) {
    if (v == null) return null;
    if (v >= BATTERY[0][0]) return 100;
    for (let i = 1; i < BATTERY.length; i++) {
      const [v1, p1] = BATTERY[i - 1], [v2, p2] = BATTERY[i];
      if (v >= v2) return Math.round(p2 + (p1 - p2) * (v - v2) / (v1 - v2));
    }
    return 0;
  }
  // Сила сигнала в процентах: −50 dBm и сильнее — 100 %, −100 dBm — 0 %.
  const wifiPct = (r) => r == null ? null : Math.max(0, Math.min(100, 2 * (r + 100)));
  function rssiText(r) {
    if (r == null) return "–";
    if (r >= -60) return t("wifi.excellent");
    if (r >= -70) return t("wifi.good");
    if (r >= -80) return t("wifi.weak");
    return t("wifi.veryWeak");
  }

  // Формула: только числа, tilt, + - * / ^ ( )
  function compileFormula(src) {
    if (!src || !src.trim()) return null;
    const s = src.replace(/tilt/gi, "t").replace(/\s+/g, "");
    if (!/^[0-9t.+\-*/^()eE]+$/.test(s)) throw new Error(t("err.formulaChars"));
    const fn = new Function("t", '"use strict"; return (' + s.replace(/\^/g, "**") + ");");
    const probe = fn(25);
    if (typeof probe !== "number" || !Number.isFinite(probe)) throw new Error(t("err.formulaProbe"));
    return fn;
  }

  // Плотность вне этого диапазона — датчик лежит или стоит, а не плавает
  const plausible = (g) => g != null && Number.isFinite(g) && g > -2 && g < 35;

  function median(arr) {
    const a = arr.filter((x) => x != null).sort((x, y) => x - y);
    if (!a.length) return null;
    const m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }
  function smoothSeries(points, w = 5) {
    return points.map((p, i) => {
      const win = points.slice(Math.max(0, i - (w >> 1)), i + (w >> 1) + 1).map((q) => q.y);
      return { x: p.x, y: median(win) };
    });
  }

  // ---------- Формат ----------
  const fmt = (n, d = 1) => n == null ? "–" : n.toLocaleString(I18N.locale(), { minimumFractionDigits: d, maximumFractionDigits: d });
  // Строка с числом в правильной форме: ключи base.one / .few / .many / .other
  const pluralRules = {};
  function tn(base, n, decimals = 0) {
    const loc = I18N.locale();
    const rules = pluralRules[loc] || (pluralRules[loc] = new Intl.PluralRules(loc));
    let key = `${base}.${rules.select(n)}`;
    if (t(key) === key) key = `${base}.other`;
    return t(key).split("{n}").join(fmt(n, decimals));
  }
  function ago(ts) {
    const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (s < 60) return tn("ago.sec", s);
    if (s < 3600) return tn("ago.min", Math.floor(s / 60));
    if (s < 86400) return tn("ago.hour", Math.floor(s / 3600));
    return tn("ago.day", Math.floor(s / 86400));
  }
  const dayTime = (ts) => new Date(ts).toLocaleString(I18N.locale(), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

  // ---------- API ----------
  // Время, когда сохранены данные, если ответ пришёл из кэша service worker'а (нет сети).
  let cachedAt = null;

  async function api(path, params = {}, access = cur() && cur().access) {
    const url = new URL(apiBase() + path);
    Object.entries(params).forEach(([k, v]) => v != null && v !== "" && url.searchParams.set(k, v));
    const res = await fetch(url, { headers: { "X-Access": access } });
    if (res.status === 401) throw new Error(t("err.unknownToken"));
    if (!res.ok) {
      // Показываем, что именно ответил воркер, а не только код.
      let detail = "";
      try { const body = await res.clone().json(); detail = body && body.error ? String(body.error) : ""; }
      catch { try { detail = (await res.text()).slice(0, 200); } catch { /* пусто */ } }
      throw new Error(t("err.workerStatus", { status: res.status }) + (detail ? " " + detail : ""));
    }
    const fromCache = res.headers.get("X-From-Cache");
    if (fromCache) cachedAt = Math.min(cachedAt ?? Infinity, Number(fromCache) || Date.now());
    return res.json();
  }

  // ---------- Отрисовка ----------
  const $ = (id) => document.getElementById(id);
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  let charts = {};

  function notice(html, kind = "") {
    $("notice").innerHTML = html ? `<div class="notice ${kind}">${html}</div>` : "";
  }

  // band: {lo, hi, color} — закрашенная полоса нормы (например, температура стиля)
  function renderChart(id, points, raw, color, unit, decimals, minSpan = 0, band = null) {
    const grid = css("--rule"), muted = css("--muted");
    const ds = [];
    const xs = points.concat(raw || []).map((p) => p.x);
    if (band && xs.length) {
      const x0 = Math.min(...xs), x1 = Math.max(...xs);
      ds.push({ data: [{ x: x0, y: band.lo }, { x: x1, y: band.lo }], borderWidth: 0, pointRadius: 0, pointHoverRadius: 0, fill: false, label: "lo" });
      ds.push({ data: [{ x: x0, y: band.hi }, { x: x1, y: band.hi }], borderWidth: 0, pointRadius: 0, pointHoverRadius: 0, fill: "-1", backgroundColor: band.color, label: "hi" });
    }
    if (raw) ds.push({ data: raw, borderColor: color, backgroundColor: color, borderWidth: 0, pointRadius: 1.5, pointHoverRadius: 3, showLine: false, label: t("charts.raw") });
    ds.push({ data: points, borderColor: color, borderWidth: 2.2, pointRadius: 0, pointHoverRadius: 4, tension: .25, spanGaps: false, label: unit });
    const xMin = points[0]?.x ?? raw?.[0]?.x, xMax = points.at(-1)?.x ?? raw?.at(-1)?.x;
    const opts = {
      responsive: true, maintainAspectRatio: false, animation: false, parsing: false, normalized: true,
      interaction: { mode: "nearest", axis: "x", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          filter: (item) => item.datasetIndex === ds.length - 1,
          callbacks: {
            title: (items) => dayTime(items[0].parsed.x),
            label: (item) => `${fmt(item.parsed.y, decimals)} ${unit}`,
          },
        },
      },
      scales: {
        x: {
          type: "linear", min: xMin, max: xMax,
          grid: { color: grid }, border: { display: false },
          ticks: {
            color: muted, maxTicksLimit: 6, maxRotation: 0,
            callback: (v) => {
              const d = new Date(v), span = (xMax - xMin) || 1;
              return span > 36 * 3600e3
                ? d.toLocaleDateString(I18N.locale(), { day: "numeric", month: "short" })
                : d.toLocaleTimeString(I18N.locale(), { hour: "2-digit", minute: "2-digit" });
            },
          },
        },
        y: (() => {
          // Минимальный размах оси, чтобы шум в сотых не выглядел как скачки
          const ys = points.concat(raw || []).map((p) => p.y).concat(band ? [band.lo, band.hi] : []).filter((v) => v != null);
          const lo = Math.min(...ys), hi = Math.max(...ys), mid = (lo + hi) / 2;
          const half = Math.max((hi - lo) / 2, minSpan / 2);
          return {
            min: ys.length ? mid - half : undefined, max: ys.length ? mid + half : undefined,
            grid: { color: grid }, border: { display: false },
            ticks: { color: muted, callback: (v) => fmt(v, decimals) },
          };
        })(),
      },
    };
    if (charts[id]) { charts[id].data.datasets = ds; charts[id].options = opts; charts[id].update(); return; }
    charts[id] = new Chart($(id), { type: "line", data: { datasets: ds }, options: opts });
  }

  // ---------- Основной цикл ----------
  let devices = [];
  let busy = false;

  let rangePicked = false;
  let detectedUnits = null;

  // Партия общая для всех, у кого есть доступ к стику: {start?, style?, fg?} уходят на сервер.
  async function postBatch(st, body) {
    const res = await fetch(apiBase() + "/api/batch", {
      method: "POST", headers: { "Content-Type": "application/json", "X-Access": st.access },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || String(res.status));
    if ("start" in body) st.batchStart = body.start;
    if ("style" in body) st.style = body.style;
    if ("fg" in body) st.fg = body.fg;
    save();
  }

  // Перезапуск идущей партии сбрасывает её у всех — только после подтверждения.
  function confirmReset(st, start) {
    return !(st.batchStart && st.batchStart < Date.now() && start !== st.batchStart) ||
      confirm(t("batch.confirmReset", { date: dayTime(st.batchStart) }));
  }

  // Начало партии из настроек (без смены стиля и цели).
  async function setBatch(start) {
    const st = cur();
    if (!st || !confirmReset(st, start)) return false;
    try { await postBatch(st, { start }); }
    catch (e) { notice(escapeHtml(t("err.batch", { message: e.message })), "error"); return false; }
    if (start) { cfg.range = "batch"; rangePicked = false; }
    syncRanges(); refresh();
    return true;
  }

  async function postFormula(st, formula) {
    const res = await fetch(apiBase() + "/api/formula", {
      method: "POST", headers: { "Content-Type": "application/json", "X-Access": st.access },
      body: JSON.stringify({ formula }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || String(res.status));
  }

  // История с экономией чтений из базы: полностью загружаем при открытии, смене стика, устройства,
  // периода или партии (и раз в 6 часов), а дальше раз в минуту догружаем только новые строки.
  let hist = null;
  async function loadHistory(st, from, now) {
    const key = [st.id, cfg.device, cfg.range, st.batchStart || 0].join("|");
    if (hist && hist.key === key && now - hist.loadedAt < 6 * 3600e3 && hist.from <= from) {
      const lastTs = hist.rows.length ? hist.rows.at(-1).ts : from;
      const { readings } = await api("/api/readings", { device: cfg.device, after: lastTs, to: now });
      hist.rows = hist.rows.concat(readings).filter((r) => r.ts >= from);
      return hist.rows;
    }
    const { readings } = await api("/api/readings", { device: cfg.device, from, to: now });
    hist = { key, from, loadedAt: now, rows: readings };
    return readings;
  }

  // Напряжение по часам для прогноза батареи — не чаще раза в 3 часа на стик и устройство.
  async function loadBattery(st) {
    const key = `ispindel.batt.${st.id}.${cfg.device}`;
    try {
      const c = JSON.parse(localStorage.getItem(key) || "null");
      if (c && Date.now() - c.at < 3 * 3600e3) return c.hours;
    } catch { /* нет кэша */ }
    try {
      const hours = (await api("/api/battery", { device: cfg.device, days: 7 })).hours;
      try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), hours })); } catch { /* приватный режим */ }
      return hours;
    } catch { return null; }
  }

  async function refresh() {
    if (busy) return;
    const st = cur();
    document.body.classList.toggle("is-demo", !st);
    $("demo").hidden = !!st;
    if (!st) { renderDemo(); return; }
    demoStick = null;
    if (!apiBase()) {
      devices = []; renderTitle();
      ["hero", "charts", "recs"].forEach((id) => $(id).hidden = true);
      seenInfo = null; $("seen").textContent = t("status.notConnected");
      notice(t(apiBase() ? "notice.setToken" : "notice.setApi"));
      return;
    }
    busy = true;
    $("refresh").classList.add("spin");
    cachedAt = null;
    try {
      const msgs = [];

      const data = await api("/api/devices");
      devices = data.devices || [];
      // Начало партии хранится на сервере и общее для всех, у кого есть доступ к стику.
      if ("batch_start" in data && st.batchStart !== data.batch_start) { st.batchStart = data.batch_start; save(); }
      // Полином тоже общий. При первой встрече с сервером, где полинома ещё нет, отдаём ему свой локальный.
      if ("formula" in data) {
        const remote = data.formula || "";
        if (!st.formulaSynced && !remote && st.formula) {
          await postFormula(st, st.formula).catch(() => {});
        } else if (st.formula !== remote) {
          st.formula = remote;
        }
        st.formulaSynced = true; save();
      }
      if ("units" in data && st.units !== data.units) { st.units = data.units; save(); }
      // Админ ли этот браузер — решает сервер по ключу доступа.
      if ("admin" in data && st.admin !== data.admin) { st.admin = data.admin; save(); }
      if ("style" in data) { st.style = data.style; st.fg = data.fg; save(); }
      let formula = null;
      try { formula = compileFormula(st.formula); }
      catch (e) { msgs.push(e.message + t("err.formulaFallback")); }
      if (devices.length && st.name !== devices[0].device) { st.name = devices[0].device; save(); }
      renderTitle();
      if (!devices.length) {
        ["hero", "charts", "recs"].forEach((id) => $(id).hidden = true);
        seenInfo = null; $("seen").textContent = t("status.noData");
        notice(t("notice.noReadings"));
        return;
      }
      if (!devices.some((d) => d.device === cfg.device)) { cfg.device = devices[0].device; renderTitle(); }

      const now = Date.now();
      const hasBatch = !!st.batchStart && st.batchStart < now;
      $("ranges").querySelector('[data-range="batch"]').hidden = !hasBatch;
      if (cfg.range === "batch" && !hasBatch) { cfg.range = "24h"; syncRanges(); }
      // Пока партия идёт, по умолчанию показываем её целиком.
      if (hasBatch && !rangePicked && cfg.range !== "batch") { cfg.range = "batch"; syncRanges(); }
      const rangeFrom = cfg.range === "batch" ? st.batchStart : now - RANGES[cfg.range];
      // Для начальной плотности и динамики за сутки берём данные с начала партии или хотя бы за 26 ч
      const from = Math.min(rangeFrom, hasBatch ? st.batchStart : rangeFrom, now - 26 * 3600e3);
      const readings = await loadHistory(st, from, now);

      const rows = readings.map((r) => ({
        ...r,
        g: formula && r.angle != null ? formula(r.angle) : r.gravity,
      }));
      // Плотность в SG (у iSpindel или у формулы) переводим в °P до всех расчётов.
      const sample = hasBatch ? rows.filter((r) => r.ts >= st.batchStart).slice(0, 12) : rows;
      detectedUnits = detectUnits((sample.length ? sample : rows).map((r) => r.g));
      const units = st.units === "SG" || st.units === "P" ? st.units : detectedUnits;
      if (units === "SG") rows.forEach((r) => { if (r.g != null) r.g = platoFromSG(r.g); });
      const valid = rows.filter((r) => plausible(r.g));
      const last = devices.find((d) => d.device === cfg.device);

      const batt = await loadBattery(st);
      renderMain(rows, valid, last, hasBatch, batt, now);
      renderCharts(rows.filter((r) => r.ts >= rangeFrom), last);
      if (!valid.some((r) => r.ts >= rangeFrom)) {
        msgs.push(t("notice.implausible"));
      }
      if (cachedAt != null) {
        msgs.unshift(t("notice.offline", { ago: ago(cachedAt) }));
      }
      if (joined) { msgs.unshift(t("sticks.joined", { name: stickName(st) })); joined = false; }
      notice(msgs.map(escapeHtml).join("<br>"), msgs.length && st.formula && !formula ? "error" : "");
    } catch (e) {
      notice(escapeHtml(t("err.fetch", { message: e.message })), "error");
      seenInfo = null; $("seen").textContent = t("status.noConnection");
    } finally {
      busy = false;
      $("refresh").classList.remove("spin");
    }
  }

  // Заголовок: переключатель стиков (если их несколько) и устройств внутри стика.
  function renderTitle() {
    const title = $("title"), st = cur();
    let html = "";
    if (cfg.sticks.length > 1) {
      html = `<select id="stick-switch" aria-label="${escapeHtml(t("ui.device"))}">${cfg.sticks.map((x) =>
        `<option value="${escapeHtml(x.id)}" ${x === st ? "selected" : ""}>${escapeHtml(stickName(x))}</option>`).join("")}</select>`;
    } else {
      html = escapeHtml(st ? stickName(st) : t("app.name"));
    }
    if (devices.length > 1) {

  function switchStick(id) {

  // ---------- Иконки показателей ----------
  const svgIcon = (inner, extra = "") => `<svg viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${inner}</svg>`;
  const icons = {
    temp: () => svgIcon(`<path d="M16 15.5V6a2.5 2.5 0 0 0-5 0v9.5a5 5 0 1 0 5 0z"/><circle cx="13.5" cy="19.5" r="2" fill="currentColor"/><path d="M13.5 17.5V10"/><path d="M19 7h3M19 11h3M19 15h2"/>`),
    battery: (pct) => {
      const color = pct == null ? css("--muted") : pct > 50 ? css("--ok") : pct > 20 ? css("--amber") : css("--alert");
      const w = pct == null ? 0 : Math.max(1.5, 15 * pct / 100);
      return svgIcon(`<rect x="3" y="9" width="19" height="10" rx="2.5"/><path d="M24.5 12.5v3" stroke-width="2.4"/>` +
        `<rect x="5" y="11" width="${w}" height="6" rx="1" fill="${color}" stroke="none"/>`, `style="color:${color}"`);
    },
    // Колба повёрнута на реальный наклон (0° — лежит, 90° — стоит)
    tilt: (angle) => {

      const arc = (r, i) => `<path d="M${14 - r} ${21 - r * .55}a${r} ${r} 0 0 1 ${2 * r} 0" opacity="${i < level ? 1 : .25}"/>`;
      return svgIcon(`${arc(4, 0)}${arc(8, 1)}${arc(12, 2)}<circle cx="14" cy="21.5" r="1.4" fill="currentColor" stroke="none"/>`);
    },
    clock: () => svgIcon(`<circle cx="14" cy="14" r="10"/><path d="M14 8v6l4 2.5"/>`),
    gravity: () => svgIcon(`<path d="M3 15c3 0 3-1.6 5.5-1.6S11 15 14 15s3-1.6 5.5-1.6S22 15 25 15" opacity=".6"/><rect x="11.5" y="3" width="5" height="14" rx="2.5"/><circle cx="14" cy="20.5" r="3.5"/>`),
    beer: () => svgIcon(`<path d="M6 9h12v13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M18 12h2.5a2.5 2.5 0 0 1 0 5H18"/><path d="M6 9a3 3 0 0 1 3-4 3.5 3.5 0 0 1 6 0 2.5 2.5 0 0 1 3 4"/><path d="M10 13v7M14 13v7"/>`),
    trend: () => svgIcon(`<path d="M4 8l7 7 4-4 9 9"/><path d="M24 14v6h-6"/>`),
  };

  // ---------- Батарея: расход и прогноз ----------
  // hours: [{hour, v}] — среднее напряжение по часам из /api/battery
  function batteryForecast(hours) {
    if (!hours || hours.length < 2) return { status: "nodata" };
    // Текущий разряд начинается после последней зарядки (подъём напряжения > 0.08 В)
    let start = 0, minSince = hours[0].v;
    for (let i = 1; i < hours.length; i++) {
      if (hours[i].v > minSince + 0.08) { start = i; minSince = hours[i].v; }
      else minSince = Math.min(minSince, hours[i].v);
    }
    const pts = hours.slice(start).map((h) => ({ x: h.hour / 86400e3, y: batteryPct(h.v) }));
    const spanDays = pts.length ? pts.at(-1).x - pts[0].x : 0;
    if (pts.length < 6 || spanDays < 0.5) return { status: "short" };
    // Линейная регрессия: процент заряда от времени в сутках
    const n = pts.length, mx = pts.reduce((a, p) => a + p.x, 0) / n, my = pts.reduce((a, p) => a + p.y, 0) / n;
    let num = 0, den = 0;
    pts.forEach((p) => { num += (p.x - mx) * (p.y - my); den += (p.x - mx) ** 2; });
    const rate = den ? -num / den : 0;
    if (rate < 0.05) return { status: "flat", spanDays };
    return { status: "ok", rate, spanDays };
  }

  function batteryNote(pct, fc) {
    const span = (d) => fmt(d, d >= 2 ? 0 : 1);
    if (fc.status === "ok" && pct != null) {
      const days = pct / fc.rate;
      const d = days >= 2 ? Math.round(days) : Math.round(days * 10) / 10;
      return escapeHtml(t("battery.forecast", { days: tn("unit.days", d, days >= 2 ? 0 : 1) })) + "<br>" +
        escapeHtml(t("battery.rate", { rate: fmt(fc.rate, 1), span: span(fc.spanDays) }));
    }
    if (fc.status === "flat") return escapeHtml(t("battery.flat", { span: span(fc.spanDays) }));
    return escapeHtml(t(fc.status === "short" ? "battery.short" : "battery.nodata"));
  }

  function intervalText(sec) {
    if (!sec) return "–";
    if (sec < 120) return `${sec} ${t("unit.sec")}`;
    return `${Math.round(sec / 60)} ${t("unit.min")}`;
  }

  // ---------- Главный экран: плашка, значки, брожение, партия, рекомендации ----------
  let view = null;   // всё, что нужно всплывающим подсказкам
  const toC = (v, u) => v == null ? null : u === "F" ? (v - 32) * 5 / 9 : u === "K" ? v - 273.15 : v;
  const tUnit = (u) => u === "F" ? "°F" : u === "K" ? "K" : "°C";
  const styleName = (st) => st ? (st.name[I18N.lang()] || st.name.en) : "";
  // Числа в текстах: измеренные значения — с одним знаком, границы и счётчики — как есть.
  const fmtMax1 = (v) => v.toLocaleString(I18N.locale(), { maximumFractionDigits: 1 });
  const ONE_DECIMAL = new Set(["proj", "now", "g", "fg", "og", "rate", "peak", "t", "swing", "jump"]);
  const msgText = (m) => t(m.key, Object.fromEntries(Object.entries(m.params).map(([k, v]) =>
    [k, typeof v === "number" ? (ONE_DECIMAL.has(k) ? fmt(v, 1) : fmtMax1(v)) : v])));
  const rangeText = (r) => `${fmtMax1(r[0])}–${fmtMax1(r[1])}`;
  const dateShort = (ts) => new Date(ts).toLocaleDateString(I18N.locale(), { day: "numeric", month: "short" });

  // Цвет значка или плитки: good / warn / bad, null — без подсветки.
  function setLevel(id, level) {
    ["good", "warn", "bad"].forEach((c) => $(id).classList.toggle(c, c === level));
  }
  // Температура по диапазону стиля: дальше 0,5 °C от границ внутри — зелёный, ±0,5 °C у границы — жёлтый,
  // дальше за границей — красный. Колебания и скачки из анализа делают зелёный жёлтым.
  const TEMP_EDGE = 0.5;
  function tempLevel(tc, range, analysisLevel) {
    if (tc == null) return null;
    let level = "good";
    if (range) {
      const [lo, hi] = range;
      if (tc < lo - TEMP_EDGE || tc > hi + TEMP_EDGE) level = "bad";
      else if (tc < lo + TEMP_EDGE || tc > hi - TEMP_EDGE) level = "warn";
    }
    return level === "good" && analysisLevel !== "ok" ? "warn" : level;
  }
  // Плитка температуры: значение, шкала нормы стиля (±4 °C вокруг неё) и короткая подсказка.
  function renderTempTile(tc, raw, units, style, a) {
    const range = style && style.t;
    $("t-value").textContent = raw == null ? "–" : fmt(raw, 1);
    $("t-unit").textContent = tUnit(units);
    $("t-scale").hidden = $("t-scale-l").hidden = !range || tc == null;
    if (range && tc != null) {
      const [lo, hi] = range, from = lo - 4, to = hi + 4;
      const pos = (v) => Math.max(2, Math.min(98, (v - from) / (to - from) * 100));
      const zone = $("t-scale").querySelector(".zone");
      zone.style.left = pos(lo) + "%"; zone.style.width = pos(hi) - pos(lo) + "%";
      $("t-scale").querySelector(".mark").style.left = pos(tc) + "%";
      const [l, , r] = $("t-scale-l").children;
      l.textContent = fmtMax1(lo) + "°"; r.textContent = fmtMax1(hi) + "°";
    }
    const level = tempLevel(tc, range, a.temp.level);
    let msg = "";
    if (tc == null) msg = t("tile.t.none");
    else if (!range) msg = t("tile.t.noStyle");
    else {
      const [lo, hi] = range, d = (v) => fmt(v, 1);
      if (tc > hi + TEMP_EDGE) msg = t("tile.t.high", { d: d(tc - hi) });
      else if (tc < lo - TEMP_EDGE) msg = t("tile.t.low", { d: d(lo - tc) });
      else if (tc > hi - TEMP_EDGE) msg = t("tile.t.edgeHigh", { hi: fmtMax1(hi) });
      else if (tc < lo + TEMP_EDGE) msg = t("tile.t.edgeLow", { lo: fmtMax1(lo) });
      else if (level === "warn") msg = a.temp.stats && a.temp.stats.swing > 3 ? t("tile.t.swing", { swing: d(a.temp.stats.swing) }) : t("tile.t.tip");
      else msg = t("tile.t.ok", { lo: fmtMax1(lo), hi: fmtMax1(hi) });
    }
    $("t-msg").textContent = msg;
    setLevel("band-t", level);
  }
  // ---------- Демо ----------
  // Пока не добавлено ни одного iSpindel, показываем выдуманную партию: 3,5 дня хефевайцена.
  let demoStick = null;
  function demoData(now) {
    const H = 3600e3, start = now - 3.5 * 24 * H, og = 12.4, fg = 2.9;
    const st = { id: "demo", name: t("demo.name"), batchStart: start, style: Brew.byId.hefeweizen ? "hefeweizen" : Brew.STYLES[0].id, fg: null, units: "P", formula: "" };
    const noise = (i, k) => Math.sin(i * 12.9898 + k * 78.233) * 0.5;
    const readings = [];
    for (let ts = start - 6 * H, i = 0; ts <= now; ts += 15 * 60e3, i++) {
      const h = (ts - start) / H;
      const g = h < 0 ? og : fg + (og - fg) / (1 + Math.exp((h - 60) / 16));
      const temp = h < 0 ? 22 : h < 5 ? 21.5 - h * 0.45 : 19.6 + 0.35 * Math.sin(h / 24 * 2 * Math.PI) + noise(i, 1) * 0.1;
      readings.push({ ts, device: st.name, temperature: Math.round(temp * 16) / 16, temp_units: "C", battery: 4.12 - (ts - start + 6 * H) / (24 * H) * 0.012,
        gravity: g + noise(i, 2) * 0.08, angle: 25 + g * 2.6, interval_s: 900, rssi: -63 + Math.round(noise(i, 3) * 4) });
    }
    const hours = readings.filter((_, i) => i % 4 === 0).map((r) => ({ hour: r.ts, v: r.battery }));
    return { st, readings, last: readings.at(-1), hours };
  }
  function renderDemo() {
    const now = Date.now();
    const { st, readings, last, hours } = demoData(now);
    demoStick = st;
    devices = [last]; cfg.device = last.device;
    renderTitle();
    $("ranges").querySelector('[data-range="batch"]').hidden = false;
    if (!rangePicked && cfg.range !== "batch") { cfg.range = "batch"; syncRanges(); }
    const rangeFrom = cfg.range === "batch" ? st.batchStart : now - RANGES[cfg.range];
    const rows = readings.map((r) => ({ ...r, g: r.gravity }));
    detectedUnits = "P";
    renderMain(rows, rows.filter((r) => plausible(r.g)), last, true, hours, now);
    renderCharts(rows.filter((r) => r.ts >= rangeFrom), last);
    ["hero", "charts"].forEach((id) => $(id).setAttribute("data-demo", t("demo.tag")));
    seenInfo = null; $("seen").textContent = t("demo.seen");
    notice("");
  }
  $("demo-add").onclick = () => $("open-settings").click();

  function renderMain(rows, valid, last, hasBatch, batt, now) {
    $("hero").hidden = false;
    const st = cur() || demoStick;
    const style = st.style ? Brew.byId[st.style] || null : null;
    const current = median(valid.slice(-5).map((r) => r.g));
    let og = null;
    if (hasBatch) og = median(valid.filter((r) => r.ts >= st.batchStart).slice(0, 6).map((r) => r.g));
    const a = Brew.analyze({
      rows: rows.map((r) => ({ ts: r.ts, g: plausible(r.g) ? r.g : null, temperature: toC(r.temperature, r.temp_units) })),
      now, batchStart: hasBatch ? st.batchStart : null, og, fgManual: st.fg ?? null, style,
    });
    const pct = batteryPct(last.battery);
    const fc = batteryForecast(batt);
    view = { st, style, a, og, current, last, pct, fc, hasBatch };

    // Плашка
    $("g-icon").innerHTML = icons.gravity();
    $("t-icon").innerHTML = icons.temp();
    $("g-value").textContent = current == null ? "–" : fmt(current, 1);
    $("g-sg").textContent = current == null ? t("hero.noGravity")
      : `SG ${sgFromPlato(current).toFixed(3)}` + (og != null ? ` · ${t("band.og", { og: fmt(og, 1) })}` : "");
    $("g-bar").hidden = a.progress == null;
    if (a.progress != null) $("g-bar").firstElementChild.style.width = Math.round(Math.min(1, Math.max(0, a.progress)) * 100) + "%";
    const rateText = a.rate != null ? (a.rate >= 0 ? "−" : "+") + fmt(Math.abs(a.rate), 1) + " °P/" + t("unit.dayShort") : null;
    $("g-prog").textContent = [a.progress != null ? t("tile.g.progress", { p: Math.round(a.progress * 100) }) : null, rateText].filter(Boolean).join(" · ")
      || t(hasBatch ? "tile.g.noRate" : "tile.g.noBatch");
    $("abv-value").innerHTML = (a.abvNow != null ? fmt(a.abvNow, 1) + "%" : "–") + (a.projAbv != null ? `<small>→ ${fmt(a.projAbv, 1)}%</small>` : "");
    setLevel("tile-g", current == null ? null : { ok: "good", warn: "warn", bad: "bad" }[a.gravity.level]);
    $("band-abv").classList.toggle("bad", a.abv.level !== "ok");

    // Значки
    const tLast = last.temperature;
    $("chip-batt").innerHTML = `${icons.battery(pct)}<span>${pct == null ? "–" : pct + "%"}</span>`;
    setLevel("chip-batt", pct == null ? null : pct > 50 ? "good" : pct > 20 ? "warn" : "bad");
    renderTempTile(toC(tLast, last.temp_units), tLast, last.temp_units, style, a);
    $("chip-wifi").innerHTML = `${icons.wifi(last.rssi)}<span>${last.rssi == null ? "–" : wifiPct(last.rssi) + "%"}</span>`;
    setLevel("chip-wifi", last.rssi == null ? null : last.rssi >= -70 ? "good" : last.rssi >= -80 ? "warn" : "bad");
    $("chip-rate").innerHTML = `${icons.trend()}<span>${a.rate == null ? "–" : (a.rate >= 0 ? "−" : "+") + fmt(Math.abs(a.rate), 1)}</span>`;
    $("chip-rate").title = t("chip.rate");
    setLevel("chip-rate", a.gravity.level === "bad" ? "bad" : null);
    [["chip-batt", "device.battery"], ["band-t", "device.temperature"], ["chip-wifi", "device.wifi"], ["chip-rate", "chip.rate"], ["band-g", "band.gravity"], ["band-abv", "band.abv"]]
      .forEach(([id, k]) => $(id).setAttribute("aria-label", t(k)));

    // Брожение
    const info = $("info");
    const stateKey = current == null ? "notFloating" : a.status;
    const cls = { active: "ok", slowing: "ok", lag: "idle", done: "ok", quiet: "idle", stalled: "bad", noStart: "bad", notFloating: "idle", unknown: "idle" }[stateKey] || "idle";
    info.className = "info " + cls;
    let row = "";
    if (a.rate != null) row += `<span>${escapeHtml(t("info.speed", { rate: fmt(a.rate, 1) }))}</span>`;
    if (a.peak) row += `<span>${escapeHtml(t("info.peak", { rate: fmt(a.peak.rate, 1), ago: ago(a.peak.ts) }))}</span>`;
    info.innerHTML = t("info." + stateKey, {
      rate: a.rate != null ? fmt(a.rate, 1) : "–", peak: a.peak ? fmt(a.peak.rate, 1) : "–",
      hours: hasBatch ? Math.round((now - st.batchStart) / 3600e3) : "–",
    }) + (row ? `<div class="row">${row}</div>` : "");

    // Партия
    const bp = $("batchp");
    if (hasBatch) {
      const days = (now - st.batchStart) / 86400e3;
      const basis = { manual: t("batch.basis.manual"), style: t("batch.basis.style", { style: styleName(style) }), default: t("batch.basis.default") }[a.fgSource] || "";
      let html = `<h3>${escapeHtml(t("batch.title"))}<small>${escapeHtml(t("batch.since", { days: fmt(days, 1), date: dayTime(st.batchStart) }))}</small></h3>
        <div class="style">${escapeHtml(style ? styleName(style) : t("batch.noStyle"))}</div>`;
      if (a.progress != null) {
        html += `<div class="prog"><i style="width:${Math.round(a.progress * 100)}%"></i></div>
          <div class="scale"><span>${escapeHtml(t("batch.ogShort", { og: fmt(og, 1) }))}</span><span>${escapeHtml(t("batch.now", { g: fmt(current, 1) }))}</span><span>${escapeHtml(t("batch.target", { fg: fmt(a.fg, 1) }))}</span></div>`;
      }
      const left = a.eta ? (a.eta.hi === 0 ? t("batch.ready") : t("batch.leftDays", { lo: fmt(a.eta.lo, a.eta.lo < 2 ? 1 : 0), hi: fmt(a.eta.hi, a.eta.hi < 2 ? 1 : 0) })) : "–";
      html += `<div class="kv">
          <div><small>${escapeHtml(t("batch.attenuation"))}</small><b>${a.attenuation != null ? fmt(a.attenuation, 0) + "%" : "–"}</b></div>
          <div><small>${escapeHtml(t("batch.abv"))}</small><b>${a.abvNow != null ? fmt(a.abvNow, 1) + "%" : "–"}${a.projAbv != null ? ` <span style="font-size:.6em;opacity:.7">→ ${fmt(a.projAbv, 1)}%</span>` : ""}</b></div>
          <div><small>${escapeHtml(t("batch.left"))}</small><b>${escapeHtml(left)}</b></div>
        </div>`;
      if (a.ready && a.eta.hi > 0) {
        html += `<p class="eta">${t("batch.readyBy", { lo: escapeHtml(dateShort(a.ready.lo)), hi: escapeHtml(dateShort(a.ready.hi)) })} · ${escapeHtml(basis)}</p>`;
      } else if (og == null) {

      }
      bp.innerHTML = html + actionBar(t("act.newBatch"));
    } else {

    // Рекомендации
    const section = (part, key) => {
      const p = a[part];

      return `<div class="rec ${p.level}"><span class="mark">${p.level === "ok" ? "✓" : "!"}</span><b>${escapeHtml(t(key))}</b>
        <ul>${p.msgs.map((m) => `<li class="${m.level}">${escapeHtml(msgText(m))}</li>`).join("")}</ul></div>`;

    $("recs").hidden = !recs;
    $("recs").innerHTML = `<h2>${escapeHtml(t("recs.title"))}</h2>${recs}`;

    seenInfo = { ts: last.ts, expected: (last.interval_s || 900) * 1000 };
