  function brewHtml() {
    const { b, steps } = brewView;
    const curI = steps.findIndex((_, i) => !b.done.includes(i));
    const items = steps.map((s, i) => {
      const done = b.done.includes(i), isCur = i === curI;
      const tm = b.timer && b.timer.i === i ? b.timer : null;
      let timer = "";
      if (s.min && !done) {
        const left = tm ? timerLeft(tm) : s.min * 60e3, run = tm && tm.end;
        timer = `<span class="tm${run ? " run" : ""}"><b data-left="${i}">${mmss(left)}</b>
          <button type="button" data-timer="${i}" aria-label="${escapeHtml(t(run ? "brew.pause" : "brew.start"))}">${run ? "❚❚" : "▶"}</button>
          ${tm ? `<button type="button" data-timer-reset="${i}" aria-label="${escapeHtml(t("brew.reset"))}">↺</button>` : ""}</span>`;
      }
      const next = s.adds && tm ? `<small class="next" data-next="${i}">${escapeHtml(nextAdd(s, tm))}</small>` : "";
      return `<li class="${done ? "done" : isCur ? "cur" : ""}"><button type="button" class="chk" data-step="${i}" aria-pressed="${done}" aria-label="${escapeHtml(t("brew.mark"))}">${done ? "✓" : i + 1}</button>
        <div class="bs"><div class="bt"><b>${escapeHtml(s.title)}</b>${timer}</div>${s.sub ? `<small>${escapeHtml(s.sub)}</small>` : ""}${next}</div></li>`;
    }).join("");
    return `<div class="top-line brew-top"><h2>${escapeHtml(t("brew.title", { name: b.name }))}</h2>${closeBtn}</div>
      <div class="sub">${escapeHtml(fmtL(b.liters))} · ${escapeHtml(curI < 0 ? t("brew.allDone") : t("brew.stepOf", { i: curI + 1, n: steps.length }))}</div>
      <ol class="brew">${items}</ol>
      <p class="hint">${escapeHtml(t("brew.hint"))}</p>
      <div class="rc-links"><button type="button" class="link" data-recipe="${b.ref}" data-liters="${b.liters}">${escapeHtml(t("brew.recipe"))}</button>
        <button type="button" class="link danger" data-brew-cancel>${escapeHtml(t("brew.cancel"))}</button></div>
      <div class="rc-foot"><button type="button" data-close>${escapeHtml(t("settings.close"))}</button>
        <button type="button" class="main teal" data-brew-go>${escapeHtml(t("brew.go"))}</button></div>`;
  }
  // Кипячение: что и когда закладывать дальше (минуты в рецепте — до конца кипячения;
  // закладки «на всё время» идут сразу при старте и в подсказку не попадают).
  function nextAdd(s, tm) {
    const leftMin = timerLeft(tm) / 60e3;
    const nx = s.adds.find((x) => x.min < s.min && x.min < leftMin);
    return nx ? t("brew.next", { what: nx.text, in: mmss((leftMin - nx.min) * 60e3) }) : "";
  }
  function brewSave() { setBrew(cur(), brewView.b); }
  function brewRerender() { const y = sheet.scrollTop; $("sheet-body").innerHTML = brewHtml(); sheet.scrollTop = y; }
  // Раз в секунду: время на таймере, «что дальше»; конец таймера — шаг отмечен, вибрация и уведомление.
  setInterval(() => {
    const st = cur(), b = st && getBrew(st);
    if (b && b.timer && b.timer.end && b.timer.end <= Date.now()) {
      const i = b.timer.i;
      b.timer = null; if (!b.done.includes(i)) b.done.push(i);
      setBrew(st, b);
      try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch { /* нет вибрации */ }
      if ("Notification" in window && Notification.permission === "granted" && navigator.serviceWorker) {
        navigator.serviceWorker.ready.then((reg) => reg.showNotification(t("brew.timerDone"), { body: b.name, tag: "brew", icon: "icons/icon-192.png" })).catch(() => {});
      }
      if (brewView && sheet.open && sheet.querySelector(".brew")) { brewView.b = b; brewRerender(); }
      const banner = $("brew-banner"); if (banner) banner.outerHTML = brewBanner(st);
      return;
    }
    if (brewView && sheet.open && sheet.querySelector(".brew") && b && b.timer) {
      const el = sheet.querySelector(`[data-left="${b.timer.i}"]`);
      if (el) el.textContent = mmss(timerLeft(b.timer));
      const nx = sheet.querySelector(`[data-next="${b.timer.i}"]`);
      if (nx) nx.textContent = nextAdd(brewView.steps[b.timer.i], b.timer);
    }
    const bt = document.querySelector("#brew-banner [data-bt]");
    if (bt && b && b.timer) bt.textContent = "⏱ " + mmss(timerLeft(b.timer));
  }, 1000);
  function brewBanner(st) {
    const b = getBrew(st);
    if (!b) return "";
    const tm = b.timer ? `<span data-bt>⏱ ${mmss(timerLeft(b.timer))}</span>` : "";
    return `<button type="button" class="brew-banner" id="brew-banner">${BREW_ICON}<span><b>${escapeHtml(t("brew.banner", { name: b.name }))}</b>
      <small>${escapeHtml(t("brew.bannerSub", { n: b.done.length }))}</small></span>${tm}<i>›</i></button>`;
  }
  // Плашка «Идёт варка» в панели партии — после закрытия листа варки или отмены.
  function syncBrewBanner() {
    const st = cur(), bp = $("batchp");
    if (!st || !bp) return;
    const old = $("brew-banner"), html = brewBanner(st);
    if (old) old.outerHTML = html; else if (html) bp.insertAdjacentHTML("afterbegin", html);
  }
  sheet.addEventListener("close", () => { brewView = null; syncBrewBanner(); });
  async function brewGo(btn) {
    const st = cur(), { b, r } = brewView;
    const start = Date.now();
    if (!confirmReset(st, start)) return;
    btn.classList.add("loading"); btn.disabled = true;
    try { await postBatch(st, { start, ...recipeBatch(b.ref, r) }); }
    catch (e) { notice(escapeHtml(t("err.batch", { message: e.message })), "error"); btn.classList.remove("loading"); btn.disabled = false; return; }
    setBrew(st, null); brewView = null;
    cfg.range = "batch"; rangePicked = false;
    sheet.close(); syncRanges(); refresh();
  }

  // ----- Свои рецепты: простая форма и JSON -----
  const STAGE_IDS = ["lag", "active", "slowing", "checking", "done", "ready"];
  function fermRow(s, i) {
    const u = s.until || { stage: "done" }, type = u.stage ? "stage" : u.plato != null ? "plato" : "days";
    return `<div class="frow" data-frow="${i}">
      <input name="lo" type="number" step="0.5" value="${s.temp[0]}" aria-label="${escapeHtml(t("ed.lo"))}"><span>–</span>
      <input name="hi" type="number" step="0.5" value="${s.temp[1]}" aria-label="${escapeHtml(t("ed.hi"))}"><span>°C</span>
      <select name="ut">${["stage", "plato", "days"].map((k) => `<option value="${k}"${k === type ? " selected" : ""}>${escapeHtml(t("ed.until." + k))}</option>`).join("")}</select>
      <select name="us"${type === "stage" ? "" : " hidden"}>${STAGE_IDS.map((k) => `<option value="${k}"${k === u.stage ? " selected" : ""}>${escapeHtml(t("stage." + k))}</option>`).join("")}</select>
      <input name="uv" type="number" step="0.5"${type === "stage" ? " hidden" : ""} value="${type === "plato" ? u.plato : type === "days" ? u.days : ""}" aria-label="${escapeHtml(t("ed.value"))}">
      <button type="button" class="x-row" data-frow-del="${i}" aria-label="${escapeHtml(t("ed.delStep"))}">×</button></div>`;
  }
  let edView = null; // { r, isNew }
  function openEditor(r, isNew) {
    edView = { r: JSON.parse(JSON.stringify(r)), isNew };
    const st = cur(), lang = I18N.lang();
    const styles = Brew.STYLES.map((x) => [x.id, x.name[lang] || x.name.en]).sort((p, q) => p[1].localeCompare(q[1], I18N.locale()))
      .map(([id, name]) => `<option value="${id}"${id === r.style ? " selected" : ""}>${escapeHtml(name)}</option>`).join("");
    const num = (name, v, step) => `<input name="${name}" type="number" inputmode="decimal" step="${step}" value="${v ?? ""}" required>`;
    openSheet(`<div class="top-line"><h2>${escapeHtml(t(isNew ? "ed.new" : "ed.title"))}</h2>${closeBtn}</div>
      <form class="rc-edit" id="rc-edit" novalidate>
        <label>${escapeHtml(t("ed.name"))}<input name="name" maxlength="80" required value="${escapeHtml(rloc(r.name))}"></label>
        <label>${escapeHtml(t("batchdlg.style"))}<select name="style">${styles}</select></label>
        <div class="ed3"><label>${escapeHtml(t("rc.og"))}, °P${num("og", r.og, 0.1)}</label><label>${escapeHtml(t("rc.fg"))}, °P${num("fg", r.fg, 0.1)}</label>
          <label>${escapeHtml(t("rc.volume"))}, ${escapeHtml(t("u.l"))}${num("batch_l", r.batch_l, 1)}</label></div>
        <label>${escapeHtml(t("prime.co2"))}${num("vol", r.priming ? r.priming.vol_co2 : 2.5, 0.1)}</label>
        <fieldset class="ferm-ed"><legend>${escapeHtml(t("rc.plan"))}</legend><div id="frows">${r.fermentation.map(fermRow).join("")}</div>
          <button type="button" class="link" data-frow-add>${escapeHtml(t("ed.addStep"))}</button></fieldset>
        <label>${escapeHtml(t("ed.notes"))}<textarea name="notes" rows="3" maxlength="2000">${escapeHtml(r.notes ? rloc(r.notes) : "")}</textarea></label>
        <details class="ed-json"><summary>${escapeHtml(t("ed.json"))}</summary>
          <textarea name="json" rows="12" spellcheck="false" autocapitalize="off">${escapeHtml(JSON.stringify(r, null, 2))}</textarea>
          <small>${escapeHtml(t("ed.jsonHint"))}</small></details>
        <small class="field-error" id="ed-err"></small>
        <div class="rc-foot"><button type="button" data-close>${escapeHtml(t("settings.close"))}</button>
          <button type="submit" class="main">${escapeHtml(t("settings.save"))}</button></div>
      </form>`);
    $("rc-edit").addEventListener("submit", (e) => { e.preventDefault(); saveEditor(e.submitter || e.target.querySelector("[type=submit]")); });
    $("rc-edit").addEventListener("change", (e) => {
      if (e.target.name !== "ut") return;
      const row = e.target.closest(".frow"), k = e.target.value;
      row.querySelector("[name=us]").hidden = k !== "stage";
      row.querySelector("[name=uv]").hidden = k === "stage";
    });
  }
  function editorRecipe() {
    const f = $("rc-edit"), lang = I18N.lang();
    let base;
    try { base = JSON.parse(f.elements.json.value); } catch (e) { throw new Error(t("ed.badJson", { message: e.message })); }
    if (!base || typeof base !== "object") throw new Error(t("ed.badJson", { message: "—" }));
    const n = (v) => { const x = parseFloat(String(v).replace(",", ".")); return Number.isFinite(x) ? x : NaN; };
    // Изменённое название или заметки заменяют все переводы: старые были бы про другой рецепт.
    const text = (old, v) => {
      if (!v) return undefined;
      if (rloc(old) === v) return old;
      return lang === "en" || lang === "ru" ? { [lang]: v } : { [lang]: v, en: v };
    };
    const r = { ...base, v: 1 };
    r.name = text(base.name, f.elements.name.value.trim());
    r.style = f.elements.style.value;
    r.og = n(f.elements.og.value); r.fg = n(f.elements.fg.value); r.batch_l = n(f.elements.batch_l.value);
    if (Number.isFinite(r.og) && Number.isFinite(r.fg) && r.og > r.fg) r.abv = Math.round(Brew.abv(r.og, r.fg) * 10) / 10;
    r.priming = { ...(base.priming || {}), vol_co2: n(f.elements.vol.value) };
    r.fermentation = [...f.querySelectorAll(".frow")].map((row, i) => {
      const old = (base.fermentation || [])[Number(row.dataset.frow)] || {};
      const ut = row.querySelector("[name=ut]").value, uv = n(row.querySelector("[name=uv]").value);
      return { ...old, until: ut === "stage" ? { stage: row.querySelector("[name=us]").value } : { [ut]: uv },
        temp: [n(row.querySelector("[name=lo]").value), n(row.querySelector("[name=hi]").value)] };
    });
    const notes = text(base.notes, f.elements.notes.value.trim());
    if (notes) r.notes = notes; else delete r.notes;
    return r;
  }
  async function saveEditor(btn) {
    const st = cur();
    let r;
    try { r = editorRecipe(); } catch (e) { $("ed-err").textContent = e.message; return; }
    const mine = await loadMine(st).catch(() => []);
    // Новому рецепту — свободный id (копия библиотечного получает приставку -my).
    if (edView.isNew) {
      const base = (String(r.id || "recipe").toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "") || "recipe").slice(0, 34);
      let id = base, k = 2;
      while (mine.some((x) => x.id === id)) id = `${base}-${k++}`;
      r.id = id;
    }
    const err = Recipe.check(r, Brew.STYLES.map((x) => x.id));
    if (err.length) { $("ed-err").textContent = t("ed.invalid", { errors: err.slice(0, 4).join("; ") }); return; }
    btn.classList.add("loading"); btn.disabled = true;
    try { await apiSend("PUT", "/api/recipes/" + r.id, r); }
    catch (e) { $("ed-err").textContent = t("ed.saveError", { message: e.message }); btn.classList.remove("loading"); btn.disabled = false; return; }
    recipes.full[recipeKey("my:" + r.id, st)] = r;
    await loadMine(st, true).catch(() => {});
    if (st.recipe === "my:" + r.id) refresh();
    openRecipe("my:" + r.id);
  }
  function importRecipe() {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = async () => {
      const file = inp.files && inp.files[0];
      if (!file) return;
      let r;
      try { r = JSON.parse(await file.text()); } catch (e) { alert(t("ed.badJson", { message: e.message })); return; }
      if (!r || typeof r !== "object" || !Array.isArray(r.fermentation)) { alert(t("ed.badFile")); return; }
      openEditor(r, true);
    };
    inp.click();
  }

  // Клики в листе, относящиеся к рецептам.
  sheet.addEventListener("click", async (e) => {
    const el = (sel) => e.target.closest(sel);
    if (el("[data-tab]")) { catState.tab = el("[data-tab]").dataset.tab; openCatalog(); return; }
    if (el("[data-rf]")) { catState.rf = el("[data-rf]").dataset.rf; renderCatalog(); return; }
    if (el("[data-fav]")) {
      const b = el("[data-fav]"); toggleFav(b.dataset.fav); b.setAttribute("aria-pressed", String(isFav(b.dataset.fav)));
      if (catState.rf === "fav" && sheet.querySelector(".rc-list")) renderCatalog();
      return;
    }
    if (el("[data-recipe]")) { const b = el("[data-recipe]"); openRecipe(b.dataset.recipe, Number(b.dataset.liters) || undefined); return; }
    if (el("[data-import]")) { importRecipe(); return; }
    if (el("[data-frow-add]")) {
      const box = $("frows"), last = box.lastElementChild, lo = last ? last.querySelector("[name=hi]").value : 18;
      box.insertAdjacentHTML("beforeend", fermRow({ temp: [Number(lo), Number(lo)], until: { stage: "done" } }, 1000 + box.children.length));
      return;
    }
    if (el("[data-frow-del]")) { const box = $("frows"); if (box.children.length > 1) el("[data-frow-del]").closest(".frow").remove(); return; }
    // День варки
    if (el("[data-step]") && brewView) {
      const i = Number(el("[data-step]").dataset.step), b = brewView.b;
      b.done = b.done.includes(i) ? b.done.filter((x) => x !== i) : b.done.concat(i);
      if (b.timer && b.timer.i === i && b.done.includes(i)) b.timer = null;
      brewSave(); brewRerender(); return;
    }
    if (el("[data-timer]") && brewView) {
      const i = Number(el("[data-timer]").dataset.timer), b = brewView.b, s = brewView.steps[i];
      if (b.timer && b.timer.i === i) b.timer = b.timer.end ? { i, end: null, left: b.timer.end - Date.now() } : { i, end: Date.now() + b.timer.left };
      else b.timer = { i, end: Date.now() + s.min * 60e3 };
      brewSave(); brewRerender(); return;
    }
    if (el("[data-timer-reset]") && brewView) { brewView.b.timer = null; brewSave(); brewRerender(); return; }
    if (el("[data-brew-cancel]")) {
      if (!confirm(t("brew.cancelConfirm"))) return;
      setBrew(cur(), null); brewView = null; sheet.close(); refresh(); return;
    }
    if (el("[data-brew-go]") && brewView) { brewGo(el("[data-brew-go]")); return; }
    // Карточка рецепта
    if (!rcView || !sheet.querySelector("#rc-body")) return;
    const { ref, r } = rcView;
    if (el("[data-rc-brew]")) startBrew(ref, rcView.liters);
    else if (el("[data-rc-ferment]")) { sheet.close(); openBatchDialog(r.style, ref, "ferm"); }
    else if (el("[data-rc-use]")) useRecipe(ref, r);
    else if (el("[data-rc-unbind]")) {
      try { await postBatch(cur(), { recipe: null }); } catch (err) { notice(escapeHtml(t("err.batch", { message: err.message })), "error"); return; }
      sheet.close(); refresh();
    }
    else if (el("[data-rc-export]")) exportRecipe(r);
    else if (el("[data-rc-copy]")) openEditor({ ...r, id: r.id + "-my", source: `copy of lib:${r.id}`, tested: r.tested }, true);
    else if (el("[data-rc-edit]")) openEditor(r, false);
    else if (el("[data-rc-delete]")) {
      if (!confirm(t("rc.confirmDelete", { name: rloc(r.name) }))) return;
      const st = cur();
      try { await apiSend("DELETE", "/api/recipes/" + r.id); } catch (err) { notice(escapeHtml(t("rc.deleteError", { message: err.message })), "error"); return; }
      delete recipes.full[recipeKey(ref, st)];
      if (st.recipe === ref) { st.recipe = null; save(); }
      await loadMine(st, true).catch(() => {});
      catState.tab = "recipes"; catState.rf = "mine"; openCatalog(); refresh();
    }
  });
  sheet.addEventListener("input", (e) => {
    if (e.target.id !== "rc-liters" || !rcView) return;
    rcView.liters = Number(e.target.value);
    $("rc-l").textContent = fmtL(rcView.liters);
    $("rc-body").innerHTML = recipeBody();
    fillPrimes($("rc-body"));
  });
  new MutationObserver(() => fillPrimes($("sheet-body"))).observe($("sheet-body"), { childList: true });

  // Выжимка рецепта для AI: НП/КП, засыпь, хмель, дрожжи, план брожения (текущий шаг), газация.
  function recipeBrief(r, stepI) {
    const en = (v) => Recipe.loc(v, "en");
    const r1 = (x) => String(Math.round(x * 10) / 10);
    const plan = r.fermentation.map((x, i) => `${i === stepI ? "*" : ""}${r1(x.temp[0])}-${r1(x.temp[1])}C>${x.until.stage || (x.until.plato != null ? x.until.plato + "P" : "d" + x.until.days)}`).join(",");
    return [`recipe ${en(r.name)} OG${r1(r.og)}/FG${r1(r.fg)} ${r.batch_l}L`,
      "malt " + (r.fermentables || []).map((x) => `${en(x.name).replace(/\s*\(.*\)/, "")} ${x.kg}`).join(","),
      "hops " + (r.hops || []).map((x) => `${x.name} ${x.g}g@${x.use === "dry" ? "dry" : x.use === "whirlpool" ? "wp" : x.min}`).join(","),
      r.yeast ? "yeast " + r.yeast.name : "", "plan " + plan, r.priming ? "co2 " + r.priming.vol_co2 : ""].filter(Boolean).join("; ");
  }

  // ---------- Всплывающие подсказки ----------
  let popFor = null;
  const dl = (pairs) => `<dl>${pairs.filter(([, v]) => v != null && v !== "").map(([k, v]) => `<dt>${escapeHtml(t(k))}</dt><dd>${escapeHtml(v)}</dd>`).join("")}</dl>`;
  const list = (msgs) => msgs.length ? `<ul>${msgs.map((m) => `<li class="${m.level}">${escapeHtml(msgText(m))}</li>`).join("")}</ul>` : "";
  function popContent(id) {
    if (!view) return "";
    const { a, last, pct, fc, style, og, current } = view;
    const u = tUnit(last.temp_units);
    if (id === "chip-batt") {
      return `<h4>${escapeHtml(t("device.battery"))} ${pct == null ? "–" : pct + "%"} · ${fmt(last.battery, 2)} ${escapeHtml(t("unit.volt"))}</h4><p style="margin:0">${batteryNote(pct, fc)}</p>`;
    }
    if (id === "band-t") {
      const s = a.temp.stats || {};
      return `<h4>${escapeHtml(t("device.temperature"))} ${fmt(last.temperature, 1)} ${u}</h4>` + dl([
        ["pop.temp.mean", s.mean != null ? fmt(s.mean, 1) + " °C" : null],
        ["pop.temp.range", s.min != null ? `${fmt(s.min, 1)} – ${fmt(s.max, 1)} °C` : null],
        ["pop.temp.swing", s.swing != null ? fmt(s.swing, 1) + " °C" : null],
        ["pop.temp.trend", s.trend != null ? (s.trend >= 0 ? "+" : "−") + fmt(Math.abs(s.trend), 1) + " °C" : null],
        ["pop.temp.spikes", s.spikes != null ? String(s.spikes) : null],
        ["pop.temp.style", style ? `${rangeText(style.t)} °C` : null],
      ]) + list(a.temp.msgs);
    }
    if (id === "chip-wifi") {
      return `<h4>${escapeHtml(t("device.wifi"))}: ${escapeHtml(rssiText(last.rssi))}</h4>` + dl([
        ["pop.wifi.rssi", last.rssi != null ? `${wifiPct(last.rssi)}% · ${String(last.rssi).replace("-", "−")} dBm` : null],
        ["device.interval", intervalText(last.interval_s)],
        ["device.tilt", last.angle != null ? fmt(last.angle, 1) + "°" : null],
      ]) + (last.rssi != null && last.rssi < -80 ? `<ul><li class="warn">${escapeHtml(t("pop.wifi.weak"))}</li></ul>` : "");
    }
    if (id === "chip-rate" || id === "band-g") {
      return `<h4>${escapeHtml(t("band.gravity"))} ${current == null ? "–" : fmt(current, 1) + " °P"}</h4>` + dl([
        ["pop.g.og", og != null ? fmt(og, 1) + " °P" : null],
        ["pop.g.fg", a.fg != null ? "≈ " + fmt(a.fg, 1) + " °P" : null],
        ["info.speedLabel", a.rate != null ? fmt(a.rate, 1) + " °P/" + t("unit.dayShort") : null],
        ["pop.g.style", style ? `${rangeText(style.og)} → ${rangeText(style.fg)} °P` : null],
      ]) + list(a.gravity.msgs);
    }
    if (id === "band-abv") {
      return `<h4>${escapeHtml(t("band.abvTitle"))} ${a.abvNow != null ? fmt(a.abvNow, 1) + "%" : "–"}</h4>` + dl([
        ["pop.abv.proj", a.projAbv != null ? "≈ " + fmt(a.projAbv, 1) + "%" : null],
        ["pop.abv.style", style ? `${rangeText(style.abv)}%` : null],
      ]) + (a.abv.msgs.length ? list(a.abv.msgs) : `<p style="margin:0">${escapeHtml(t("pop.abv.needBatch"))}</p>`);
    }
    return "";
  }
  function showPop(id) {
    const pop = $("pop"), anchor = $(id);
    popFor = id;
    pop.innerHTML = `<button class="close" type="button" aria-label="×">×</button>` + popContent(id);
    pop.hidden = false;
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth;
    pop.style.left = Math.max(12, Math.min(r.left + scrollX, scrollX + innerWidth - w - 12)) + "px";
    pop.style.top = (r.bottom + scrollY + 8) + "px";
    pop.querySelector(".close").onclick = hidePop;
  }
  function hidePop() { $("pop").hidden = true; popFor = null; }
  ["chip-batt", "band-t", "chip-wifi", "chip-rate", "band-g", "band-abv"].forEach((id) => {
    $(id).addEventListener("click", (e) => { e.stopPropagation(); if (popFor === id) hidePop(); else showPop(id); });
  });
  document.addEventListener("click", (e) => { if (!$("pop").hidden && !e.target.closest("#pop")) hidePop(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hidePop(); });

  // «Данные получены N секунд назад» — обновляется каждую секунду без запросов
  let seenInfo = null;
  function updateSeen() {
    if (!seenInfo) return;
    const stale = Date.now() - seenInfo.ts > seenInfo.expected * 3 + 120e3;
    const el = $("seen");
    el.textContent = t("status.received", { ago: ago(seenInfo.ts) }) + (stale ? t("status.stale") : "");
    el.classList.toggle("stale", stale);
  }
  setInterval(updateSeen, 1000);

  function renderCharts(rows, last) {
    $("charts").hidden = false;
    const gRaw = rows.filter((r) => plausible(r.g)).map((r) => ({ x: r.ts, y: r.g }));
    const tPts = rows.filter((r) => r.temperature != null).map((r) => ({ x: r.ts, y: r.temperature }));
    const unit = tUnit(last.temp_units);
    const g = cfg.smooth ? smoothSeries(gRaw) : gRaw;
    renderChart("chart-g", g, cfg.smooth ? gRaw : null, css("--amber"), "°P", 1, 2);
    // Температура с полосой нормы стиля
    const style = view && view.style;
    let band = null;
    if (style) {
      const conv = (c) => last.temp_units === "F" ? c * 9 / 5 + 32 : c;
      band = { lo: conv(style.t[0]), hi: conv(style.t[1]), color: "rgba(47, 111, 115, .14)" };
    }
    $("t-note").textContent = style ? t("charts.styleRange", { lo: fmtMax1(style.t[0]), hi: fmtMax1(style.t[1]) }) : "";
    renderChart("chart-t", tPts, null, css("--teal"), unit, 1, 1, band);
    // Алкоголь по ходу партии — от начальной плотности
    const og = view && view.og;
    $("abv-card").hidden = og == null;
    if (og != null) {
      const from = view.st.batchStart;
      const pts = g.filter((p) => p.x >= from && p.y != null).map((p) => ({ x: p.x, y: Brew.abv(og, p.y) }));
      renderChart("chart-a", pts, null, css("--violet"), "%", 1, 1);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------- Управление ----------
  function syncRanges() {
    $("ranges").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.range === cfg.range)));
  }
  $("ranges").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-range]");
    if (!b) return;
    rangePicked = true;
    cfg.range = b.dataset.range; save(); syncRanges(); refresh();
  });
  $("smooth").checked = cfg.smooth;
  $("smooth").onchange = (e) => { cfg.smooth = e.target.checked; save(); refresh(); };
  $("refresh").onclick = refresh;

  // ---------- Стиль пива и новая партия ----------
  function fillStyles(sel, value) {
    const lang = I18N.lang();
    const items = Brew.STYLES.map((x) => [x.id, x.name[lang] || x.name.en]).sort((p, q) => p[1].localeCompare(q[1], I18N.locale()));
    sel.innerHTML = `<option value="">${escapeHtml(t("batchdlg.noStyle"))}</option>` +
      items.map(([id, name]) => `<option value="${id}">${escapeHtml(name)}</option>`).join("");
    sel.value = value || "";
  }
  function styleInfo(id) {
    const x = Brew.byId[id];
    if (!x) return "";
    return t("batchdlg.styleInfo", { t: rangeText(x.t), og: rangeText(x.og), fg: rangeText(x.fg), abv: rangeText(x.abv) });
  }
  const fgPlaceholder = (id) => {
    const x = Brew.byId[id];
    return x ? t("batchdlg.fgFromStyle", { fg: fmt((x.fg[0] + x.fg[1]) / 2, 1) }) : t("batchdlg.fgDefault");
  };
  const parseFg = (v) => { const n = parseFloat(String(v).replace(",", ".")); return Number.isFinite(n) ? Math.round(n * 10) / 10 : null; };

  const bdlg = $("batch-dlg"), bform = $("batch-form");
  // Рецепт (избранные первыми) и режим: «Варим сейчас» — день варки по шагам, партия начнётся
  // с «Начать брожение»; «Уже сварено» — сразу партия с целями из рецепта.
  let bmode = "brew";
  async function openBatchDialog(preStyle, preRecipe, mode) {
    const st = cur();
    if (!st) { $("open-settings").click(); return; }
    fillStyles(bform.elements.style, preStyle || st.style);
    bform.elements.fg.value = st.fg ?? "";
    bform.elements.fg.placeholder = fgPlaceholder(preStyle || st.style);
    bform.elements.start.value = toLocalInput(Date.now());
    $("style-info").textContent = styleInfo(preStyle || st.style);
    $("batchdlg-error").textContent = "";
    const sel = bform.elements.recipe;
    sel.innerHTML = `<option value="">${escapeHtml(t("batchdlg.noRecipe"))}</option>`;
    $("recipe-info").textContent = "";
    bmode = mode || "brew";
    syncBatchMode();
    bdlg.showModal();
    await ensureRecipeLists().catch(() => {});
    const items = recipeItems(), opt = (x) => `<option value="${x.ref}">${escapeHtml(rloc(x.name))}</option>`;
    const group = (label, list) => list.length ? `<optgroup label="${escapeHtml(label)}">${list.map(opt).join("")}</optgroup>` : "";
    sel.innerHTML = `<option value="">${escapeHtml(t("batchdlg.noRecipe"))}</option>` +
      group("★ " + t("rc.f.fav"), items.filter((x) => isFav(x.ref))) + group(t("rc.f.mine"), items.filter((x) => x.mine)) + group(t("rc.lib"), items.filter((x) => !x.mine));
    sel.value = preRecipe || "";
    if (preRecipe) await applyRecipeChoice(); else syncBatchMode();
  }
  function syncBatchMode() {
    const ref = bform.elements.recipe.value, brew = !!ref && bmode === "brew";
    $("bmode").hidden = !ref;
    $("bmode").querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === bmode)));
    $("bfields").hidden = brew;
    $("batch-go").textContent = t(brew ? "batchdlg.goBrew" : "batchdlg.go");
  }
  async function applyRecipeChoice() {
    const ref = bform.elements.recipe.value;
    syncBatchMode();
    if (!ref) { $("recipe-info").textContent = ""; return; }
    let r;
    try { r = await loadRecipe(ref); } catch (e) { $("recipe-info").textContent = t("rc.loadError", { message: e.message }); return; }
    if (bform.elements.recipe.value !== ref) return;
    bform.elements.style.value = Brew.byId[r.style] ? r.style : "";
    bform.elements.fg.value = r.fg;
    $("style-info").textContent = styleInfo(r.style);
    $("recipe-info").textContent = t("batchdlg.recipeInfo", { fg: fmt(r.fg, 1), t: tempText(Recipe.range(r)), co2: r.priming ? fmtMax1(r.priming.vol_co2) : "–", l: fmtMax1(r.batch_l) });
  }
  bform.elements.recipe.addEventListener("change", applyRecipeChoice);
  $("bmode").addEventListener("click", (e) => { const b = e.target.closest("[data-mode]"); if (b) { bmode = b.dataset.mode; syncBatchMode(); } });
  bform.elements.style.addEventListener("change", (e) => {
    $("style-info").textContent = styleInfo(e.target.value);
    bform.elements.fg.placeholder = fgPlaceholder(e.target.value);
  });
  bform.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (e.submitter && e.submitter.value === "cancel") { bdlg.close(); return; }
    const st = cur(), ref = bform.elements.recipe.value;
    const r = ref ? await loadRecipe(ref).catch(() => null) : null;
    if (ref && !r) { $("batchdlg-error").textContent = t("rc.loadError", { message: "" }); return; }
    if (r && bmode === "brew") { bdlg.close(); startBrew(ref, r.batch_l); return; }
    const start = bform.elements.start.value ? new Date(bform.elements.start.value).getTime() : Date.now();
    if (!confirmReset(st, start)) return;
    const body = { start, style: bform.elements.style.value || null, fg: parseFg(bform.elements.fg.value), recipe: ref || null };
    if (r) body.range = Recipe.range(r);
    try { await postBatch(st, body); }
    catch (err) { $("batchdlg-error").textContent = t("err.batch", { message: err.message }); return; }
    cfg.range = "batch"; rangePicked = false;
    bdlg.close(); syncRanges(); refresh();
  });

  const dlg = $("settings"), form = $("settings-form");
  const toLocalInput = (ms) => {
    if (!ms) return "";
    const d = new Date(ms);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  };

  // Токен стика: те же правила, что и на воркере (iSpindel хранит его в JSON-конфиге).
  const TOKEN_MIN = 8, TOKEN_MAX = 64;
  function tokenProblem(tok) {
    if (tok.length < TOKEN_MIN) return t("err.tokenShort", { n: TOKEN_MIN });
    if (tok.length > TOKEN_MAX) return t("err.tokenLong", { n: TOKEN_MAX });
    if (!/^[\x21-\x7e]+$/.test(tok) || /["\\]/.test(tok)) return t("err.tokenChars");
    return null;
  }
  function generateToken() {
    const abc = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
    const bytes = crypto.getRandomValues(new Uint8Array(20));
    return Array.from(bytes, (b) => abc[b % abc.length]).join("");
  }
  async function post(path, body, access) {
    const headers = { "Content-Type": "application/json" };
    if (access) headers["X-Access"] = access;
    const res = await fetch(apiBase() + path, { method: "POST", headers, body: JSON.stringify(body || {}) });
    let data = {};
    try { data = await res.json(); } catch { /* не JSON */ }
    if (!res.ok) { const e = new Error(data.error || String(res.status)); e.code = data.code; e.status = res.status; throw e; }
    return data;
  }

  // Регистрация токена: сервер заводит стик и выдаёт ключ доступа. Токен, который уже занят, не отдаётся.
  async function addStick(tok, extra = {}) {
    const { stick, access } = await post("/api/register", { token: tok });
    const existing = cfg.sticks.find((x) => x.id === stick);
    const entry = Object.assign(existing || { id: stick, name: "", batchStart: null, formula: "" }, extra, { access, token: tok });
    if (!existing) cfg.sticks.push(entry);
    cfg.current = stick; cfg.device = "";
    save();
    return entry;
  }

  // Ссылка «Поделиться»: #join=<ключ доступа>. Открыл — стик добавился.
  let joined = false;
  // Подключиться по ключу из ссылки «Поделиться»: проверяем его на сервере и добавляем стик.
  async function joinAccess(access) {
    const data = await api("/api/devices", {}, access);
    let entry = cfg.sticks.find((x) => x.id === data.stick);
    if (!entry) {
      entry = { id: data.stick, access, token: null, name: (data.devices[0] || {}).device || "", batchStart: null, formula: "" };
      cfg.sticks.push(entry);
    }
    cfg.current = entry.id; cfg.device = "";
    save();
    joined = true;
    return entry;
  }
  // Ключ из ссылки целиком (…#join=КЛЮЧ) или сам ключ.
  function parseJoin(text) {
    const s = (text || "").trim();
    const m = /[#&?]join=([A-Za-z0-9_-]{16,})/.exec(s) || /^([A-Za-z0-9_-]{16,})$/.exec(s);
    return m ? m[1] : null;
  }
  async function handleJoin() {
    const access = parseJoin(location.hash);
    if (!access) return;
    history.replaceState(null, "", location.pathname + location.search);
    try { await joinAccess(access); }
    catch (e) { notice(escapeHtml(t("err.joinFailed", { message: e.message })), "error"); }
  }

  // Переход со старой версии, где был один токен: забираем его стик.
  async function migrateLegacy() {
    if (!cfg.legacy) return;
    const { token, batchStart, formula } = cfg.legacy;
    try {
      const st = await addStick(token, { formula });
      delete cfg.legacy; save();
      if (batchStart) {
        await fetch(apiBase() + "/api/batch", { method: "POST", headers: { "Content-Type": "application/json", "X-Access": st.access },
          body: JSON.stringify({ start: batchStart }) }).catch(() => {});
      }
    } catch (e) {
      if (e.code === "taken" || e.status === 400) { delete cfg.legacy; save(); }
    }
  }

  // ---------- Окно настроек ----------
  // Права админа хранит сервер (у ключа доступа); до первого ответа — по токену, он есть у зарегистрировавшего.
  const isAdmin = (st) => !!st && (st.admin ?? !!st.token);
  function renderSticks() {
    const st = cur();
    $("stick-list").innerHTML = cfg.sticks.length ? cfg.sticks.map((x) => `
      <li><button type="button" class="set-row" data-id="${escapeHtml(x.id)}"><span class="dot${x === st ? " on" : ""}"></span>
        <span class="t"><b>${escapeHtml(stickName(x))}</b><small>${escapeHtml(stickSub(x))}</small></span>
        <span class="tag${isAdmin(x) ? "" : " guest"}">${escapeHtml(t(isAdmin(x) ? "role.owner" : "role.guest"))}</span><span class="ch">›</span></button></li>`).join("")
      : `<li class="empty">${escapeHtml(t("sticks.empty"))}</li>`;
  }
  // Подпись в списке: стиль и день партии.
  function stickSub(x) {
    const style = x.style && Brew.byId[x.style];
    const parts = style ? [style.name[I18N.lang()] || style.name.en] : [];
    parts.push(x.batchStart ? t("set.day", { n: Math.floor((Date.now() - x.batchStart) / 86400e3) + 1 }) : t("set.noBatch"));
    return parts.join(" · ");
  }

  // Экраны настроек: корень (стики, сервер, язык) → страница стика с разделами, добавление, сервер.
  let setPage = "root", setSeg = "batch";
  function showPage(page) {
    const st = cur();
    if (page === "stick" && !st) page = "root";
    setPage = page;
    dlg.querySelectorAll(".set-page").forEach((el) => { el.hidden = el.dataset.page !== page; });
    $("set-back").hidden = page === "root";
    $("set-title").textContent = page === "stick" ? stickName(st)
      : t({ root: "settings.title", add: "sticks.add", server: "settings.server" }[page]);
    $("set-role").hidden = page !== "stick";
    if (page === "stick") {
      $("set-role").textContent = t(isAdmin(st) ? "role.owner" : "role.guest");
      $("set-role").classList.toggle("guest", !isAdmin(st));
    }
    if (page === "root") {
      renderSticks();
      $("set-server-v").textContent = t(cfg.api ? "set.serverCustom" : "set.serverDefault");
      $("set-lang-v").textContent = I18N.name(I18N.lang());
    }
    showSeg(setSeg);
    form.scrollTop = 0;
  }
  function showSeg(seg) {
    setSeg = seg;
    $("set-seg").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.seg === seg)));
    dlg.querySelectorAll(".set-seg").forEach((el) => { el.hidden = el.dataset.segPage !== seg; });
    $("set-save").hidden = !(setPage === "server" || (setPage === "stick" && (seg === "batch" || seg === "measure" || (seg === "ai" && isAdmin(cur())))));
    if (setPage === "stick" && seg === "access") syncAccess();
    if (setPage === "stick" && seg === "notify") syncPush();
    if (setPage === "stick" && seg === "ai") syncAi();
  }
  // Доступ: у гостя — пояснение; список подключённых и очистка истории — только у владельца.
  function syncAccess() {
    const st = cur(), owner = isAdmin(st);
    $("acc-guest").hidden = owner;
    $("history-row").hidden = !owner;
    $("share-box").hidden = true;
    $("stick-error").textContent = $("history-msg").textContent = "";
    $("members").hidden = true; renderMembers();
  }

  // ---------- Кто подключён к стику ----------
  // Из User-Agent достаём браузер и систему: «Chrome · Android».
  function parseUA(ua) {
    if (!ua) return null;
    const os = /iPhone|iPad|iPod/.test(ua) ? (/iPad/.test(ua) ? "iPadOS" : "iOS")
      : /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows" : /Mac OS X|Macintosh/.test(ua) ? "macOS"
      : /CrOS/.test(ua) ? "ChromeOS" : /Linux/.test(ua) ? "Linux" : null;
    const br = /Edg\//.test(ua) ? "Edge" : /SamsungBrowser/.test(ua) ? "Samsung Internet" : /OPR\/|Opera/.test(ua) ? "Opera"
      : /YaBrowser/.test(ua) ? "Yandex" : /Firefox|FxiOS/.test(ua) ? "Firefox" : /CriOS|Chrome\//.test(ua) ? "Chrome"
      : /Safari\//.test(ua) ? "Safari" : null;
    const mobile = /Mobile|Android|iPhone|iPad/.test(ua);
    return { label: [br, os].filter(Boolean).join(" · ") || ua.slice(0, 40), mobile };
  }
  const DEVICE_ICONS = {
    phone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>`,
    desktop: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg>`,
    link: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>`,
  };
  // Список видит и правит только тот, кто зарегистрировал стик (у остальных воркер отвечает 403).
  async function renderMembers() {
    const box = $("members"), st = cur();
    if (!isAdmin(st)) { box.hidden = true; return; }
    let list;
    try { list = (await api("/api/members", {}, st.access)).members || []; }
    catch { box.hidden = true; return; }
    if (cur() !== st) return;
    const used = list.filter((m) => m.last_used != null);
    const pending = list.filter((m) => m.last_used == null);
    const revokeBtn = (m, key) => m.you ? ""
      : `<button type="button" class="revoke" data-revoke="${escapeHtml(m.id)}">${escapeHtml(t(key))}</button>`;
    const adminBtn = (m) => m.you ? ""
      : `<button type="button" class="role" data-admin="${escapeHtml(m.id)}" data-to="${m.kind === "owner" ? "0" : "1"}">${escapeHtml(t(m.kind === "owner" ? "members.unAdmin" : "members.makeAdmin"))}</button>`;
    box.innerHTML = `<h4>${escapeHtml(t("members.title", { name: stickName(st), n: used.length }))}</h4>
      <ul>${used.map((m) => {
        const p = parseUA(m.user_agent);
        const icon = p && p.mobile ? DEVICE_ICONS.phone : DEVICE_ICONS.desktop;
        return `<li>${icon}<span class="who">${escapeHtml(p ? p.label : t("members.unknown"))}${m.you ? ` <span class="you">· ${escapeHtml(t("members.you"))}</span>` : ""}</span>
          <span class="acts">${adminBtn(m)}${revokeBtn(m, "members.revoke")}</span>
          <small>${escapeHtml(t(m.kind === "owner" ? "members.owner" : "members.shared"))} · ${escapeHtml(Date.now() - m.last_used < 5 * 60e3 ? t("members.now") : t("members.active", { ago: ago(m.last_used) }))}</small></li>`;
      }).join("")}
      ${pending.map((m) => `<li>${DEVICE_ICONS.link}<span class="who">${escapeHtml(t("members.link", { date: dayTime(m.created) }))}</span>
          <span class="acts">${revokeBtn(m, "members.revokeLink")}</span><small>${escapeHtml(t("members.notOpened"))}</small></li>`).join("")}</ul>
      <p class="note">${escapeHtml(t("members.hint"))}</p>
      <small class="field-error" id="members-error"></small>`;
    box.hidden = false;
  }
  $("members").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-revoke], [data-admin]");
    if (!b) return;
    const st = cur(), revoke = "revoke" in b.dataset, toAdmin = b.dataset.to === "1";
    if (!confirm(t(revoke ? "members.confirm" : toAdmin ? "members.adminConfirm" : "members.unAdminConfirm"))) return;
    b.disabled = true;
    try {
      if (revoke) await post("/api/members/revoke", { id: b.dataset.revoke }, st.access);
      else await post("/api/members/admin", { id: b.dataset.admin, admin: toAdmin }, st.access);
      renderMembers();
    } catch (err) {
      b.disabled = false;
      $("members-error").textContent = t(revoke ? "members.revokeFail" : "members.adminFail", { message: err.message });
    }
  });

  // Очистить историю выбранного стика (только владелец): на сервере остаётся последнее показание.
  async function clearHistory(btn) {
    const st = cur();
    if (!isAdmin(st) || !confirm(t("history.confirm", { name: stickName(st) }))) return;
    btn.disabled = true;
    try {
      const { deleted } = await post("/api/history/clear", {}, st.access);
      hist = null;
      for (const k of Object.keys(localStorage)) if (k.startsWith(`ispindel.batt.${st.id}.`)) localStorage.removeItem(k);
      $("history-msg").textContent = t("history.done", { n: deleted });
      refresh();
    } catch (err) {
      $("history-msg").textContent = t("history.fail", { message: err.message });
    }
    btn.disabled = false;
  }

  $("stick-list").addEventListener("click", (e) => {
    const row = e.target.closest("[data-id]");
    if (!row) return;
    if (cfg.current !== row.dataset.id) switchStick(row.dataset.id);
    syncForm();
    showPage("stick");
  });
  dlg.querySelectorAll("[data-go]").forEach((b) => { b.onclick = () => showPage(b.dataset.go); });
  $("set-back").onclick = () => { syncForm(); syncServerForm(); showPage("root"); };
  $("set-close").onclick = () => dlg.close();
  $("set-done").onclick = () => dlg.close();
  // Запрос к серверу из окна настроек: блокируем окно и крутим индикатор на нажатой кнопке.
  async function withBusy(btn, fn) {
    if (dlg.classList.contains("busy")) return;
    dlg.classList.add("busy");
    if (btn) btn.classList.add("loading");
    try { return await fn(); }
    finally { dlg.classList.remove("busy"); if (btn) btn.classList.remove("loading"); }
  }
  $("set-seg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-seg]");
    if (b) showSeg(b.dataset.seg);
  });

  async function saveSettings() {
    let api = serverCustom ? form.elements.api.value.trim().replace(/\/+$/, "") : "";
    if (api === DEFAULT_API) api = "";
    if (serverCustom && api && !/^https?:\/\/[^/\s]+/.test(api)) { $("api-error").textContent = t("err.badUrl"); return; }
    cfg.api = api;
    const st = cur();
    if (st) {
      // Полином общий для всех, кто подключён к стику: проверяем, предупреждаем и сохраняем на сервере.
      // Стиль и ожидаемая конечная плотность партии — общие, сохраняем на сервере.
      const style = form.elements.style.value || null, fg = parseFg(form.elements.fg.value);
      if (style !== (st.style ?? null) || fg !== (st.fg ?? null)) {
        try { await postBatch(st, { style, fg }); }
        catch (err) { $("profile-error").textContent = t("err.batch", { message: err.message }); return; }
      }
      // Единицы тоже общие: предупреждаем и сохраняем на сервере.
      const units = form.elements.units.value;
      if (units !== (st.units || "auto")) {
        if (!confirm(t("units.confirm"))) return;
        try {
          const res = await fetch(apiBase() + "/api/units", {
            method: "POST", headers: { "Content-Type": "application/json", "X-Access": st.access }, body: JSON.stringify({ units }),
          });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || String(res.status));
        } catch (err) { $("units-error").textContent = t("err.unitsSave", { message: err.message }); return; }
        st.units = units;
        save();
      }
      const formula = form.elements.formula.value.trim();
      if (formula !== (st.formula || "")) {
        try { compileFormula(formula); }
        catch (err) { $("formula-error").textContent = err.message; form.elements.formula.focus(); return; }
        if (!confirm(t("formula.confirm"))) return;
        try { await postFormula(st, formula); }
        catch (err) { $("formula-error").textContent = t("err.formulaSave", { message: err.message }); return; }
        st.formula = formula;
        save();
      }
      const v = form.elements.batchStart.value;
      const start = v ? new Date(v).getTime() : null;
      // datetime-local хранит минуты — сравниваем с точностью до минуты.
      const same = (start === null && !st.batchStart) || (start !== null && st.batchStart && Math.abs(start - st.batchStart) < 60e3);
      if (!same) {
        save();
        if (!(await setBatch(start))) return;
      }
    }
    save(); syncRanges(); dlg.close(); refresh();
  }

  // ---------- Журнал уведомлений ----------
  // Сервер пишет события стика в журнал; приложение раз в минуту догружает только новые (?since=).
  // «Новые» — после последнего открытия журнала на этом устройстве.
  const ALERT_KINDS = {
    tempHigh: ["bad", "temp", "temp"], tempLow: ["bad", "temp", "temp"], tempOk: ["ok", "temp", "check"],
    silent: ["warn", "link", "nolink"], back: ["info", "link", "check"], battery: ["warn", "link", "battery"], done: ["info", "ferm", "beer"],
  };
  const ALERT_ICONS = {
    temp: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 9v8"/></svg>`,
    check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
    nolink: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5-2.7M19 13a10 10 0 0 0-2.2-1.6"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>`,
    battery: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2" stroke-linecap="round"/><rect x="4" y="9" width="3" height="6" fill="currentColor" stroke="none"/></svg>`,
    beer: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 8h10v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M15 11h2a2 2 0 0 1 0 4h-2"/><path d="M5 8a2.5 2.5 0 0 1 2.5-3.5 3 3 0 0 1 5 0A2 2 0 0 1 15 8"/></svg>`,
  };
  const alertsCache = {};
  let alertsFilter = "all";
  const seenKey = (st) => `ispindel.alertsSeen.${st.id}`;
  const getSeen = (st) => { try { return Number(localStorage.getItem(seenKey(st))) || 0; } catch { return 0; } };
  async function loadAlerts(st) {
    const c = alertsCache[st.id] || (alertsCache[st.id] = { list: [], max: 0 });
    const { alerts } = await api("/api/alerts", c.max ? { since: c.max } : {}, st.access);
    if (alerts.length) {
      c.list = alerts.concat(c.list).slice(0, 100);
      c.max = Math.max(c.max, ...alerts.map((a) => a.ts));
    }
    if (cur() === st) renderBell();
  }
  function renderBell() {
    const st = cur(), c = st && alertsCache[st.id];
    $("open-alerts").hidden = !st;
    const n = c ? c.list.filter((a) => a.ts > getSeen(st)).length : 0;
    $("alerts-badge").hidden = !n;
    $("alerts-badge").textContent = n > 9 ? "9+" : String(n);
    $("open-alerts").classList.toggle("has-new", n > 0);
  }
  function alertText(a) {
    const p = { ...a.params };
    for (const k of ["t", "lo", "hi"]) if (typeof p[k] === "number") p[k] = fmtMax1(Math.round(p[k] * 10) / 10);
    return { title: t(`alert.${a.key}.title`, p), body: t(`alert.${a.key}.body`, p) };
  }
  function dayLabel(ts) {
    const d = new Date(ts), today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((today - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400e3);
    return diff === 0 ? t("alerts.today") : diff === 1 ? t("alerts.yesterday")
      : d.toLocaleDateString(I18N.locale(), { day: "numeric", month: "short" });
  }
  function alertsHtml() {
    const st = cur(), c = alertsCache[st.id] || { list: [] }, seen = getSeen(st);
    const list = c.list.filter((a) => ALERT_KINDS[a.key] && (alertsFilter === "all" || ALERT_KINDS[a.key][1] === alertsFilter));
    const chips = ["all", "temp", "link", "ferm"].map((f) =>
      `<button type="button" data-afilter="${f}" aria-pressed="${f === alertsFilter}">${escapeHtml(t("alerts.f." + f))}</button>`).join("");
    let day = "", rows = "";
    for (const a of list) {
      const label = dayLabel(a.ts);
      if (label !== day) { day = label; rows += `<li class="day">${escapeHtml(label)}</li>`; }
      const [lvl, , icon] = ALERT_KINDS[a.key], txt = alertText(a), fresh = a.ts > seen;
      rows += `<li class="ev${fresh ? " new" : ""}"><span class="ic ${lvl}">${ALERT_ICONS[icon]}</span>
        <b>${escapeHtml(txt.title)}${fresh ? `<span class="dotnew"></span>` : ""}</b>
        <span class="t">${new Date(a.ts).toLocaleTimeString(I18N.locale(), { hour: "2-digit", minute: "2-digit" })}</span>
        <small>${escapeHtml(txt.body)}</small></li>`;
    }
    return `<div class="top-line"><h2>${escapeHtml(t("alerts.title"))}</h2><button type="button" class="link" data-alerts-setup>${escapeHtml(t("alerts.setup"))}</button>${closeBtn}</div>
      <div class="cats">${chips}</div>
      ${rows ? `<ul class="alerts">${rows}</ul>` : `<p class="hint">${escapeHtml(t("alerts.empty"))}</p>`}`;
  }
  $("open-alerts").onclick = async () => {
    const st = cur();

  // ---------- Push-уведомления на этом устройстве ----------
  const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const b64uBytes = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), (ch) => ch.charCodeAt(0));
  async function pushSub(create) {
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) throw new Error(t("push.noSw"));
    let sub = await reg.pushManager.getSubscription();
    if (!sub && create) {
      const { key } = await api("/api/push/key");
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(key) });
    }
    return sub;
  }
  const pushEvents = () => [...dlg.querySelectorAll("#push-events input.switch")].filter((i) => i.checked).map((i) => i.value);
  function pushSave(sub, events) {
    const k = sub.toJSON().keys;
    return post("/api/push/subscribe", { endpoint: sub.endpoint, p256dh: k.p256dh, auth: k.auth, events, lang: I18N.lang() }, cur().access);
  }
  function showPushState(on, events) {
    $("push-off").hidden = on;
    ["push-on", "push-events", "push-test"].forEach((id) => { $(id).hidden = !on; });
    if (events) dlg.querySelectorAll("#push-events input.switch").forEach((i) => { i.checked = events.includes(i.value); });
  }
  async function syncPush() {
    const st = cur();
    const style = st && st.style ? Brew.byId[st.style] : null;
    $("push-temp-sub").textContent = style ? t("push.ev.tempSub", { lo: fmtMax1(style.t[0]), hi: fmtMax1(style.t[1]) }) : t("push.ev.tempNoStyle");
    $("push-msg").textContent = "";
    const iosBrowser = isIOS && !installed();
    $("push-ios").hidden = !iosBrowser;
    const note = iosBrowser ? t("push.iosNote") : !pushSupported() ? t("push.unsupported")
      : Notification.permission === "denied" ? t("push.denied") : "";
    $("push-note").textContent = note; $("push-note").hidden = !note;
    if (iosBrowser || !pushSupported()) { showPushState(false); $("push-off").hidden = true; return; }
    showPushState(false);
    try {
      const sub = await pushSub(false);
      if (!sub) return;
      const state = await post("/api/push/state", { endpoint: sub.endpoint }, st.access);
      if (cur() !== st) return;
      showPushState(state.subscribed, state.events);
      if (state.subscribed && state.lang !== I18N.lang()) pushSave(sub, state.events).catch(() => {});
    } catch { /* нет service worker или сети — останется «включить» */ }
  }
  $("push-enable").onclick = () => withBusy($("push-enable"), pushEnable);
  async function pushEnable() {
    const btn = $("push-enable"); btn.disabled = true; $("push-msg").textContent = "";

      const sub = await pushSub(true);

  // ---------- AI-помощник по партии (DeepSeek) ----------
  // Ключ, движок и лимит хранит сервер (настраивает админ). Счётчик обновляем не чаще раза в 5 минут,
  // чат партии загружаем только при открытии — чтобы не тратить чтения базы.
  const AI_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>`;
  const SEND_ICON = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>`;
  const aiCache = {};
  let aiBusy = false, aiDraft = "";
  async function loadAi(st, withLog = false, force = false) {
    const c = aiCache[st.id];
    if (!force && !withLog && c && Date.now() - c.at < 5 * 60e3) return c;
    const data = await api("/api/ai", withLog ? { log: 1 } : {}, st.access);
    aiCache[st.id] = { ...(c || {}), ...data, log: data.log || (c && c.log) || null, at: Date.now() };
    if (cur() === st) updateAiButton();
    return aiCache[st.id];
  }
  // Кнопка в панели партии: появляется после первой загрузки состояния, число — сколько вопросов осталось.
  function updateAiButton() {
    const bar = document.querySelector("#batchp .actbar");
    if (!bar) return;
    const html = aiButton(), old = $("ai-btn");
    if (old) old.outerHTML = html; else if (html) bar.insertAdjacentHTML("beforeend", html);
    if ($("ai-btn")) $("ai-btn").onclick = () => openAi();
  }
  function aiButton() {
    const st = cur(), c = st && aiCache[st.id];
    if (!c || (!c.enabled && !isAdmin(st))) return "";
    const label = c.enabled ? `AI · ${c.left}` : "AI";
    return `<button type="button" class="ai" id="ai-btn">${AI_ICON}${escapeHtml(label)}</button>`;
  }
  // Сжатая сводка партии для промта: одна строка, десятичные через точку.
  function aiContext() {
    if (!view) return "";
    const { a, st, style, og, current, last } = view;
    const r1 = (x) => String(Math.round(x * 10) / 10);
    const p = [];
    if (style) p.push(`${style.id} ${r1(style.t[0])}-${r1(style.t[1])}C`);
    if (og != null) p.push(`OG${r1(og)}`);
    if (current != null) p.push(`g${r1(current)}P`);
    if (a.fg != null) p.push(`FG~${r1(a.fg)}`);
    if (st.batchStart) p.push(`d${r1((Date.now() - st.batchStart) / 86400e3)}`);
    if (a.stage) p.push(`st=${a.stage}`);
    if (a.alarm) p.push(`alarm=${a.alarm.id}`);
    if (a.rate != null) p.push(`r${r1(a.rate)}`);
    if (a.peak) p.push(`pk${r1(a.peak.rate)}`);
    const tc = toC(last.temperature, last.temp_units);
    if (tc != null) p.push(`T${r1(tc)}C`);
    const ts = a.temp.stats || {};
    if (ts.min != null) p.push(`T24 ${r1(ts.min)}-${r1(ts.max)}`);
    if (a.abvNow != null) p.push(`abv${r1(a.abvNow)}${a.projAbv != null ? ">" + r1(a.projAbv) : ""}`);
    if (view.recipe) p.push("| " + recipeBrief(view.recipe, view.rstep ? view.rstep.i : -1));
    return p.join(" ");
  }
  const resetIn = (ts) => { const m = Math.max(0, Math.round((ts - Date.now()) / 60e3)); return t("ai.resetIn", { h: Math.floor(m / 60), m: m % 60 }); };
  function aiHtml(pending) {
    const st = cur(), c = aiCache[st.id] || {};
    const who = (x) => x.mine ? t("ai.you") : (parseUA(x.ua) || {}).label || t("members.unknown");
    const time = (ts) => new Date(ts).toLocaleTimeString(I18N.locale(), { hour: "2-digit", minute: "2-digit" });
    const rows = (c.log || []).map((x) => `<div class="q">${escapeHtml(x.q)}<small>${escapeHtml(who(x))} · ${time(x.ts)}</small></div>
      <div class="a"><span class="who">${AI_ICON}DeepSeek</span><br>${escapeHtml(x.a)}<small>${time(x.ts)}</small></div>`).join("");
    const wait = pending ? `<div class="q">${escapeHtml(pending)}</div><div class="a wait">${escapeHtml(t("ai.thinking"))}</div>` : "";
    const count = c.enabled ? `<span class="ai-count${c.left ? "" : " low"}">${escapeHtml(t("ai.count", { used: c.limit - c.left, limit: c.limit }))}</span>` : "";
    let bottom;
    if (!c.enabled) {
      bottom = `<p class="ai-note">${escapeHtml(t(isAdmin(st) ? "ai.offAdmin" : "ai.offGuest"))}</p>` +
        (isAdmin(st) ? `<button type="button" class="link" data-ai-setup>${escapeHtml(t("ai.setup"))}</button>` : "");
    } else if (!c.left) {
      bottom = `<p class="ai-note">${escapeHtml(t("ai.limitReached", { in: resetIn(c.resetAt) }))}</p>`;
    } else {
      const chips = ["ai.q.ok", "ai.q.bottle", "ai.q.temp"].map((k) => `<button type="button" data-ai-q="${escapeHtml(t(k))}" ${aiBusy ? "disabled" : ""}>${escapeHtml(t(k))}</button>`).join("");
      bottom = `<div class="ai-chips">${chips}</div>
        <div class="ai-ask"><textarea id="ai-q" rows="1" maxlength="500" placeholder="${escapeHtml(t("ai.placeholder"))}">${escapeHtml(aiDraft)}</textarea>
          <button type="button" id="ai-send" aria-label="${escapeHtml(t("ai.send"))}" ${aiBusy ? "disabled" : ""}>${SEND_ICON}</button></div>
        <p class="ai-foot">${escapeHtml(t("ai.foot", { in: resetIn(c.resetAt), lang: I18N.name(I18N.lang()) }))}</p>`;
    }
    const empty = !rows && !wait && c.enabled ? `<p class="hint">${escapeHtml(t("ai.empty"))}</p>` : "";
    return `<div class="top-line ai-head"><h2>${AI_ICON.replace("<svg", '<svg width="22" height="22"')} ${escapeHtml(t("ai.title"))}</h2>${count}${closeBtn}</div>
      <div class="ai-thread" id="ai-thread">${rows}${wait}</div>${empty}${bottom}
      <button type="button" class="secondary ai-close" data-close>${escapeHtml(t("ai.close"))}</button>`;
  }
  function renderAi(pending) {
    $("sheet-body").innerHTML = aiHtml(pending);
    sheet.scrollTop = sheet.scrollHeight;
    const q = $("ai-q");
    if (q) q.oninput = () => { aiDraft = q.value; };
  }
  async function openAi() {
    const st = cur();
    if (!st) return;
    openSheet(aiHtml());
    try { await loadAi(st, true, true); } catch (err) { notice(escapeHtml(err.message), "error"); }
    if (sheet.open && cur() === st) renderAi();
  }
  async function askAi(text) {
    const st = cur(), question = (text || "").trim();
    if (!st || !question || aiBusy) return;
    aiBusy = true; aiDraft = "";
    renderAi(question);
    try {
      const res = await post("/api/ai/ask", { question, context: aiContext(), lang: I18N.lang() }, st.access);
      const c = aiCache[st.id];
      c.log = (c.log || []).concat({ ts: res.ts, q: question, a: res.answer, mine: true });
      c.left = res.left; c.limit = res.limit;
    } catch (err) {
      aiDraft = question;
      if (err.status === 429 && aiCache[st.id]) aiCache[st.id].left = 0;
      setTimeout(() => notice(escapeHtml(t("ai.fail", { message: err.message })), "error"), 0);
    } finally {
      aiBusy = false;
      if (sheet.open) renderAi();
      updateAiButton();
    }
  }
  sheet.addEventListener("click", (e) => {
    if (e.target.closest("#ai-send")) askAi($("ai-q").value);
    const chip = e.target.closest("[data-ai-q]");
    if (chip) askAi(chip.dataset.aiQ);
    if (e.target.closest("[data-ai-setup]")) { sheet.close(); $("open-settings").click(); showPage("stick"); showSeg("ai"); }
  });
  sheet.addEventListener("keydown", (e) => {
    if (e.target.id === "ai-q" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); askAi(e.target.value); }
  });

  // Настройки AI: админ задаёт движок, ключ, лимит и длину ответа; гость видит, что включено.
  async function syncAi() {
    const st = cur(), admin = isAdmin(st);
    $("ai-admin").hidden = !admin; $("ai-guest").hidden = admin;
    $("ai-msg").textContent = "";
    let c = aiCache[st.id];
    try { c = await loadAi(st, false, true); } catch { /* покажем то, что есть */ }
    if (!c || cur() !== st) return;
    if (admin) {
      form.elements.aiEngine.value = c.engine || "deepseek-chat";
      form.elements.aiKey.value = "";
      form.elements.aiKey.placeholder = c.key ? t("ai.keySet", { hint: c.key }) : t("ai.keyPlaceholder");
      form.elements.aiLimit.value = c.limit;
      form.elements.aiLen.value = c.len || "short";
      $("ai-used").textContent = t("ai.usedToday", { n: c.used });
      $("ai-actions").hidden = !c.enabled;
      $("ai-test-state").textContent = ""; $("ai-test-state").className = "ok-chip";
    } else {
      $("ai-guest-text").textContent = c.enabled ? t("ai.guestOn", { limit: c.limit, left: c.left }) : t("ai.offGuest");
    }
  }
  async function aiAdmin(path, body, okKey) {
    const st = cur();
    $("ai-msg").textContent = "";
    try {
      const res = await post(path, body, st.access);
      if (res.ok === false) throw new Error(res.error || String(res.status));
      if (aiCache[st.id]) aiCache[st.id].at = 0;
      await syncAi();
      $("ai-msg").textContent = okKey ? t(okKey) : "";
      updateAiButton();
      return true;
    } catch (err) { $("ai-msg").textContent = t("ai.fail", { message: err.message }); return false; }
  }
  // «Сохранить» внизу окна на вкладке AI.
  async function aiSaveConfig() {
    const body = { engine: form.elements.aiEngine.value, limit: Math.round(Number(form.elements.aiLimit.value)) || 10, len: form.elements.aiLen.value };
    const key = form.elements.aiKey.value.trim();
    if (key) body.key = key;
    else if (!(aiCache[cur().id] || {}).key) { $("ai-msg").textContent = t("ai.needKey"); form.elements.aiKey.focus(); return; }
    await aiAdmin("/api/ai/config", body, "ai.saved");
  }
  $("ai-test").onclick = () => withBusy($("ai-test"), async () => {
    if (await aiAdmin("/api/ai/test", {}, null)) { $("ai-test-state").textContent = t("ai.keyWorks"); }
    else { $("ai-test-state").textContent = t("ai.keyBad"); $("ai-test-state").className = "ok-chip bad"; }
  });
  $("ai-off").onclick = () => { if (confirm(t("ai.offConfirm"))) withBusy($("ai-off"), () => aiAdmin("/api/ai/config", { off: true }, "ai.offDone")); };

  // ---------- Установка на телефон ----------
  // Android/Chrome: ловим beforeinstallprompt и показываем свою кнопку.
  // iOS: такого события нет — показываем инструкцию «Поделиться → На экран „Домой“».
  // Не показываем, если приложение уже запущено как установленное или недавно нажали «Не сейчас».
  const INSTALL_STORE = "ispindel.installLater";
  const installed = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let deferredInstall = null, installIOS = false;
  const syncInstallText = () => { $("install-later").textContent = t(installIOS ? "install.ok" : "install.later"); };
  function installSnoozed() {
    try { return Date.now() - Number(localStorage.getItem(INSTALL_STORE) || 0) < 14 * 86400e3; } catch { return false; }
  }
  function showInstall(ios) {
    if (installed() || installSnoozed()) return;
    installIOS = ios;
    $("install-android").hidden = ios;
    $("install-ios").hidden = !ios;
    $("install-go").hidden = ios;
    syncInstallText();
    $("install").hidden = false;
    document.body.classList.add("has-install");
  }
  addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstall = e;
    showInstall(false);
  });
  const hideInstall = () => { $("install").hidden = true; document.body.classList.remove("has-install"); };
  addEventListener("appinstalled", () => { hideInstall(); deferredInstall = null; });
  $("install-go").onclick = async () => {
    hideInstall();
    if (!deferredInstall) return;
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch { /* закрыли */ }
    deferredInstall = null;
  };
  $("install-later").onclick = () => {
    hideInstall();
    try { localStorage.setItem(INSTALL_STORE, String(Date.now())); } catch { /* приватный режим */ }
  };
  if (isIOS) setTimeout(() => showInstall(true), 2500);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch((e) => console.warn("Service worker not registered", e));
  }

  // Язык — маленькая кнопка: каждый клик переключает на следующий по кругу.
  const LANG_CYCLE = ["en", "uk", "ru", "es"];
  I18N.use(I18N.detect());
  // Язык переключается по кругу в настройках (строка «Язык»).
  function cycleLang() {
    const next = LANG_CYCLE[(LANG_CYCLE.indexOf(I18N.lang()) + 1) % LANG_CYCLE.length];
    I18N.use(next, true);
    applyStatic(); syncInstallText();
    if (dlg.open) { showPage(setPage); syncServer(); }
    // Axis ticks and tooltips are baked into the chart options, so rebuild them.
    Object.values(charts).forEach((c) => c.destroy());
    charts = {};
    refresh();
  }
  applyStatic();

  syncRanges();
  (async () => {
    // Нажали на уведомление: открываем приложение на его стике.
    const fromPush = new URLSearchParams(location.search).get("stick");
    if (fromPush) {
      history.replaceState(null, "", location.pathname + location.hash);
      if (cfg.sticks.some((x) => x.id === fromPush)) { cfg.current = fromPush; cfg.device = ""; save(); }
    }
    renderBell();
    await handleJoin();
    await migrateLegacy();
    refresh();
  })();
  setInterval(() => { if (!document.hidden) refresh(); }, 60e3);
})();
</script>
</body>
</html>
