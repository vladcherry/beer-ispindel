<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beer iSpindel</title>
<meta name="description" content="Gravity, temperature and battery from an iSpindel while the beer ferments.">
<meta name="theme-color" content="#eef1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131715" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beer iSpindel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="vendor/chart-4.4.1.umd.min.js"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #eef1ec;
  --surface: #f8faf6;
  --ink: #1e2522;
  --muted: #5e6a64;
  --rule: #cfd6cf;
  --amber: #c9861a;
  --amber-soft: rgba(201, 134, 26, .18);
  --amber-deep: #8a5a0f;
  --teal: #2f6f73;
  --alert: #b4412c;
  --ok: #3f7a4a;
  --glass: rgba(255, 255, 255, .55);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #131715;
    --surface: #1b201d;
    --ink: #e6ebe7;
    --muted: #94a199;
    --rule: #2e3631;
    --amber: #e3a43a;
    --amber-soft: rgba(227, 164, 58, .2);
    --amber-deep: #f0c070;
    --teal: #6bb3b6;
    --alert: #e0735c;
    --ok: #7fbf8a;
    --glass: rgba(255, 255, 255, .06);
  }
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
}
main { max-width: 980px; margin: 0 auto; padding: 20px 20px 48px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* Шапка */
.top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { font: 600 28px/1.1 var(--display); margin: 0; letter-spacing: .01em; min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top h1 select { max-width: 100%; }
.seen-row { display: flex; align-items: center; gap: 4px; min-height: 32px; }
.icon-btn.round {
  display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0; flex: none;
  border: 0; border-radius: 50%; background: transparent; color: var(--muted);
}
.icon-btn.round.small { width: 32px; height: 32px; }
.icon-btn.round:hover { background: var(--surface); color: var(--ink); }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .icon-btn.spin svg { animation: none; opacity: .5; } }
.top h1 select {
  font: 600 28px/1.1 var(--display); border: 0; background: transparent; padding: 0; cursor: pointer;
}
.top-actions select.icon-btn { padding: 6px 8px; }
.seen { color: var(--muted); font-size: 15px; }
.seen.stale { color: var(--alert); }
.top-actions { display: flex; gap: 8px; align-items: center; flex: none; }
.icon-btn {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; font-size: 15px;
}
.icon-btn:hover { border-color: var(--muted); }

/* Главный блок: ареометр + показания */
.hero { display: grid; grid-template-columns: 132px 1fr; gap: 28px; margin-top: 24px; align-items: stretch; }
.stem-wrap { position: relative; }
#stem { width: 100%; height: 100%; min-height: 360px; display: block; }
.reading .value {
  font: 500 clamp(76px, 15vw, 132px)/.9 var(--display); letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.reading .unit { font: 500 32px/1 var(--display); color: var(--muted); margin-left: 6px; }
.reading .sg { font: 500 22px/1.2 var(--display); color: var(--muted); margin-top: 6px; }
.state { margin-top: 18px; font-size: 17px; max-width: 46ch; }
.state b { font-weight: 600; }
.state.ok b { color: var(--ok); }
.state.idle b { color: var(--amber-deep); }

/* Показатели партии: каждая ячейка своей ширины, при нехватке места переносится на новую строку */
.batch { display: flex; flex-wrap: wrap; gap: 0 20px; margin-top: 26px; border-top: 1px solid var(--rule); }
.batch div { padding-top: 12px; }
.batch dt { white-space: nowrap; }
.batch dd { white-space: nowrap; }
.batch dt { color: var(--muted); font-size: 14px; }
.batch dd { margin: 0; font: 500 30px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.batch .hint { flex-basis: 100%; color: var(--muted); font-size: 14px; padding-top: 10px; }
.batch .hint button {
  display: block; margin-top: 10px; padding: 8px 14px; border: 1px solid var(--amber); border-radius: 8px;
  background: transparent; color: var(--amber-deep); font-size: 15px; font-weight: 600; cursor: pointer;
}
.batch .hint button:hover { background: var(--amber-soft); }

.device {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px 24px;
  margin-top: 28px; padding: 16px; background: var(--surface); border-radius: 10px;
}
.metric { display: grid; grid-template-columns: 28px 1fr; column-gap: 10px; align-items: start; }
.metric svg { width: 28px; height: 28px; color: var(--muted); margin-top: 2px; }
.metric dt { color: var(--muted); font-size: 13px; line-height: 1.2; }
.metric dd { margin: 0; font: 500 22px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.metric dd small { font: 400 14px var(--body); color: var(--muted); margin-left: 4px; }
.metric .note { grid-column: 2; font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.metric.battery { grid-column: 1 / -1; }
.metric .warn { color: var(--alert); }

/* Графики */
.charts { margin-top: 36px; }
.charts-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.charts-head h2 { font: 600 22px/1.2 var(--display); margin: 0; }
.ranges { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.ranges button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.ranges button + button { border-left: 1px solid var(--rule); }
.ranges button[aria-pressed="true"] { background: var(--amber); color: #fff; }
.ranges button[hidden] { display: none; }
.chart-box { position: relative; height: 240px; margin-top: 14px; }
.chart-label { font-size: 14px; color: var(--muted); margin-top: 18px; }
.chart-label .sw { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.smooth { font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; margin-left: 12px; }

.notice { margin-top: 24px; padding: 14px 16px; border-left: 3px solid var(--amber); background: var(--surface); border-radius: 0 8px 8px 0; }
.notice.error { border-left-color: var(--alert); }

/* Настройки */
dialog {
  border: 0; border-radius: 14px; padding: 0; width: min(520px, calc(100vw - 32px));
  background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
dialog::backdrop { background: rgba(10, 14, 12, .45); }
dialog form { padding: 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (max-width: 480px) { dialog form { padding: 18px 16px; } }
dialog h2 { font: 600 24px/1.1 var(--display); margin: 0; }
label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
label input { border: 1px solid var(--rule); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 15px; color: var(--ink); min-width: 0; width: 100%; }
label small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: end; }
.row label { flex: 1; min-width: 0; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
.field-row { display: flex; gap: 6px; flex-wrap: wrap; }
.field-row button { flex: none; }
.field-row input { flex: 1 1 160px; min-width: 0; width: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.field-error { color: var(--alert); font-size: 13px; }
.field-error:empty { display: none; }
.link { background: none; border: 0; padding: 0; color: var(--amber-deep); text-decoration: underline; cursor: pointer; font-size: 14px; }
.server { font-size: 14px; color: var(--muted); display: grid; gap: 6px; }
.server b { color: var(--ink); font-weight: 500; word-break: break-all; }
.guide { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; background: var(--bg); }
.guide summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.guide ol { margin: 10px 0 4px; padding-left: 20px; display: grid; gap: 8px; font-size: 14px; }
.guide dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; margin: 8px 0 0; align-items: center; }
.guide dt { color: var(--muted); font-size: 13px; }
.guide dd { margin: 0; display: flex; gap: 6px; align-items: center; min-width: 0; }
.guide code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 2px 6px; overflow-wrap: anywhere; }
.copy { font-size: 12px; padding: 2px 8px; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; cursor: pointer; flex: none; }
.guide .note { color: var(--muted); font-size: 13px; }
.lang { min-width: 44px; font-weight: 600; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.sticks h3 { font: 600 18px/1.2 var(--display); margin: 0 0 8px; }
.sticks ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.sticks li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 10px; background: var(--bg); }
.sticks li.current { border-color: var(--amber); box-shadow: inset 3px 0 0 var(--amber); }
.sticks .pick { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); }
.sticks .pick b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sticks .pick small { color: var(--muted); font-size: 12px; }
.sticks li .copy { font-size: 13px; padding: 4px 10px; }
.muted { color: var(--muted); font-size: 14px; margin: 0; }
.share-box { margin-top: 8px; display: grid; gap: 6px; }
.share-box code { flex: 1; min-width: 0; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 6px; overflow-wrap: anywhere; }
#stick-switch { font: 600 28px/1.1 var(--display); border: 0; background: transparent; padding: 0; cursor: pointer; max-width: 100%; }
#device-switch { margin-top: 4px; font-size: 15px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); padding: 2px 6px; }
.guide dd code { flex: 1 1 auto; min-width: 0; }
@media (max-width: 480px) {
  .guide { padding: 10px 12px; }
  .guide ol { padding-left: 18px; }
  .guide dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .guide dt { margin-top: 6px; }
}
.primary { background: var(--amber); color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
.secondary { background: transparent; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 14px; cursor: pointer; }

/* Предложение установить приложение */
.install {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  max-width: 520px; margin: 0 auto; display: flex; gap: 12px; align-items: flex-start;
  padding: 14px; border-radius: 14px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--rule); box-shadow: 0 12px 40px rgba(0, 0, 0, .22);
}
.install img { border-radius: 10px; flex: none; }
body.has-install main { padding-bottom: 220px; }
.install-body { flex: 1; min-width: 0; display: grid; gap: 6px; font-size: 14px; }
.install-body b { font: 600 18px/1.2 var(--display); }
.install-body p { margin: 0; color: var(--muted); }
.install-body ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.install-actions { display: flex; gap: 8px; margin-top: 4px; }
.ios-share { width: 18px; height: 18px; vertical-align: -3px; color: #0a84ff; }
@media (prefers-reduced-motion: no-preference) {
  .install:not([hidden]) { animation: install-in .35s cubic-bezier(.2, .7, .2, 1); }
  @keyframes install-in { from { transform: translateY(24px); opacity: 0; } }
}

@media (max-width: 640px) {
  main { padding: 16px 14px 40px; }
  .hero { grid-template-columns: 84px 1fr; gap: 16px; }
  #stem { min-height: 300px; }
  .batch dd { font-size: 24px; }
  .chart-box { height: 200px; }
}
@media (prefers-reduced-motion: no-preference) {
  #liquid, #surface { transition: transform .8s cubic-bezier(.2, .7, .2, 1); }
}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="title-row">
      <h1 id="title" data-i18n="app.name"></h1>
      <div class="top-actions">
        <button class="icon-btn lang" id="lang" type="button"></button>
        <button class="icon-btn round" id="open-settings" type="button" data-i18n-label="ui.settings" data-i18n-title="ui.settings"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </div>
    <div class="seen-row">
      <span class="seen" id="seen" data-i18n="status.loading"></span>
      <button class="icon-btn round small" id="refresh" type="button" data-i18n-label="ui.refresh" data-i18n-title="ui.refresh"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
    </div>
  </header>

  <div id="notice"></div>

  <section class="hero" id="hero" hidden>
    <div class="stem-wrap" aria-hidden="true">
      <svg id="stem" viewBox="0 0 120 400" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div>
      <div class="reading">
        <span class="value" id="g-value">–</span><span class="unit">°P</span>
        <div class="sg" id="g-sg"></div>
      </div>
      <p class="state" id="state"></p>
      <dl class="batch" id="batch"></dl>
    </div>
  </section>

  <dl class="device" id="device" hidden></dl>

  <section class="charts" id="charts" hidden>
    <div class="charts-head">
      <h2 data-i18n="charts.history"></h2>
      <div class="ranges" id="ranges" role="group" data-i18n-label="charts.period">
        <button type="button" data-range="6h" data-i18n="range.6h"></button>
        <button type="button" data-range="24h" data-i18n="range.24h"></button>
        <button type="button" data-range="3d" data-i18n="range.3d"></button>
        <button type="button" data-range="7d" data-i18n="range.7d"></button>
        <button type="button" data-range="batch" hidden data-i18n="range.batch"></button>
      </div>
    </div>
    <div class="chart-label"><span class="sw" style="background:var(--amber)"></span><span data-i18n="charts.gravity"></span>
      <label class="smooth"><input type="checkbox" id="smooth" checked><span data-i18n="charts.smooth"></span></label></div>
    <div class="chart-box"><canvas id="chart-g"></canvas></div>
    <div class="chart-label"><span class="sw" style="background:var(--teal)"></span><span data-i18n="charts.temperature"></span></div>
    <div class="chart-box"><canvas id="chart-t"></canvas></div>
  </section>
</main>

<aside class="install" id="install" hidden role="dialog" aria-labelledby="install-title">
  <img src="icons/icon-192.png" alt="" width="44" height="44">
  <div class="install-body">
    <b id="install-title" data-i18n="install.title"></b>
    <p id="install-android" data-i18n="install.text"></p>
    <ol id="install-ios" hidden>
      <li><span data-i18n="install.ios1"></span> <svg class="ios-share" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 10H6.5A1.5 1.5 0 0 0 5 11.5v8A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-8a1.5 1.5 0 0 0-1.5-1.5H16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></li>
      <li data-i18n="install.ios2"></li>
      <li data-i18n="install.ios3"></li>
    </ol>
    <div class="install-actions">
      <button class="primary" type="button" id="install-go" data-i18n="install.button"></button>
      <button class="secondary" type="button" id="install-later"></button>
    </div>
  </div>
</aside>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2 data-i18n="settings.title"></h2>

    <section class="sticks">
      <h3 data-i18n="sticks.title"></h3>
      <ul id="stick-list"></ul>
      <p class="muted" id="stick-empty" data-i18n="sticks.empty"></p>
      <div class="share-box" id="share-box" hidden>
        <small data-i18n="sticks.shareHint"></small>
        <div class="field-row"><code id="share-link"></code><button class="copy" type="button" data-copy="share-link" data-i18n="ui.copy"></button></div>
      </div>
      <small class="field-error" id="stick-error"></small>
    </section>

    <label><span data-i18n="sticks.add"></span>
      <span class="field-row">
        <input name="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="64" data-i18n-placeholder="settings.token">
        <button class="secondary" type="button" id="token-show" data-i18n="settings.show"></button>
        <button class="secondary" type="button" id="token-gen" data-i18n="settings.generate"></button>
        <button class="primary" type="button" id="token-add" data-i18n="sticks.addBtn"></button>
      </span>
      <small data-i18n="settings.tokenHint"></small>
      <small class="field-error" id="token-error"></small>
    </label>

    <details class="guide" id="guide">
      <summary data-i18n="guide.title"></summary>
      <ol>
        <li data-i18n="guide.step1"></li>
        <li data-i18n="guide.step2"></li>
        <li><span data-i18n="guide.step3"></span>
          <dl>
            <dt data-i18n="guide.serviceType"></dt><dd><code>HTTPS Post</code></dd>
            <dt data-i18n="guide.serverUrl"></dt><dd><code id="guide-url"></code><button class="copy" type="button" data-copy="guide-url" data-i18n="ui.copy"></button></dd>
            <dt data-i18n="guide.token"></dt><dd><code id="guide-token"></code><button class="copy" type="button" data-copy="guide-token" data-i18n="ui.copy"></button></dd>
            <dt data-i18n="guide.interval"></dt><dd><code data-i18n="guide.intervalValue"></code></dd>
          </dl>
        </li>
        <li data-i18n="guide.step4"></li>
        <li data-i18n="guide.step5"></li>
      </ol>
      <p class="note" id="guide-fallback"></p>
    </details>
    <div class="row">
      <label><span data-i18n="settings.batchStart"></span>
        <input name="batchStart" type="datetime-local">
        <small data-i18n="settings.batchHint"></small>
      </label>
      <button class="secondary" type="button" id="batch-now" data-i18n="settings.now"></button>
    </div>
    <label><span data-i18n="settings.formula"></span>
      <input name="formula" type="text" placeholder="-0.0322987*tilt^2+2.643882645*tilt-38.64180015" autocomplete="off" spellcheck="false">
      <small data-i18n="settings.formulaHint"></small>
      <small data-i18n="settings.formulaShared"></small>
      <small class="field-error" id="formula-error"></small>
    </label>
    <div class="server">
      <div><span data-i18n="settings.server"></span>: <b id="server-name"></b> <span id="server-default" data-i18n="settings.serverDefault"></span></div>
      <div><button class="link" type="button" id="server-edit" data-i18n="settings.serverCustom"></button></div>
      <label id="server-field" hidden><span data-i18n="settings.serverAddress"></span>
        <span class="field-row">
          <input name="api" type="url" data-i18n-placeholder="settings.apiPlaceholder" autocomplete="off" spellcheck="false">
          <button class="secondary" type="button" id="server-reset" data-i18n="settings.serverReset"></button>
        </span>
        <small class="field-error" id="api-error"></small>
      </label>
    </div>
    <div class="dialog-actions">
      <button class="secondary" value="cancel" formnovalidate data-i18n="settings.cancel"></button>
      <button class="primary" value="save" data-i18n="settings.save"></button>
    </div>
  </form>
</dialog>

<script>
(() => {
  "use strict";

  // ---------- Язык ----------
  const t = (key, params) => I18N.t(key, params);

  function applyStatic() {
    document.documentElement.lang = I18N.lang();
    document.title = t("app.name");
    const desc = document.querySelector('meta[name="description"]');
    if (desc) desc.content = t("app.description");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-title]").forEach((el) => { el.title = t(el.dataset.i18nTitle); });
    document.querySelectorAll("[data-i18n-label]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nLabel)); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  }

  // ---------- Настройки ----------
  const STORE = "ispindel.cfg";
  const RANGES = { "6h": 6 * 3600e3, "24h": 24 * 3600e3, "3d": 3 * 86400e3, "7d": 7 * 86400e3 };
  // Адрес воркера по умолчанию — из config.js; cfg.api хранит только свой адрес, если он задан.
  const DEFAULT_API = ((window.ISPINDEL_DEFAULTS || {}).api || "").replace(/\/+$/, "");
  // sticks: [{ id, access, token, name, batchStart, formula }] — token есть только у того, кто стик зарегистрировал.
  const defaults = { api: "", sticks: [], current: "", device: "", range: "24h", smooth: true };
  let cfg = load();
  const apiBase = () => (cfg.api || DEFAULT_API).replace(/\/+$/, "");
  const cur = () => cfg.sticks.find((x) => x.id === cfg.current) || cfg.sticks[0] || null;
  const stickName = (x) => x.name || `${t("sticks.unnamed")} · ${String(x.id).slice(0, 4)}`;

  function load() {
    let c;
    try { c = Object.assign({}, defaults, JSON.parse(localStorage.getItem(STORE) || "{}")); }
    catch { c = Object.assign({}, defaults); }
    // Старые версии: адрес по умолчанию, ключ чтения, один токен и общие партия/формула.
    if (c.api && c.api.replace(/\/+$/, "") === DEFAULT_API) c.api = "";
    if (!Array.isArray(c.sticks)) c.sticks = [];
    if (c.token && !c.sticks.length) c.legacy = { token: c.token, batchStart: c.batchStart ?? null, formula: c.formula || "" };
    delete c.key; delete c.token; delete c.batchStart; delete c.formula;
    return c;
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch { /* приватный режим */ }
  }

  // ---------- Пиво: пересчёты ----------
  const sgFromPlato = (p) => 1 + p / (258.6 - (p / 258.2) * 227.1);
  const abv = (ogP, fgP) => (sgFromPlato(ogP) - sgFromPlato(fgP)) * 131.25;
  const BATTERY = [[4.2, 100], [4.1, 90], [4.0, 80], [3.9, 65], [3.8, 50], [3.7, 35], [3.6, 20], [3.5, 8], [3.4, 0]];
  function batteryPct(v) {
    if (v == null) return null;
    if (v >= BATTERY[0][0]) return 100;
    for (let i = 1; i < BATTERY.length; i++) {
      const [v1, p1] = BATTERY[i - 1], [v2, p2] = BATTERY[i];
      if (v >= v2) return Math.round(p2 + (p1 - p2) * (v - v2) / (v1 - v2));
    }
    return 0;
  }
  function rssiText(r) {
    if (r == null) return "–";
    if (r >= -60) return t("wifi.excellent");
    if (r >= -70) return t("wifi.good");
    if (r >= -80) return t("wifi.weak");
    return t("wifi.veryWeak");
  }

  // Формула: только числа, tilt, + - * / ^ ( )
  function compileFormula(src) {
    if (!src || !src.trim()) return null;
    const s = src.replace(/tilt/gi, "t").replace(/\s+/g, "");
    if (!/^[0-9t.+\-*/^()eE]+$/.test(s)) throw new Error(t("err.formulaChars"));
    const fn = new Function("t", '"use strict"; return (' + s.replace(/\^/g, "**") + ");");
    const probe = fn(25);
    if (typeof probe !== "number" || !Number.isFinite(probe)) throw new Error(t("err.formulaProbe"));
    return fn;
  }

  // Плотность вне этого диапазона — датчик лежит или стоит, а не плавает
  const plausible = (g) => g != null && Number.isFinite(g) && g > -2 && g < 35;

  function median(arr) {
    const a = arr.filter((x) => x != null).sort((x, y) => x - y);
    if (!a.length) return null;
    const m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }
  function smoothSeries(points, w = 5) {
    return points.map((p, i) => {
      const win = points.slice(Math.max(0, i - (w >> 1)), i + (w >> 1) + 1).map((q) => q.y);
      return { x: p.x, y: median(win) };
    });
  }

  // ---------- Формат ----------
  const fmt = (n, d = 1) => n == null ? "–" : n.toLocaleString(I18N.locale(), { minimumFractionDigits: d, maximumFractionDigits: d });
  // Строка с числом в правильной форме: ключи base.one / .few / .many / .other
  const pluralRules = {};
  function tn(base, n, decimals = 0) {
    const loc = I18N.locale();
    const rules = pluralRules[loc] || (pluralRules[loc] = new Intl.PluralRules(loc));
    let key = `${base}.${rules.select(n)}`;
    if (t(key) === key) key = `${base}.other`;
    return t(key).split("{n}").join(fmt(n, decimals));
  }
  function ago(ts) {
    const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (s < 60) return tn("ago.sec", s);
    if (s < 3600) return tn("ago.min", Math.floor(s / 60));
    if (s < 86400) return tn("ago.hour", Math.floor(s / 3600));
    return tn("ago.day", Math.floor(s / 86400));
  }
  const dayTime = (ts) => new Date(ts).toLocaleString(I18N.locale(), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

  // ---------- API ----------
  // Время, когда сохранены данные, если ответ пришёл из кэша service worker'а (нет сети).
  let cachedAt = null;

  async function api(path, params = {}, access = cur() && cur().access) {
    const url = new URL(apiBase() + path);
    Object.entries(params).forEach(([k, v]) => v != null && v !== "" && url.searchParams.set(k, v));
    const res = await fetch(url, { headers: { "X-Access": access } });
    if (res.status === 401) throw new Error(t("err.unknownToken"));
    if (!res.ok) throw new Error(t("err.workerStatus", { status: res.status }));
    const fromCache = res.headers.get("X-From-Cache");
    if (fromCache) cachedAt = Math.min(cachedAt ?? Infinity, Number(fromCache) || Date.now());
    return res.json();
  }

  // ---------- Отрисовка ----------
  const $ = (id) => document.getElementById(id);
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  let charts = {};

  function notice(html, kind = "") {
    $("notice").innerHTML = html ? `<div class="notice ${kind}">${html}</div>` : "";
  }

  function drawStem(current, og) {
    // Шкала как у настоящего ареометра: меньшие значения сверху.
    const top = 30, bottom = 330, maxP = Math.max(20, Math.ceil(((og ?? current ?? 0) + 2) / 2) * 2);
    const y = (p) => top + (Math.min(Math.max(p, 0), maxP) / maxP) * (bottom - top);
    const amber = css("--amber"), ink = css("--ink"), muted = css("--muted"), glass = css("--glass"), rule = css("--rule");
    let ticks = "";
    for (let p = 0; p <= maxP; p++) {
      const yy = y(p), major = p % 2 === 0;
      ticks += `<line x1="60" x2="${major ? 74 : 68}" y1="${yy}" y2="${yy}" stroke="${ink}" stroke-width="${major ? 1.2 : .7}"/>`;
      if (major) ticks += `<text x="78" y="${yy + 4}" font-family="Barlow Condensed, sans-serif" font-size="12" fill="${muted}">${p}</text>`;
    }
    const level = current != null ? y(current) : bottom + 40;
    const ogMark = og != null
      ? `<g><line x1="44" x2="58" y1="${y(og)}" y2="${y(og)}" stroke="${muted}" stroke-width="1.5" stroke-dasharray="2 2"/>
         <text x="40" y="${y(og) + 4}" text-anchor="end" font-family="Barlow Condensed, sans-serif" font-size="12" fill="${muted}">${escapeHtml(t("stem.og"))}</text></g>`
      : "";
    $("stem").innerHTML = `
      <defs>
        <clipPath id="below"><rect x="0" y="${level}" width="120" height="${400 - level}"/></clipPath>
      </defs>
      <rect id="liquid" x="0" y="${level}" width="120" height="${400 - level}" fill="${css("--amber-soft")}"/>
      <rect x="46" y="10" width="28" height="340" rx="14" fill="${glass}" stroke="${rule}"/>
      <ellipse cx="60" cy="372" rx="26" ry="24" fill="${glass}" stroke="${rule}"/>
      <g clip-path="url(#below)">
        <rect x="46" y="10" width="28" height="340" rx="14" fill="${amber}" opacity=".18"/>
        <ellipse cx="60" cy="372" rx="26" ry="24" fill="${amber}" opacity=".18"/>
      </g>
      ${ticks}
      ${ogMark}
      <line id="surface" x1="0" x2="120" y1="${level}" y2="${level}" stroke="${amber}" stroke-width="2.5"/>`;
  }

  function renderChart(id, points, raw, color, unit, decimals, minSpan = 0) {
    const grid = css("--rule"), muted = css("--muted");
    const ds = [];
    if (raw) ds.push({ data: raw, borderColor: color, backgroundColor: color, borderWidth: 0, pointRadius: 1.5, pointHoverRadius: 3, showLine: false, label: t("charts.raw") });
    ds.push({ data: points, borderColor: color, borderWidth: 2.2, pointRadius: 0, pointHoverRadius: 4, tension: .25, spanGaps: false, label: unit });
    const xMin = points[0]?.x ?? raw?.[0]?.x, xMax = points.at(-1)?.x ?? raw?.at(-1)?.x;
    const opts = {
      responsive: true, maintainAspectRatio: false, animation: false, parsing: false, normalized: true,
      interaction: { mode: "nearest", axis: "x", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          filter: (item) => item.datasetIndex === ds.length - 1,
          callbacks: {
            title: (items) => dayTime(items[0].parsed.x),
            label: (item) => `${fmt(item.parsed.y, decimals)} ${unit}`,
          },
        },
      },
      scales: {
        x: {
          type: "linear", min: xMin, max: xMax,
          grid: { color: grid }, border: { display: false },
          ticks: {
            color: muted, maxTicksLimit: 6, maxRotation: 0,
            callback: (v) => {
              const d = new Date(v), span = (xMax - xMin) || 1;
              return span > 36 * 3600e3
                ? d.toLocaleDateString(I18N.locale(), { day: "numeric", month: "short" })
                : d.toLocaleTimeString(I18N.locale(), { hour: "2-digit", minute: "2-digit" });
            },
          },
        },
        y: (() => {
          // Минимальный размах оси, чтобы шум в сотых не выглядел как скачки
          const ys = points.concat(raw || []).map((p) => p.y).filter((v) => v != null);
          const lo = Math.min(...ys), hi = Math.max(...ys), mid = (lo + hi) / 2;
          const half = Math.max((hi - lo) / 2, minSpan / 2);
          return {
            min: ys.length ? mid - half : undefined, max: ys.length ? mid + half : undefined,
            grid: { color: grid }, border: { display: false },
            ticks: { color: muted, callback: (v) => fmt(v, decimals) },
          };
        })(),
      },
    };
    if (charts[id]) { charts[id].data.datasets = ds; charts[id].options = opts; charts[id].update(); return; }
    charts[id] = new Chart($(id), { type: "line", data: { datasets: ds }, options: opts });
  }

  // ---------- Основной цикл ----------
  let devices = [];
  let busy = false;

  let rangePicked = false;

  // Партия общая для всех, у кого есть доступ к стику: перезапуск идущей партии — только после подтверждения.
  async function setBatch(start) {
    const st = cur();
    if (!st) return false;
    if (st.batchStart && st.batchStart < Date.now() && start !== st.batchStart &&
        !confirm(t("batch.confirmReset", { date: dayTime(st.batchStart) }))) return false;
    try {
      const res = await fetch(apiBase() + "/api/batch", {
        method: "POST", headers: { "Content-Type": "application/json", "X-Access": st.access },
        body: JSON.stringify({ start }),
      });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || String(res.status));
    } catch (e) {
      notice(escapeHtml(t("err.batch", { message: e.message })), "error");
      return false;
    }
    st.batchStart = start;
    if (start) { cfg.range = "batch"; rangePicked = false; }
    save(); syncRanges(); refresh();
    return true;
  }

  async function postFormula(st, formula) {
    const res = await fetch(apiBase() + "/api/formula", {
      method: "POST", headers: { "Content-Type": "application/json", "X-Access": st.access },
      body: JSON.stringify({ formula }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || String(res.status));
  }

  async function refresh() {
    if (busy) return;
    const st = cur();
    if (!apiBase() || !st) {
      devices = []; renderTitle();
      ["hero", "device", "charts"].forEach((id) => $(id).hidden = true);
      seenInfo = null; $("seen").textContent = t("status.notConnected");
      notice(t(apiBase() ? "notice.setToken" : "notice.setApi"));
      return;
    }
    busy = true;
    $("refresh").classList.add("spin");
    cachedAt = null;
    try {
      const msgs = [];

      const data = await api("/api/devices");
      devices = data.devices || [];
      // Начало партии хранится на сервере и общее для всех, у кого есть доступ к стику.
      if ("batch_start" in data && st.batchStart !== data.batch_start) { st.batchStart = data.batch_start; save(); }
      // Полином тоже общий. При первой встрече с сервером, где полинома ещё нет, отдаём ему свой локальный.
      if ("formula" in data) {
        const remote = data.formula || "";
        if (!st.formulaSynced && !remote && st.formula) {
          await postFormula(st, st.formula).catch(() => {});
        } else if (st.formula !== remote) {
          st.formula = remote;
        }
        st.formulaSynced = true; save();
      }
      let formula = null;
      try { formula = compileFormula(st.formula); }
      catch (e) { msgs.push(e.message + t("err.formulaFallback")); }
      if (devices.length && st.name !== devices[0].device) { st.name = devices[0].device; save(); }
      renderTitle();
      if (!devices.length) {
        ["hero", "device", "charts"].forEach((id) => $(id).hidden = true);
        seenInfo = null; $("seen").textContent = t("status.noData");
        notice(t("notice.noReadings"));
        return;
      }
      if (!devices.some((d) => d.device === cfg.device)) { cfg.device = devices[0].device; renderTitle(); }

      const now = Date.now();
      const hasBatch = !!st.batchStart && st.batchStart < now;
      $("ranges").querySelector('[data-range="batch"]').hidden = !hasBatch;
      if (cfg.range === "batch" && !hasBatch) { cfg.range = "24h"; syncRanges(); }
      // Пока партия идёт, по умолчанию показываем её целиком.
      if (hasBatch && !rangePicked && cfg.range !== "batch") { cfg.range = "batch"; syncRanges(); }
      const rangeFrom = cfg.range === "batch" ? st.batchStart : now - RANGES[cfg.range];
      // Для начальной плотности и динамики за сутки берём данные с начала партии или хотя бы за 26 ч
      const from = Math.min(rangeFrom, hasBatch ? st.batchStart : rangeFrom, now - 26 * 3600e3);
      const { readings } = await api("/api/readings", { device: cfg.device, from, to: now });

      const rows = readings.map((r) => ({
        ...r,
        g: formula && r.angle != null ? formula(r.angle) : r.gravity,
      }));
      const valid = rows.filter((r) => plausible(r.g));
      const last = devices.find((d) => d.device === cfg.device);

      renderHero(rows, valid, last, hasBatch);
      let batt = null;
      try { batt = (await api("/api/battery", { device: cfg.device, days: 14 })).hours; }
      catch { /* воркер без /api/battery — прогноза не будет */ }
      renderDevice(last, batt);
      renderCharts(rows.filter((r) => r.ts >= rangeFrom), last);
      if (!valid.some((r) => r.ts >= rangeFrom)) {
        msgs.push(t("notice.implausible"));
      }
      if (cachedAt != null) {
        msgs.unshift(t("notice.offline", { ago: ago(cachedAt) }));
      }
      if (joined) { msgs.unshift(t("sticks.joined", { name: stickName(st) })); joined = false; }
      notice(msgs.map(escapeHtml).join("<br>"), msgs.length && st.formula && !formula ? "error" : "");
    } catch (e) {
      notice(escapeHtml(t("err.fetch", { message: e.message })), "error");
      seenInfo = null; $("seen").textContent = t("status.noConnection");
    } finally {
      busy = false;
      $("refresh").classList.remove("spin");
    }
  }

  // Заголовок: переключатель стиков (если их несколько) и устройств внутри стика.
  function renderTitle() {
    const title = $("title"), st = cur();
    let html = "";
    if (cfg.sticks.length > 1) {
      html = `<select id="stick-switch" aria-label="${escapeHtml(t("ui.device"))}">${cfg.sticks.map((x) =>
        `<option value="${escapeHtml(x.id)}" ${x === st ? "selected" : ""}>${escapeHtml(stickName(x))}</option>`).join("")}</select>`;
    } else {
      html = escapeHtml(st ? stickName(st) : t("app.name"));
    }
    if (devices.length > 1) {
      html += `<br><select id="device-switch" aria-label="${escapeHtml(t("ui.device"))}">${devices.map((d) =>
        `<option ${d.device === cfg.device ? "selected" : ""}>${escapeHtml(d.device)}</option>`).join("")}</select>`;
    }
    title.innerHTML = html;
    if ($("stick-switch")) $("stick-switch").onchange = (e) => switchStick(e.target.value);
    if ($("device-switch")) $("device-switch").onchange = (e) => { cfg.device = e.target.value; save(); refresh(); };
  }

  function switchStick(id) {
    cfg.current = id; cfg.device = ""; devices = [];
    if (cfg.range === "batch") cfg.range = "24h";
    rangePicked = false;
    save(); syncRanges();
    Object.values(charts).forEach((c) => c.destroy()); charts = {};
    refresh();
  }

  function renderHero(rows, valid, last, hasBatch) {
    $("hero").hidden = false;
    const recent = valid.slice(-5).map((r) => r.g);
    const current = median(recent);

    let og = null;
    if (hasBatch) {
      const first = valid.filter((r) => r.ts >= cur().batchStart).slice(0, 6).map((r) => r.g);
      og = median(first);
    }

    $("g-value").textContent = current == null ? "–" : fmt(current, 1);
    $("g-sg").textContent = current == null ? t("hero.noGravity") : `SG ${sgFromPlato(current).toFixed(3)}`;

    // Динамика за сутки
    const dayAgo = Date.now() - 24 * 3600e3;
    const around = valid.filter((r) => Math.abs(r.ts - dayAgo) < 1.5 * 3600e3).map((r) => r.g);
    const then = median(around);
    const state = $("state");
    state.className = "state";
    if (current == null) {
      state.innerHTML = escapeHtml(t("state.notFloating"));
    } else if (then == null) {
      state.innerHTML = escapeHtml(t("state.tooSoon"));
    } else {
      const delta = current - then;
      if (delta <= -0.3) {
        state.classList.add("ok");
        state.innerHTML = t("state.fermenting", { delta: fmt(-delta, 1) });
      } else {
        state.classList.add("idle");
        state.innerHTML = t("state.stalled", { delta: fmt(delta, 1) });
      }
    }

    const batch = $("batch");
    if (og != null && current != null) {
      const att = og > 0 ? ((og - current) / og) * 100 : null;
      const days = (Date.now() - cur().batchStart) / 86400e3;
      batch.innerHTML = `
        <div><dt>${escapeHtml(t("batch.og"))}</dt><dd>${fmt(og, 1)} °P</dd></div>
        <div><dt>${escapeHtml(t("batch.attenuation"))}</dt><dd>${att == null ? "–" : fmt(Math.max(att, 0), 0) + "%"}</dd></div>
        <div><dt>${escapeHtml(t("batch.abv"))}</dt><dd>${fmt(Math.max(abv(og, current), 0), 1)}%</dd></div>
        <div class="hint">${escapeHtml(t("batch.running", { days: fmt(days, 1), date: dayTime(cur().batchStart) }))}
          <button type="button" id="new-batch">${escapeHtml(t("batch.newBatch"))}</button></div>`;
      $("new-batch").onclick = () => setBatch(Date.now());
    } else if (hasBatch) {
      batch.innerHTML = `<div class="hint">${escapeHtml(t("batch.waiting", { date: dayTime(cur().batchStart) }))}
        <button type="button" id="new-batch">${escapeHtml(t("batch.newBatch"))}</button></div>`;
      $("new-batch").onclick = () => setBatch(Date.now());
    } else {
      batch.innerHTML = `<div class="hint">${escapeHtml(t("batch.none"))} <button type="button" id="start-batch">${escapeHtml(t("batch.startNow"))}</button></div>`;
      $("start-batch").onclick = () => setBatch(Date.now());
    }
    drawStem(current, og);
  }

  // ---------- Иконки показателей ----------
  const svgIcon = (inner, extra = "") => `<svg viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${inner}</svg>`;
  const icons = {
    temp: () => svgIcon(`<path d="M16 15.5V6a2.5 2.5 0 0 0-5 0v9.5a5 5 0 1 0 5 0z"/><circle cx="13.5" cy="19.5" r="2" fill="currentColor"/><path d="M13.5 17.5V10"/><path d="M19 7h3M19 11h3M19 15h2"/>`),
    battery: (pct) => {
      const color = pct == null ? css("--muted") : pct > 50 ? css("--ok") : pct > 20 ? css("--amber") : css("--alert");
      const w = pct == null ? 0 : Math.max(1.5, 15 * pct / 100);
      return svgIcon(`<rect x="3" y="9" width="19" height="10" rx="2.5"/><path d="M24.5 12.5v3" stroke-width="2.4"/>` +
        `<rect x="5" y="11" width="${w}" height="6" rx="1" fill="${color}" stroke="none"/>`, `style="color:${color}"`);
    },
    // Колба повёрнута на реальный наклон (0° — лежит, 90° — стоит)
    tilt: (angle) => {
      const a = angle == null ? 45 : Math.max(0, Math.min(90, angle));
      return svgIcon(`<path d="M3 21h22" opacity=".5"/><g transform="rotate(${-a} 14 14)"><rect x="5" y="11.5" width="18" height="5" rx="2.5"/></g>`);
    },
    wifi: (rssi) => {
      const level = rssi == null ? 0 : rssi >= -60 ? 3 : rssi >= -70 ? 2 : rssi >= -80 ? 1 : 0;
      const arc = (r, i) => `<path d="M${14 - r} ${21 - r * .55}a${r} ${r} 0 0 1 ${2 * r} 0" opacity="${i < level ? 1 : .25}"/>`;
      return svgIcon(`${arc(4, 0)}${arc(8, 1)}${arc(12, 2)}<circle cx="14" cy="21.5" r="1.4" fill="currentColor" stroke="none"/>`);
    },
    clock: () => svgIcon(`<circle cx="14" cy="14" r="10"/><path d="M14 8v6l4 2.5"/>`),
  };

  // ---------- Батарея: расход и прогноз ----------
  // hours: [{hour, v}] — среднее напряжение по часам из /api/battery
  function batteryForecast(hours) {
    if (!hours || hours.length < 2) return { status: "nodata" };
    // Текущий разряд начинается после последней зарядки (подъём напряжения > 0.08 В)
    let start = 0, minSince = hours[0].v;
    for (let i = 1; i < hours.length; i++) {
      if (hours[i].v > minSince + 0.08) { start = i; minSince = hours[i].v; }
      else minSince = Math.min(minSince, hours[i].v);
    }
    const pts = hours.slice(start).map((h) => ({ x: h.hour / 86400e3, y: batteryPct(h.v) }));
    const spanDays = pts.length ? pts.at(-1).x - pts[0].x : 0;
    if (pts.length < 6 || spanDays < 0.5) return { status: "short" };
    // Линейная регрессия: процент заряда от времени в сутках
    const n = pts.length, mx = pts.reduce((a, p) => a + p.x, 0) / n, my = pts.reduce((a, p) => a + p.y, 0) / n;
    let num = 0, den = 0;
    pts.forEach((p) => { num += (p.x - mx) * (p.y - my); den += (p.x - mx) ** 2; });
    const rate = den ? -num / den : 0;
    if (rate < 0.05) return { status: "flat", spanDays };
    return { status: "ok", rate, spanDays };
  }

  function batteryNote(pct, fc) {
    const span = (d) => fmt(d, d >= 2 ? 0 : 1);
    if (fc.status === "ok" && pct != null) {
      const days = pct / fc.rate;
      const d = days >= 2 ? Math.round(days) : Math.round(days * 10) / 10;
      return escapeHtml(t("battery.forecast", { days: tn("unit.days", d, days >= 2 ? 0 : 1) })) + "<br>" +
        escapeHtml(t("battery.rate", { rate: fmt(fc.rate, 1), span: span(fc.spanDays) }));
    }
    if (fc.status === "flat") return escapeHtml(t("battery.flat", { span: span(fc.spanDays) }));
    return escapeHtml(t(fc.status === "short" ? "battery.short" : "battery.nodata"));
  }

  function intervalText(sec) {
    if (!sec) return "–";
    if (sec < 120) return `${sec} ${t("unit.sec")}`;
    return `${Math.round(sec / 60)} ${t("unit.min")}`;
  }

  function renderDevice(last, batt) {
    const el = $("device");
    el.hidden = false;
    const pct = batteryPct(last.battery);
    const unit = last.temp_units === "F" ? "°F" : last.temp_units === "K" ? "K" : "°C";
    el.innerHTML = `
      <div class="metric battery">${icons.battery(pct)}
        <div><dt>${escapeHtml(t("device.battery"))}</dt><dd class="${pct != null && pct <= 20 ? "warn" : ""}">${pct == null ? "–" : pct + "%"}<small>${fmt(last.battery, 2)} ${escapeHtml(t("unit.volt"))}</small></dd></div>
        <div class="note">${batteryNote(pct, batteryForecast(batt))}</div>
      </div>
      <div class="metric">${icons.temp()}<div><dt>${escapeHtml(t("device.temperature"))}</dt><dd>${fmt(last.temperature, 1)}<small>${unit}</small></dd></div></div>
      <div class="metric">${icons.tilt(last.angle)}<div><dt>${escapeHtml(t("device.tilt"))}</dt><dd>${fmt(last.angle, 1)}°</dd></div></div>
      <div class="metric">${icons.wifi(last.rssi)}<div><dt>${escapeHtml(t("device.wifi"))}</dt><dd>${escapeHtml(rssiText(last.rssi))}<small>${last.rssi ?? "–"} dBm</small></dd></div></div>
      <div class="metric">${icons.clock()}<div><dt>${escapeHtml(t("device.interval"))}</dt><dd>${escapeHtml(intervalText(last.interval_s))}</dd></div></div>`;

    seenInfo = { ts: last.ts, expected: (last.interval_s || 900) * 1000 };
    updateSeen();
  }

  // «Данные получены N секунд назад» — обновляется каждую секунду без запросов
  let seenInfo = null;
  function updateSeen() {
    if (!seenInfo) return;
    const stale = Date.now() - seenInfo.ts > seenInfo.expected * 3 + 120e3;
    const el = $("seen");
    el.textContent = t("status.received", { ago: ago(seenInfo.ts) }) + (stale ? t("status.stale") : "");
    el.classList.toggle("stale", stale);
  }
  setInterval(updateSeen, 1000);

  function renderCharts(rows, last) {
    $("charts").hidden = false;
    const gRaw = rows.filter((r) => plausible(r.g)).map((r) => ({ x: r.ts, y: r.g }));
    const tPts = rows.filter((r) => r.temperature != null).map((r) => ({ x: r.ts, y: r.temperature }));
    const unit = last.temp_units === "F" ? "°F" : "°C";
    const g = cfg.smooth ? smoothSeries(gRaw) : gRaw;
    renderChart("chart-g", g, cfg.smooth ? gRaw : null, css("--amber"), "°P", 1, 2);
    renderChart("chart-t", tPts, null, css("--teal"), unit, 1, 1);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------- Управление ----------
  function syncRanges() {
    $("ranges").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.range === cfg.range)));
  }
  $("ranges").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-range]");
    if (!b) return;
    rangePicked = true;
    cfg.range = b.dataset.range; save(); syncRanges(); refresh();
  });
  $("smooth").checked = cfg.smooth;
  $("smooth").onchange = (e) => { cfg.smooth = e.target.checked; save(); refresh(); };
  $("refresh").onclick = refresh;

  const dlg = $("settings"), form = $("settings-form");
  const toLocalInput = (ms) => {
    if (!ms) return "";
    const d = new Date(ms);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  };

  // Токен стика: те же правила, что и на воркере (iSpindel хранит его в JSON-конфиге).
  const TOKEN_MIN = 8, TOKEN_MAX = 64;
  function tokenProblem(tok) {
    if (tok.length < TOKEN_MIN) return t("err.tokenShort", { n: TOKEN_MIN });
    if (tok.length > TOKEN_MAX) return t("err.tokenLong", { n: TOKEN_MAX });
    if (!/^[\x21-\x7e]+$/.test(tok) || /["\\]/.test(tok)) return t("err.tokenChars");
    return null;
  }
  function generateToken() {
    const abc = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
    const bytes = crypto.getRandomValues(new Uint8Array(20));
    return Array.from(bytes, (b) => abc[b % abc.length]).join("");
  }
  async function post(path, body, access) {
    const headers = { "Content-Type": "application/json" };
    if (access) headers["X-Access"] = access;
    const res = await fetch(apiBase() + path, { method: "POST", headers, body: JSON.stringify(body || {}) });
    let data = {};
    try { data = await res.json(); } catch { /* не JSON */ }
    if (!res.ok) { const e = new Error(data.error || String(res.status)); e.code = data.code; e.status = res.status; throw e; }
    return data;
  }

  // Регистрация токена: сервер заводит стик и выдаёт ключ доступа. Токен, который уже занят, не отдаётся.
  async function addStick(tok, extra = {}) {
    const { stick, access } = await post("/api/register", { token: tok });
    const existing = cfg.sticks.find((x) => x.id === stick);
    const entry = Object.assign(existing || { id: stick, name: "", batchStart: null, formula: "" }, extra, { access, token: tok });
    if (!existing) cfg.sticks.push(entry);
    cfg.current = stick; cfg.device = "";
    save();
    return entry;
  }

  // Ссылка «Поделиться»: #join=<ключ доступа>. Открыл — стик добавился.
  let joined = false;
  async function handleJoin() {
    const m = /[#&]join=([A-Za-z0-9_-]{16,})/.exec(location.hash);
    if (!m) return;
    history.replaceState(null, "", location.pathname + location.search);
    const access = m[1];
    try {
      const data = await api("/api/devices", {}, access);
      let entry = cfg.sticks.find((x) => x.id === data.stick);
      if (!entry) {
        entry = { id: data.stick, access, token: null, name: (data.devices[0] || {}).device || "", batchStart: null, formula: "" };
        cfg.sticks.push(entry);
      }
      cfg.current = entry.id; cfg.device = "";
      save();
      joined = true;
    } catch (e) {
      notice(escapeHtml(t("err.joinFailed", { message: e.message })), "error");
    }
  }

  // Переход со старой версии, где был один токен: забираем его стик.
  async function migrateLegacy() {
    if (!cfg.legacy) return;
    const { token, batchStart, formula } = cfg.legacy;
    try {
      const st = await addStick(token, { formula });
      delete cfg.legacy; save();
      if (batchStart) {
        await fetch(apiBase() + "/api/batch", { method: "POST", headers: { "Content-Type": "application/json", "X-Access": st.access },
          body: JSON.stringify({ start: batchStart }) }).catch(() => {});
      }
    } catch (e) {
      if (e.code === "taken" || e.status === 400) { delete cfg.legacy; save(); }
    }
  }

  // ---------- Окно настроек ----------
  function renderSticks() {
    const list = $("stick-list"), st = cur();
    list.innerHTML = cfg.sticks.map((x) => `
      <li class="${x === st ? "current" : ""}" data-id="${escapeHtml(x.id)}">
        <button class="pick" type="button" data-act="pick"><b>${escapeHtml(stickName(x))}</b>
          <small>${escapeHtml(t(x.token ? "sticks.mine" : "sticks.shared"))}</small></button>
        <button class="copy" type="button" data-act="share">${escapeHtml(t("sticks.share"))}</button>
        <button class="copy" type="button" data-act="remove" aria-label="${escapeHtml(t("sticks.remove"))}">✕</button>
      </li>`).join("");
    $("stick-empty").hidden = cfg.sticks.length > 0;
  }

  $("stick-list").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const id = btn.closest("li").dataset.id;
    const x = cfg.sticks.find((s) => s.id === id);
    $("stick-error").textContent = "";
    if (btn.dataset.act === "pick") {
      if (cfg.current !== id) switchStick(id);
      renderSticks(); syncForm();
    } else if (btn.dataset.act === "share") {
      btn.disabled = true;
      try {
        const { access } = await post("/api/share", {}, x.access);
        const link = location.origin + location.pathname + "#join=" + access;
        $("share-link").textContent = link;
        $("share-box").hidden = false;
        if (navigator.share) {
          try { await navigator.share({ title: t("app.name"), text: stickName(x), url: link }); } catch { /* закрыли */ }
        } else {
          try { await navigator.clipboard.writeText(link); } catch { /* скопируют кнопкой */ }
        }
      } catch (err) {
        $("stick-error").textContent = t("sticks.shareFail", { message: err.message });
      } finally { btn.disabled = false; }
    } else if (btn.dataset.act === "remove") {
      if (!confirm(t("sticks.removeConfirm", { name: stickName(x) }))) return;
      cfg.sticks = cfg.sticks.filter((s) => s !== x);
      $("share-box").hidden = true;
      if (cfg.current === id) switchStick(cfg.sticks[0] ? cfg.sticks[0].id : "");
      else save();
      renderSticks(); syncForm();
    }
  });

  // Сервер: по умолчанию скрыт, свой адрес — по кнопке.
  let serverCustom = false;
  function syncServer() {
    $("server-field").hidden = !serverCustom;
    $("server-edit").hidden = serverCustom;
    $("server-default").hidden = serverCustom;
    const shown = serverCustom ? (form.elements.api.value.trim() || "–") : DEFAULT_API;
    $("server-name").textContent = shown.replace(/^https?:\/\//, "");
    syncGuide();
  }
  function formBase() {
    return (serverCustom ? form.elements.api.value.trim() : DEFAULT_API).replace(/\/+$/, "");
  }
  // Инструкция показывает либо вводимый новый токен, либо токен выбранного стика.
  function syncGuide() {
    const base = formBase();
    const typed = form.elements.token.value.trim();
    const st = cur();
    const tok = typed || (st && st.token) || "";
    $("guide-url").textContent = base ? base + "/ingest" : "–";
    $("guide-token").textContent = tok || t(st && !typed ? "guide.tokenOwnerOnly" : "guide.tokenUnset");
    $("guide-token").nextElementSibling.hidden = !tok;
    let host = "–";
    try { host = new URL(base).hostname; } catch { /* ещё не адрес */ }
    $("guide-fallback").textContent = t("guide.fallback", { host });
  }
  // Партия и формула — у каждого стика свои.
  function syncForm() {
    const st = cur();
    form.elements.batchStart.value = toLocalInput(st && st.batchStart);
    form.elements.formula.value = st ? st.formula : "";
    form.elements.batchStart.disabled = form.elements.formula.disabled = $("batch-now").disabled = !st;
    syncGuide();
  }

  $("open-settings").onclick = () => {
    form.elements.token.value = "";
    form.elements.token.type = "password";
    $("token-show").textContent = t("settings.show");
    form.elements.api.value = cfg.api;
    serverCustom = !!cfg.api;
    $("token-error").textContent = "";
    $("stick-error").textContent = "";
    $("api-error").textContent = "";
    $("formula-error").textContent = "";
    $("share-box").hidden = true;
    $("guide").open = !cfg.sticks.length;
    renderSticks(); syncForm(); syncServer();
    dlg.showModal();
  };
  $("batch-now").onclick = () => { form.elements.batchStart.value = toLocalInput(Date.now()); };
  $("token-show").onclick = () => {
    const hidden = form.elements.token.type === "password";
    form.elements.token.type = hidden ? "text" : "password";
    $("token-show").textContent = t(hidden ? "settings.hide" : "settings.show");
  };
  $("token-gen").onclick = () => {
    form.elements.token.value = generateToken();
    form.elements.token.type = "text";
    $("token-show").textContent = t("settings.hide");
    $("token-error").textContent = "";
    $("guide").open = true;
    syncGuide();
  };
  async function onAdd() {
    const tok = form.elements.token.value.trim();
    const problem = tokenProblem(tok);
    if (problem) { $("token-error").textContent = problem; form.elements.token.focus(); return; }
    // Свой сервер — сначала применяем адрес, токен регистрируется на нём.
    if (serverCustom) cfg.api = form.elements.api.value.trim().replace(/\/+$/, "") === DEFAULT_API ? "" : form.elements.api.value.trim().replace(/\/+$/, "");
    const btn = $("token-add"); btn.disabled = true;
    try {
      await addStick(tok);
      $("token-error").textContent = "";
      form.elements.token.value = "";
      renderSticks(); syncForm();
      $("guide").open = true;
      devices = []; refresh();
    } catch (err) {
      $("token-error").textContent = err.code === "taken" ? t("err.tokenTaken") : t("err.register", { message: err.message });
    } finally { btn.disabled = false; }
  }
  $("token-add").onclick = onAdd;
  form.elements.token.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); onAdd(); } });
  form.elements.token.addEventListener("input", () => { $("token-error").textContent = ""; syncGuide(); });
  form.elements.api.addEventListener("input", () => { $("api-error").textContent = ""; syncServer(); });
  $("server-edit").onclick = () => {
    serverCustom = true;
    if (!form.elements.api.value) form.elements.api.value = DEFAULT_API;
    syncServer();
    form.elements.api.focus();
    form.elements.api.select();
  };
  $("server-reset").onclick = () => {
    serverCustom = false;
    form.elements.api.value = "";
    $("api-error").textContent = "";
    syncServer();
  };
  dlg.addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-copy]");
    if (!b) return;
    const text = $(b.dataset.copy).textContent;
    try { await navigator.clipboard.writeText(text); }
    catch {
      const r = document.createRange(); r.selectNodeContents($(b.dataset.copy));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      return;
    }
    b.textContent = t("ui.copied");
    setTimeout(() => { b.textContent = t("ui.copy"); }, 1500);
  });

  // Сохранить: адрес сервера, партия и формула выбранного стика. Стики добавляются и удаляются сразу.
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (e.submitter && e.submitter.value === "cancel") { dlg.close(); return; }
    let api = serverCustom ? form.elements.api.value.trim().replace(/\/+$/, "") : "";
    if (api === DEFAULT_API) api = "";
    if (serverCustom && api && !/^https?:\/\/[^/\s]+/.test(api)) { $("api-error").textContent = t("err.badUrl"); return; }
    cfg.api = api;
    const st = cur();
    if (st) {
      // Полином общий для всех, кто подключён к стику: проверяем, предупреждаем и сохраняем на сервере.
      const formula = form.elements.formula.value.trim();
      if (formula !== (st.formula || "")) {
        try { compileFormula(formula); }
        catch (err) { $("formula-error").textContent = err.message; form.elements.formula.focus(); return; }
        if (!confirm(t("formula.confirm"))) return;
        try { await postFormula(st, formula); }
        catch (err) { $("formula-error").textContent = t("err.formulaSave", { message: err.message }); return; }
        st.formula = formula;
        save();
      }
      const v = form.elements.batchStart.value;
      const start = v ? new Date(v).getTime() : null;
      // datetime-local хранит минуты — сравниваем с точностью до минуты.
      const same = (start === null && !st.batchStart) || (start !== null && st.batchStart && Math.abs(start - st.batchStart) < 60e3);
      if (!same) {
        save();
        if (!(await setBatch(start))) return;
      }
    }
    save(); syncRanges(); dlg.close(); refresh();
  });

  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    Object.values(charts).forEach((c) => c.destroy()); charts = {}; refresh();
  });

  // Приложение с главного экрана часто висит в фоне: обновляем при возврате и при появлении сети.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  addEventListener("online", refresh);

  // ---------- Установка на телефон ----------
  // Android/Chrome: ловим beforeinstallprompt и показываем свою кнопку.
  // iOS: такого события нет — показываем инструкцию «Поделиться → На экран „Домой“».
  // Не показываем, если приложение уже запущено как установленное или недавно нажали «Не сейчас».
  const INSTALL_STORE = "ispindel.installLater";
  const installed = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let deferredInstall = null, installIOS = false;
  const syncInstallText = () => { $("install-later").textContent = t(installIOS ? "install.ok" : "install.later"); };
  function installSnoozed() {
    try { return Date.now() - Number(localStorage.getItem(INSTALL_STORE) || 0) < 14 * 86400e3; } catch { return false; }
  }
  function showInstall(ios) {
    if (installed() || installSnoozed()) return;
    installIOS = ios;
    $("install-android").hidden = ios;
    $("install-ios").hidden = !ios;
    $("install-go").hidden = ios;
    syncInstallText();
    $("install").hidden = false;
    document.body.classList.add("has-install");
  }
  addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstall = e;
    showInstall(false);
  });
  const hideInstall = () => { $("install").hidden = true; document.body.classList.remove("has-install"); };
  addEventListener("appinstalled", () => { hideInstall(); deferredInstall = null; });
  $("install-go").onclick = async () => {
    hideInstall();
    if (!deferredInstall) return;
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch { /* закрыли */ }
    deferredInstall = null;
  };
  $("install-later").onclick = () => {
    hideInstall();
    try { localStorage.setItem(INSTALL_STORE, String(Date.now())); } catch { /* приватный режим */ }
  };
  if (isIOS) setTimeout(() => showInstall(true), 2500);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch((e) => console.warn("Service worker not registered", e));
  }

  // Язык — маленькая кнопка: каждый клик переключает на следующий по кругу.
  const LANG_CYCLE = ["en", "uk", "ru", "es"];
  const LANG_CODE = { en: "EN", uk: "UA", ru: "RU", es: "ES" };
  const langBtn = $("lang");
  function syncLang() {
    const code = I18N.lang();
    langBtn.textContent = LANG_CODE[code] || code.toUpperCase();
    langBtn.title = `${t("ui.language")}: ${I18N.name(code)}`;
    langBtn.setAttribute("aria-label", langBtn.title);
  }
  I18N.use(I18N.detect());
  langBtn.onclick = () => {
    const next = LANG_CYCLE[(LANG_CYCLE.indexOf(I18N.lang()) + 1) % LANG_CYCLE.length];
    I18N.use(next, true);
    applyStatic(); syncLang(); syncInstallText();
    if (dlg.open) { renderSticks(); syncServer(); }
    // Axis ticks and tooltips are baked into the chart options, so rebuild them.
    Object.values(charts).forEach((c) => c.destroy());
    charts = {};
    refresh();
  };
  syncLang();
  applyStatic();

  syncRanges();
  (async () => {
    await handleJoin();
    await migrateLegacy();
    refresh();
    if (!cfg.sticks.length) $("open-settings").click();
  })();
  setInterval(() => { if (!document.hidden) refresh(); }, 60e3);
})();
</script>
</body>
</html>
