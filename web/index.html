<script>
(() => {
  "use strict";

  // ---------- Язык ----------
  const t = (key, params) => I18N.t(key, params);

  function applyStatic() {
    document.documentElement.lang = I18N.lang();
    document.title = t("app.name");
    const desc = document.querySelector('meta[name="description"]');
    if (desc) desc.content = t("app.description");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-title]").forEach((el) => { el.title = t(el.dataset.i18nTitle); });
    document.querySelectorAll("[data-i18n-label]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nLabel)); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  }

  // ---------- Настройки ----------
  const STORE = "ispindel.cfg";
  const RANGES = { "1h": 3600e3, "6h": 6 * 3600e3, "24h": 24 * 3600e3, "3d": 3 * 86400e3, "7d": 7 * 86400e3 };
  // Адрес воркера по умолчанию — из config.js; cfg.api хранит только свой адрес, если он задан.
  const DEFAULT_API = ((window.ISPINDEL_DEFAULTS || {}).api || "").replace(/\/+$/, "");
  // sticks: [{ id, access, token, name, batchStart, formula }] — token есть только у того, кто стик зарегистрировал.
  const defaults = { api: "", sticks: [], current: "", device: "", range: "24h", smooth: true };
  let cfg = load();
  const apiBase = () => (cfg.api || DEFAULT_API).replace(/\/+$/, "");
  const cur = () => cfg.sticks.find((x) => x.id === cfg.current) || cfg.sticks[0] || null;
  const stickName = (x) => x.name || `${t("sticks.unnamed")} · ${String(x.id).slice(0, 4)}`;

  function load() {
    let c;
    try { c = Object.assign({}, defaults, JSON.parse(localStorage.getItem(STORE) || "{}")); }
    catch { c = Object.assign({}, defaults); }
    // Старые версии: адрес по умолчанию, ключ чтения, один токен и общие партия/формула.
    if (c.api && c.api.replace(/\/+$/, "") === DEFAULT_API) c.api = "";
    if (!Array.isArray(c.sticks)) c.sticks = [];
    if (c.token && !c.sticks.length) c.legacy = { token: c.token, batchStart: c.batchStart ?? null, formula: c.formula || "" };
    delete c.key; delete c.token; delete c.batchStart; delete c.formula;
    return c;
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch { /* приватный режим */ }
  }

  // ---------- Пиво: пересчёты ----------
  const sgFromPlato = (p) => 1 + p / (258.6 - (p / 258.2) * 227.1);
  const platoFromSG = (sg) => -616.868 + 1111.14 * sg - 630.272 * sg ** 2 + 135.997 * sg ** 3;
  // В режиме «Авто» единицы определяем по медиане: SG почти всегда 0,98–1,15, а °P такой бывает
  // только у почти выбродившего пива. Поэтому смотрим на начало партии (там SG ≈ 1,03–1,12 против 7–28 °P).
  function detectUnits(values) {
    const m = median(values.filter((v) => v != null && Number.isFinite(v)));
    if (m == null) return null;
    return m > 0.95 && m < 1.25 ? "SG" : "P";
  }
  const abv = (ogP, fgP) => (sgFromPlato(ogP) - sgFromPlato(fgP)) * 131.25;
  const BATTERY = [[4.2, 100], [4.1, 90], [4.0, 80], [3.9, 65], [3.8, 50], [3.7, 35], [3.6, 20], [3.5, 8], [3.4, 0]];
  function batteryPct(v) {
    if (v == null) return null;
    if (v >= BATTERY[0][0]) return 100;
    for (let i = 1; i < BATTERY.length; i++) {
      const [v1, p1] = BATTERY[i - 1], [v2, p2] = BATTERY[i];
      if (v >= v2) return Math.round(p2 + (p1 - p2) * (v - v2) / (v1 - v2));
    }
    return 0;
  }
  // Сила сигнала в процентах: −50 dBm и сильнее — 100 %, −100 dBm — 0 %.
  const wifiPct = (r) => r == null ? null : Math.max(0, Math.min(100, 2 * (r + 100)));
  function rssiText(r) {
    if (r == null) return "–";
    if (r >= -60) return t("wifi.excellent");
    if (r >= -70) return t("wifi.good");
    if (r >= -80) return t("wifi.weak");
    return t("wifi.veryWeak");
  }

  // Формула: только числа, tilt, + - * / ^ ( )
  function compileFormula(src) {
    if (!src || !src.trim()) return null;
    const s = src.replace(/tilt/gi, "t").replace(/\s+/g, "");
    if (!/^[0-9t.+\-*/^()eE]+$/.test(s)) throw new Error(t("err.formulaChars"));
    const fn = new Function("t", '"use strict"; return (' + s.replace(/\^/g, "**") + ");");
    const probe = fn(25);
    if (typeof probe !== "number" || !Number.isFinite(probe)) throw new Error(t("err.formulaProbe"));
    return fn;
  }

  // Плотность вне этого диапазона — датчик лежит или стоит, а не плавает
  const plausible = (g) => g != null && Number.isFinite(g) && g > -2 && g < 35;

  function median(arr) {
    const a = arr.filter((x) => x != null).sort((x, y) => x - y);
    if (!a.length) return null;
    const m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }
  function smoothSeries(points, w = 5) {
    return points.map((p, i) => {
      const win = points.slice(Math.max(0, i - (w >> 1)), i + (w >> 1) + 1).map((q) => q.y);
      return { x: p.x, y: median(win) };
    });
  }

  // ---------- Формат ----------
  const fmt = (n, d = 1) => n == null ? "–" : n.toLocaleString(I18N.locale(), { minimumFractionDigits: d, maximumFractionDigits: d });
  // Строка с числом в правильной форме: ключи base.one / .few / .many / .other
  const pluralRules = {};
  function tn(base, n, decimals = 0) {
    const loc = I18N.locale();
    const rules = pluralRules[loc] || (pluralRules[loc] = new Intl.PluralRules(loc));
    let key = `${base}.${rules.select(n)}`;
    if (t(key) === key) key = `${base}.other`;
    return t(key).split("{n}").join(fmt(n, decimals));
  }
  function ago(ts) {
    const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (s < 60) return tn("ago.sec", s);
    if (s < 3600) return tn("ago.min", Math.floor(s / 60));
    if (s < 86400) return tn("ago.hour", Math.floor(s / 3600));
    return tn("ago.day", Math.floor(s / 86400));
  }
  const dayTime = (ts) => new Date(ts).toLocaleString(I18N.locale(), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

  // ---------- API ----------
  // Время, когда сохранены данные, если ответ пришёл из кэша service worker'а (нет сети).
  let cachedAt = null;

  async function api(path, params = {}, access = cur() && cur().access) {
    const url = new URL(apiBase() + path);
    Object.entries(params).forEach(([k, v]) => v != null && v !== "" && url.searchParams.set(k, v));
    const res = await fetch(url, { headers: { "X-Access": access } });
    if (res.status === 401) throw new Error(t("err.unknownToken"));
    if (!res.ok) {
      // Показываем, что именно ответил воркер, а не только код.
      let detail = "";
      try { const body = await res.clone().json(); detail = body && body.error ? String(body.error) : ""; }
      catch { try { detail = (await res.text()).slice(0, 200); } catch { /* пусто */ } }
      throw new Error(t("err.workerStatus", { status: res.status }) + (detail ? " " + detail : ""));
    }
    const fromCache = res.headers.get("X-From-Cache");
    if (fromCache) cachedAt = Math.min(cachedAt ?? Infinity, Number(fromCache) || Date.now());
    return res.json();
  }

  // ---------- Отрисовка ----------
  const $ = (id) => document.getElementById(id);
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  let charts = {};

  function notice(html, kind = "") {
    $("notice").innerHTML = html ? `<div class="notice ${kind}">${html}</div>` : "";
  }

  // band: {lo, hi, color} — закрашенная полоса нормы (например, температура стиля)
  function renderChart(id, points, raw, color, unit, decimals, minSpan = 0, band = null) {
    const grid = css("--rule"), muted = css("--muted");
    const ds = [];
    const xs = points.concat(raw || []).map((p) => p.x);
    if (band && xs.length) {
      const x0 = Math.min(...xs), x1 = Math.max(...xs);
      ds.push({ data: [{ x: x0, y: band.lo }, { x: x1, y: band.lo }], borderWidth: 0, pointRadius: 0, pointHoverRadius: 0, fill: false, label: "lo" });
      ds.push({ data: [{ x: x0, y: band.hi }, { x: x1, y: band.hi }], borderWidth: 0, pointRadius: 0, pointHoverRadius: 0, fill: "-1", backgroundColor: band.color, label: "hi" });
    }
    if (raw) ds.push({ data: raw, borderColor: color, backgroundColor: color, borderWidth: 0, pointRadius: 1.5, pointHoverRadius: 3, showLine: false, label: t("charts.raw") });
    ds.push({ data: points, borderColor: color, borderWidth: 2.2, pointRadius: 0, pointHoverRadius: 4, tension: .25, spanGaps: false, label: unit });
    const xMin = points[0]?.x ?? raw?.[0]?.x, xMax = points.at(-1)?.x ?? raw?.at(-1)?.x;
    const opts = {
      responsive: true, maintainAspectRatio: false, animation: false, parsing: false, normalized: true,
      interaction: { mode: "nearest", axis: "x", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          filter: (item) => item.datasetIndex === ds.length - 1,
          callbacks: {
            title: (items) => dayTime(items[0].parsed.x),
            label: (item) => `${fmt(item.parsed.y, decimals)} ${unit}`,
          },
        },
      },
      scales: {
        x: {
          type: "linear", min: xMin, max: xMax,
          grid: { color: grid }, border: { display: false },
          ticks: {
            color: muted, maxTicksLimit: 6, maxRotation: 0,
            callback: (v) => {
              const d = new Date(v), span = (xMax - xMin) || 1;
              return span > 36 * 3600e3
                ? d.toLocaleDateString(I18N.locale(), { day: "numeric", month: "short" })
                : d.toLocaleTimeString(I18N.locale(), { hour: "2-digit", minute: "2-digit" });
            },
          },
        },
        y: (() => {
          // Минимальный размах оси, чтобы шум в сотых не выглядел как скачки
          const ys = points.concat(raw || []).map((p) => p.y).concat(band ? [band.lo, band.hi] : []).filter((v) => v != null);
          const lo = Math.min(...ys), hi = Math.max(...ys), mid = (lo + hi) / 2;
          const half = Math.max((hi - lo) / 2, minSpan / 2);
          return {
            min: ys.length ? mid - half : undefined, max: ys.length ? mid + half : undefined,
            grid: { color: grid }, border: { display: false },
            ticks: { color: muted, callback: (v) => fmt(v, decimals) },
          };
        })(),
      },
    };
    if (charts[id]) { charts[id].data.datasets = ds; charts[id].options = opts; charts[id].update(); return; }
    charts[id] = new Chart($(id), { type: "line", data: { datasets: ds }, options: opts });
  }

  // ---------- Основной цикл ----------
  let devices = [];
  let busy = false;

  let rangePicked = false;
  let detectedUnits = null;

  // Партия общая для всех, у кого есть доступ к стику: {start?, style?, fg?} уходят на сервер.
  async function postBatch(st, body) {
    const res = await fetch(apiBase() + "/api/batch", {
      method: "POST", headers: { "Content-Type": "application/json", "X-Access": st.access },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || String(res.status));
    if ("start" in body) { if (body.start !== st.batchStart) st.marks = []; st.batchStart = body.start; }
    if ("style" in body) st.style = body.style;
    if ("fg" in body) st.fg = body.fg;
    if ("recipe" in body) st.recipe = body.recipe;
    if ("marks" in body) st.marks = body.marks;
    save();
  }

  // Перезапуск идущей партии сбрасывает её у всех — только после подтверждения.
  function confirmReset(st, start) {
    return !(st.batchStart && st.batchStart < Date.now() && start !== st.batchStart) ||
      confirm(t("batch.confirmReset", { date: dayTime(st.batchStart) }));
  }

  // Начало партии из настроек (без смены стиля и цели).
  async function setBatch(start) {
    const st = cur();
    if (!st || !confirmReset(st, start)) return false;
    try { await postBatch(st, { start }); }
    catch (e) { notice(escapeHtml(t("err.batch", { message: e.message })), "error"); return false; }
    if (start) { cfg.range = "batch"; rangePicked = false; }
    syncRanges(); refresh();
    return true;
  }

  async function postFormula(st, formula) {
    const res = await fetch(apiBase() + "/api/formula", {
      method: "POST", headers: { "Content-Type": "application/json", "X-Access": st.access },
      body: JSON.stringify({ formula }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || String(res.status));
  }

  // История с экономией чтений из базы: полностью загружаем при открытии, смене стика, устройства,
  // периода или партии (и раз в 6 часов), а дальше раз в минуту догружаем только новые строки.
  let hist = null;
  async function loadHistory(st, from, now) {
    const key = [st.id, cfg.device, cfg.range, st.batchStart || 0].join("|");
    if (hist && hist.key === key && now - hist.loadedAt < 6 * 3600e3 && hist.from <= from) {
      const lastTs = hist.rows.length ? hist.rows.at(-1).ts : from;
      const { readings } = await api("/api/readings", { device: cfg.device, after: lastTs, to: now });
      hist.rows = hist.rows.concat(readings).filter((r) => r.ts >= from);
      return hist.rows;
    }
    const { readings } = await api("/api/readings", { device: cfg.device, from, to: now });
    hist = { key, from, loadedAt: now, rows: readings };
    return readings;
  }

  // Напряжение по часам для прогноза батареи — не чаще раза в 3 часа на стик и устройство.
  async function loadBattery(st) {
    const key = `ispindel.batt.${st.id}.${cfg.device}`;
    try {
      const c = JSON.parse(localStorage.getItem(key) || "null");
      if (c && Date.now() - c.at < 3 * 3600e3) return c.hours;
    } catch { /* нет кэша */ }
    try {
      const hours = (await api("/api/battery", { device: cfg.device, days: 7 })).hours;
      try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), hours })); } catch { /* приватный режим */ }
      return hours;
    } catch { return null; }
  }

  async function refresh() {
    if (busy) return;
    const st = cur();
    document.body.classList.toggle("is-demo", !st);
    $("demo").hidden = !!st;
    if (!st) { renderDemo(); return; }
    demoStick = null;
    if (!apiBase()) {
      devices = []; renderTitle();
      ["hero", "charts", "recs"].forEach((id) => $(id).hidden = true);
      seenInfo = null; $("seen").textContent = t("status.notConnected");
      notice(t(apiBase() ? "notice.setToken" : "notice.setApi"));
      return;
    }
    busy = true;
    $("refresh").classList.add("spin");
    cachedAt = null;
    try {
      const msgs = [];

      const data = await api("/api/devices");
      devices = data.devices || [];
      // Начало партии хранится на сервере и общее для всех, у кого есть доступ к стику.
      if ("batch_start" in data && st.batchStart !== data.batch_start) { st.batchStart = data.batch_start; save(); }
      // Полином тоже общий. При первой встрече с сервером, где полинома ещё нет, отдаём ему свой локальный.
      if ("formula" in data) {
        const remote = data.formula || "";
        if (!st.formulaSynced && !remote && st.formula) {
          await postFormula(st, st.formula).catch(() => {});
        } else if (st.formula !== remote) {
          st.formula = remote;
        }
        st.formulaSynced = true; save();
      }
      if ("units" in data && st.units !== data.units) { st.units = data.units; save(); }
      // Админ ли этот браузер — решает сервер по ключу доступа.
      if ("admin" in data && st.admin !== data.admin) { st.admin = data.admin; save(); }
      if ("style" in data) { st.style = data.style; st.fg = data.fg; save(); }
      if ("recipe" in data && st.recipe !== data.recipe) { st.recipe = data.recipe; save(); }
      if ("marks" in data && JSON.stringify(st.marks || []) !== JSON.stringify(data.marks)) { st.marks = data.marks; save(); }
      const recipe = st.recipe ? await loadRecipe(st.recipe, st).catch(() => null) : null;
      // Норма температуры для оповещений — из рецепта (все шаги плана) или стиля; сервер их не знает.
      if ("range" in data) {
        const style = st.style ? Brew.byId[st.style] : null;
        const want = recipe ? Recipe.range(recipe) : style ? style.t : null;
        if (JSON.stringify(want) !== JSON.stringify(data.range)) postBatch(st, { range: want }).catch(() => {});
      }
      loadAlerts(st).catch(() => {});
      loadAi(st).catch(() => {});
      let formula = null;
      try { formula = compileFormula(st.formula); }
      catch (e) { msgs.push(e.message + t("err.formulaFallback")); }
      if (devices.length && st.name !== devices[0].device) { st.name = devices[0].device; save(); }
      renderTitle();
      if (!devices.length) {
        ["hero", "charts", "recs"].forEach((id) => $(id).hidden = true);
        seenInfo = null; $("seen").textContent = t("status.noData");
        notice(t("notice.noReadings"));
        return;
      }
      if (!devices.some((d) => d.device === cfg.device)) { cfg.device = devices[0].device; renderTitle(); }

      const now = Date.now();
      const hasBatch = !!st.batchStart && st.batchStart < now;
      $("ranges").querySelector('[data-range="batch"]').hidden = !hasBatch;
      if (cfg.range === "batch" && !hasBatch) { cfg.range = "24h"; syncRanges(); }
      // Пока партия идёт, по умолчанию показываем её целиком.
      if (hasBatch && !rangePicked && cfg.range !== "batch") { cfg.range = "batch"; syncRanges(); }
      const rangeFrom = cfg.range === "batch" ? st.batchStart : now - RANGES[cfg.range];
      // Для начальной плотности и динамики за сутки берём данные с начала партии или хотя бы за 26 ч
      const from = Math.min(rangeFrom, hasBatch ? st.batchStart : rangeFrom, now - 26 * 3600e3);
      const readings = await loadHistory(st, from, now);

      const rows = readings.map((r) => ({
        ...r,
        g: formula && r.angle != null ? formula(r.angle) : r.gravity,
      }));
      // Плотность в SG (у iSpindel или у формулы) переводим в °P до всех расчётов.
      const sample = hasBatch ? rows.filter((r) => r.ts >= st.batchStart).slice(0, 12) : rows;
      detectedUnits = detectUnits((sample.length ? sample : rows).map((r) => r.g));
      const units = st.units === "SG" || st.units === "P" ? st.units : detectedUnits;
      if (units === "SG") rows.forEach((r) => { if (r.g != null) r.g = platoFromSG(r.g); });
      const valid = rows.filter((r) => plausible(r.g));
      const last = devices.find((d) => d.device === cfg.device);

      const batt = await loadBattery(st);
      renderMain(rows, valid, last, hasBatch, batt, now);
      renderCharts(rows.filter((r) => r.ts >= rangeFrom), last);
      if (!valid.some((r) => r.ts >= rangeFrom)) {
        msgs.push(t("notice.implausible"));
      }
      if (cachedAt != null) {
        msgs.unshift(t("notice.offline", { ago: ago(cachedAt) }));
      }
      if (joined) { msgs.unshift(t("sticks.joined", { name: stickName(st) })); joined = false; }
      notice(msgs.map(escapeHtml).join("<br>"), msgs.length && st.formula && !formula ? "error" : "");
    } catch (e) {
      notice(escapeHtml(t("err.fetch", { message: e.message })), "error");
      seenInfo = null; $("seen").textContent = t("status.noConnection");
    } finally {
      busy = false;
      $("refresh").classList.remove("spin");
    }
  }

  // Заголовок: переключатель стиков (если их несколько) и устройств внутри стика.
  function renderTitle() {
    const title = $("title"), st = cur();
    let html = "";
    if (cfg.sticks.length > 1) {
      html = `<select id="stick-switch" aria-label="${escapeHtml(t("ui.device"))}">${cfg.sticks.map((x) =>
        `<option value="${escapeHtml(x.id)}" ${x === st ? "selected" : ""}>${escapeHtml(stickName(x))}</option>`).join("")}</select>`;
    } else {
      html = escapeHtml(st ? stickName(st) : t("app.name"));
    }
    if (devices.length > 1) {
      html += `<br><select id="device-switch" aria-label="${escapeHtml(t("ui.device"))}">${devices.map((d) =>
        `<option ${d.device === cfg.device ? "selected" : ""}>${escapeHtml(d.device)}</option>`).join("")}</select>`;
    }
    title.innerHTML = html;
    if ($("stick-switch")) $("stick-switch").onchange = (e) => switchStick(e.target.value);
    if ($("device-switch")) $("device-switch").onchange = (e) => { cfg.device = e.target.value; save(); refresh(); };
  }

  function switchStick(id) {
    cfg.current = id; cfg.device = ""; devices = [];
    renderBell();
    if (cfg.range === "batch") cfg.range = "24h";
    rangePicked = false;
    save(); syncRanges();
    Object.values(charts).forEach((c) => c.destroy()); charts = {};
    refresh();
  }

  // ---------- Иконки показателей ----------
  const svgIcon = (inner, extra = "") => `<svg viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${inner}</svg>`;
  const icons = {
    temp: () => svgIcon(`<path d="M16 15.5V6a2.5 2.5 0 0 0-5 0v9.5a5 5 0 1 0 5 0z"/><circle cx="13.5" cy="19.5" r="2" fill="currentColor"/><path d="M13.5 17.5V10"/><path d="M19 7h3M19 11h3M19 15h2"/>`),
    battery: (pct) => {
      const color = pct == null ? css("--muted") : pct > 50 ? css("--ok") : pct > 20 ? css("--amber") : css("--alert");
      const w = pct == null ? 0 : Math.max(1.5, 15 * pct / 100);
      return svgIcon(`<rect x="3" y="9" width="19" height="10" rx="2.5"/><path d="M24.5 12.5v3" stroke-width="2.4"/>` +
        `<rect x="5" y="11" width="${w}" height="6" rx="1" fill="${color}" stroke="none"/>`, `style="color:${color}"`);
    },
    // Колба повёрнута на реальный наклон (0° — лежит, 90° — стоит)
    tilt: (angle) => {
      const a = angle == null ? 45 : Math.max(0, Math.min(90, angle));
      return svgIcon(`<path d="M3 21h22" opacity=".5"/><g transform="rotate(${-a} 14 14)"><rect x="5" y="11.5" width="18" height="5" rx="2.5"/></g>`);
    },
    wifi: (rssi) => {
      const level = rssi == null ? 0 : rssi >= -60 ? 3 : rssi >= -70 ? 2 : rssi >= -80 ? 1 : 0;
      const arc = (r, i) => `<path d="M${14 - r} ${21 - r * .55}a${r} ${r} 0 0 1 ${2 * r} 0" opacity="${i < level ? 1 : .25}"/>`;
      return svgIcon(`${arc(4, 0)}${arc(8, 1)}${arc(12, 2)}<circle cx="14" cy="21.5" r="1.4" fill="currentColor" stroke="none"/>`);
    },
    clock: () => svgIcon(`<circle cx="14" cy="14" r="10"/><path d="M14 8v6l4 2.5"/>`),
    gravity: () => svgIcon(`<path d="M3 15c3 0 3-1.6 5.5-1.6S11 15 14 15s3-1.6 5.5-1.6S22 15 25 15" opacity=".6"/><rect x="11.5" y="3" width="5" height="14" rx="2.5"/><circle cx="14" cy="20.5" r="3.5"/>`),
    beer: () => svgIcon(`<path d="M6 9h12v13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M18 12h2.5a2.5 2.5 0 0 1 0 5H18"/><path d="M6 9a3 3 0 0 1 3-4 3.5 3.5 0 0 1 6 0 2.5 2.5 0 0 1 3 4"/><path d="M10 13v7M14 13v7"/>`),
    trend: () => svgIcon(`<path d="M4 8l7 7 4-4 9 9"/><path d="M24 14v6h-6"/>`),
  };

  // ---------- Батарея: расход и прогноз ----------
  // hours: [{hour, v}] — среднее напряжение по часам из /api/battery
  function batteryForecast(hours) {
    if (!hours || hours.length < 2) return { status: "nodata" };
    // Текущий разряд начинается после последней зарядки (подъём напряжения > 0.08 В)
    let start = 0, minSince = hours[0].v;
    for (let i = 1; i < hours.length; i++) {
      if (hours[i].v > minSince + 0.08) { start = i; minSince = hours[i].v; }
      else minSince = Math.min(minSince, hours[i].v);
    }
    const pts = hours.slice(start).map((h) => ({ x: h.hour / 86400e3, y: batteryPct(h.v) }));
    const spanDays = pts.length ? pts.at(-1).x - pts[0].x : 0;
    if (pts.length < 6 || spanDays < 0.5) return { status: "short" };
    // Линейная регрессия: процент заряда от времени в сутках
    const n = pts.length, mx = pts.reduce((a, p) => a + p.x, 0) / n, my = pts.reduce((a, p) => a + p.y, 0) / n;
    let num = 0, den = 0;
    pts.forEach((p) => { num += (p.x - mx) * (p.y - my); den += (p.x - mx) ** 2; });
    const rate = den ? -num / den : 0;
    if (rate < 0.05) return { status: "flat", spanDays };
    return { status: "ok", rate, spanDays };
  }

  function batteryNote(pct, fc) {
    const span = (d) => fmt(d, d >= 2 ? 0 : 1);
    if (fc.status === "ok" && pct != null) {
      const days = pct / fc.rate;
      const d = days >= 2 ? Math.round(days) : Math.round(days * 10) / 10;
      return escapeHtml(t("battery.forecast", { days: tn("unit.days", d, days >= 2 ? 0 : 1) })) + "<br>" +
        escapeHtml(t("battery.rate", { rate: fmt(fc.rate, 1), span: span(fc.spanDays) }));
    }
    if (fc.status === "flat") return escapeHtml(t("battery.flat", { span: span(fc.spanDays) }));
    return escapeHtml(t(fc.status === "short" ? "battery.short" : "battery.nodata"));
  }

  function intervalText(sec) {
    if (!sec) return "–";
    if (sec < 120) return `${sec} ${t("unit.sec")}`;
    return `${Math.round(sec / 60)} ${t("unit.min")}`;
  }

  // ---------- Главный экран: плашка, значки, брожение, партия, рекомендации ----------
  let view = null;   // всё, что нужно всплывающим подсказкам
  const toC = (v, u) => v == null ? null : u === "F" ? (v - 32) * 5 / 9 : u === "K" ? v - 273.15 : v;
  const tUnit = (u) => u === "F" ? "°F" : u === "K" ? "K" : "°C";
  const styleName = (st) => st ? (st.name[I18N.lang()] || st.name.en) : "";
  // Числа в текстах: измеренные значения — с одним знаком, границы и счётчики — как есть.
  const fmtMax1 = (v) => v.toLocaleString(I18N.locale(), { maximumFractionDigits: 1 });
  const ONE_DECIMAL = new Set(["proj", "now", "g", "fg", "og", "rate", "peak", "t", "swing", "jump"]);
  const msgText = (m) => t(m.key, Object.fromEntries(Object.entries(m.params).map(([k, v]) =>
    [k, typeof v === "number" ? (ONE_DECIMAL.has(k) ? fmt(v, 1) : fmtMax1(v)) : v])));
  const rangeText = (r) => `${fmtMax1(r[0])}–${fmtMax1(r[1])}`;
  const dateShort = (ts) => new Date(ts).toLocaleDateString(I18N.locale(), { day: "numeric", month: "short" });

  // ---------- Стадии брожения на шкале партии ----------
  // Шкала — от НП до цели. Пройденные стадии отмечены сплошными засечками в точке своего начала,
  // ожидаемые — пунктиром (5 % — активное, 70 % — затухание, 100 % — цель). Конец партии (проверка,
  // завершено, можно разливать) — у правого края.
  const STAGE_EXPECT = { active: 0.05, slowing: 0.7, checking: 1 };
  const STAGES_ALL = ["lag", "active", "slowing", "checking", "done", "ready"];
  function stageScale(a, style) {
    const pct = (v) => Math.round(Math.min(1, Math.max(0, v)) * 1000) / 10;
    const passed = Object.fromEntries((a.stages || []).map((x) => [x.id, x]));
    const endId = ["ready", "done", "checking"].find((id) => passed[id]) || "checking";
    const segs = [["lag", 0], ["active", STAGE_EXPECT.active], ["slowing", STAGE_EXPECT.slowing], [endId, STAGE_EXPECT.checking]]
      .map(([id, exp]) => {
        const real = id === "lag" ? passed.lag : passed[id] || (id === endId && (passed.done || passed.ready) && passed.checking);
        return { id, at: real ? real.progress : exp, real: !!real };
      });
    // Позиции не должны идти назад (если стадия началась раньше ожидаемого — сдвигаем следующие).
    for (let i = 1; i < segs.length; i++) segs[i].at = Math.max(segs[i].at, segs[i - 1].at);
    const curId = a.stage;
    const labels = segs.map((x, i) => {
      const left = pct(x.at), right = i + 1 < segs.length ? pct(segs[i + 1].at) : 100;
      const isEnd = i === segs.length - 1;
      const cls = (x.id === curId || (isEnd && ["checking", "done", "ready"].includes(curId)) ? "cur" : "") + (isEnd ? " end" : "");
      // Пока до конца партии не дошли, у правого края — короткое «Финиш», чтобы поместилось «Затухание».
      const name = isEnd && !x.real ? t("stage.end") : t("stage." + x.id);
      return `<span class="${cls.trim()}" style="${isEnd ? "right:0" : `left:${left}%;width:${Math.max(0, right - left)}%`}">${escapeHtml(name)}</span>`;
    }).join("");
    const ticks = segs.slice(1).map((x) => `<i class="tick${x.real ? "" : " exp"}" style="left:${pct(x.at)}%"></i>`).join("");
    const alarm = a.alarm ? `<span class="st-alarm ${a.alarm.id === "stalled" ? "bad" : "warn"}">${escapeHtml(t("stage." + a.alarm.id))}</span>` : "";

          <div><small>${escapeHtml(t("batch.abv"))}</small><b>${a.abvNow != null ? fmt(a.abvNow, 1) + "%" : "–"}${a.projAbv != null ? ` <span style="font-size:.6em;opacity:.7">→ ${fmt(a.projAbv, 1)}%</span>` : ""}</b></div>
          <div><small>${escapeHtml(t("batch.left"))}</small><b>${escapeHtml(left)}</b></div>
        </div>`;
      if (a.ready && a.eta.hi > 0) {
        html += `<p class="eta">${t("batch.readyBy", { lo: escapeHtml(dateShort(a.ready.lo)), hi: escapeHtml(dateShort(a.ready.hi)) })} · ${escapeHtml(basis)}</p>`;
      } else if (og == null) {
        html += `<p class="eta">${escapeHtml(t("batch.waiting", { date: dayTime(st.batchStart) }))}</p>`;
      }
      if (a.stage === "done" || a.stage === "ready") html += batchPrimingHtml(rows, a, recipe, style, st, now);
      // Пока в калькуляторе сахара что-то вводят, ежеминутное обновление панель не перерисовывает.
      if (!(document.activeElement && bp.contains(document.activeElement) && document.activeElement.closest(".prime"))) {
        bp.innerHTML = html + actionBar(t("act.newBatch"), !!(a.stages && a.stage !== "ready"));
        fitStageLabels(); fillPrimes(bp);
      }
    } else {
      bp.innerHTML = (st.id !== "demo" ? brewBanner(st) : "") + `<p class="hint">${escapeHtml(t("batch.none"))}</p>` + actionBar(t("batch.startNow"));
    }
    if ($("new-batch")) $("new-batch").onclick = () => openBatchDialog();
    if ($("next-stage")) $("next-stage").onclick = () => stagesSheet();
    if ($("ai-btn")) $("ai-btn").onclick = () => openAi();
    $("about-style").onclick = () => style ? openStyle(style.id) : openCatalog();
    $("open-catalog").onclick = () => openCatalog();

    // Рекомендации
    const section = (part, key) => {
      const p = a[part];
      if (!p.msgs.length) return "";
      return `<div class="rec ${p.level}"><span class="mark">${p.level === "ok" ? "✓" : "!"}</span><b>${escapeHtml(t(key))}</b>
        <ul>${p.msgs.map((m) => `<li class="${m.level}">${escapeHtml(msgText(m))}</li>`).join("")}</ul></div>`;
    };
    const recs = section("temp", "recs.temp") + section("gravity", "recs.gravity") + section("abv", "recs.abv");
    $("recs").hidden = !recs;
    $("recs").innerHTML = `<h2>${escapeHtml(t("recs.title"))}</h2>${recs}`;

    seenInfo = { ts: last.ts, expected: (last.interval_s || 900) * 1000 };
    updateSeen();
    if (!$("pop").hidden && popFor) showPop(popFor);
  }

  const ACT_ICONS = {

    book: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>`,

  };
  const BREW_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14v8a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/><path d="M3 9h18"/><path d="M9 5.5c0-1 .7-1.5 1.5-1.5M13 5.5c0-1 .7-1.5 1.5-1.5"/></svg>`;
  const BOTTLE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4v4l1.5 3v11a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2V9L10 6z"/><path d="M8.5 13h7"/></svg>`;
  // Пока партия идёт — главная кнопка «Следующий этап» (список стадий с «Завершено»), «Новая партия» — в том списке.
  const actionBar = (first, nextStage) => `<div class="actbar">
      ${nextStage ? `<button type="button" class="main" id="next-stage">${ACT_ICONS.next}${escapeHtml(t("act.nextStage"))}</button>`

  // ---------- Справочник стилей и карточка стиля (лист снизу) ----------
  const sheet = $("sheet");
  let catState = { cat: "all", q: "", tab: "styles", rf: null };
  const COLOURS = { pale: "#e8c55c", amber: "#c4782a", dark: "#4a2c1d" };
  const closeBtn = `<button class="x" type="button" data-close aria-label="${escapeHtml(t("sheet.close"))}">×</button>`;
  function openSheet(html) {
    $("sheet-body").innerHTML = html;
    if (!sheet.open) sheet.showModal();
    sheet.scrollTop = 0;
  }
  sheet.addEventListener("click", (e) => {
    if (e.target === sheet || e.target.closest("[data-close]")) sheet.close();
    const back = e.target.closest("[data-back]");
    if (back) openCatalog();
    const pick = e.target.closest("[data-style]");

      save(); favStyle.setAttribute("aria-pressed", String(isFavStyle(sid)));

    if (e.target.closest("[data-sty-recipes]")) { const h3 = $("sty-recipes"); if (h3) h3.scrollIntoView({ behavior: "smooth", block: "start" }); }

  function openCatalog() {
    openSheet(catalogHtml()); bindSearch();
    if (catState.tab === "recipes") ensureRecipeLists().then(() => { if (sheet.open && sheet.querySelector(".tabs2")) renderCatalog(); })
      .catch((e) => { if (sheet.open) $("cat-body").innerHTML = `<p class="hint">${escapeHtml(t("rc.loadError", { message: e.message }))}</p>`; });

    return `<div class="top-line"><h2>${escapeHtml(t("catalog.guide"))}</h2>${closeBtn}</div>
      <div class="tabs2" role="group">${tabs}</div>
      <input class="cat-search" type="search" value="${escapeHtml(catState.q)}" placeholder="${escapeHtml(t(catState.tab === "recipes" ? "rc.search" : "catalog.search"))}" autocomplete="off">
      <div id="cat-body">${body}</div>`;
  }

  // Карточка стиля: шапка в цвете пива с бокалом, диапазоны стиля шкалами с отметкой партии,
  // советы, рецепты этого стиля, ссылки; кнопки — внизу.
  const HERO = {
    pale: { bg: "linear-gradient(160deg,#f6e3a0,#e8c55c 60%,#d9ad3c)", ink: "#3a2a08", sub: "#6b4a0c", beer: "#e2a733" },
    amber: { bg: "linear-gradient(160deg,#e7a35a,#c4782a 60%,#9c5a1c)", ink: "#2e1704", sub: "#4f2c0b", beer: "#b8651f" },
    dark: { bg: "linear-gradient(160deg,#6a3a1c,#3a1e10)", ink: "#fff", sub: "#f3d9b0", beer: "#1c0e08" },
  };
  const glassSvg = (beer, dark) => `<svg class="sty-glass" viewBox="0 0 56 78" aria-hidden="true"><path d="M8 4h40l-4 66a5 5 0 0 1-5 4H17a5 5 0 0 1-5-4z" fill="rgba(255,255,255,${dark ? .12 : .35})" stroke="${dark ? "rgba(255,230,190,.6)" : "rgba(90,60,8,.55)"}" stroke-width="2"/><path d="M11 20h34l-3 48a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3z" fill="${beer}"/><path d="M8 4h40v14c-6 4-34 4-40 0z" fill="${dark ? "#efdcb8" : "#fffaf0"}"/></svg>`;
  const TIP_ICONS = ["🧫", "🌡️", "⏱️", "🍺"];
  const isFavStyle = (id) => (cfg.favStyles || []).includes(id);
  // Шкала диапазона стиля: зона нормы и отметка партии (зелёная — в норме с допуском, красная — нет).
  function styleBar(title, r, pad, unit, mark, markText, tol) {
    const a = r[0] - pad, b = r[1] + pad, L = (v) => Math.max(1, Math.min(99, (v - a) / (b - a) * 100));
    const ok = mark == null || (mark >= r[0] - tol && mark <= r[1] + tol);
    const m = mark == null ? "" : `<i class="m${ok ? "" : " bad"}" style="left:${L(mark)}%"><em>${escapeHtml(markText)}</em></i>`;
    return `<div class="sty-rng"><div class="hd"><span>${escapeHtml(title)}</span><b>${rangeText(r)}${unit}</b></div>
      <div class="sty-bar${mark == null ? "" : " has-m"}"><i class="z" style="left:${L(r[0])}%;width:${L(r[1]) - L(r[0])}%"></i>${m}</div>
      <div class="ends"><span>${fmtMax1(Math.round(a * 10) / 10)}</span><span>${fmtMax1(Math.round(b * 10) / 10)}</span></div></div>`;
  }
  function openStyle(id, fromCatalog = false) {
    const x = Brew.byId[id];
    if (!x) return;
    const lang = I18N.lang();
    const name = x.name[lang] || x.name.en;
    const st = cur();
    const isCurrent = !!(view && view.st && view.st.style === id);
    const colour = StyleGuide.colour(id), h = HERO[colour] || HERO.pale;
    // Отметки партии — по её данным, если партия идёт
    const marks = {};
    if (view && view.hasBatch) {
      const a = view.a;
      if (view.og != null) {
        marks.og = view.og;
        const fg = view.st.fg ?? (x.fg[0] + x.fg[1]) / 2;
        marks.fg = fg; marks.abv = Brew.abv(view.og, fg);
      }
      const tc = a.temp.stats && a.temp.stats.last;
      if (tc != null) marks.t = tc;
    }
    const hasMarks = Object.keys(marks).length > 0;
    const pills = [t("sheet.yeast." + x.yeast), t("sty.colour." + colour), isCurrent ? "✓ " + t("sty.batchStyle") : null].filter(Boolean)
      .map((p) => `<span class="pill">${escapeHtml(p)}</span>`).join("");
    const bars = styleBar(t("sheet.ferment"), x.t, 4, " °C", marks.t, marks.t != null ? fmt(marks.t, 1) : "", 0.5) +
      styleBar(t("sheet.og"), x.og, 2, " °P", marks.og, marks.og != null ? fmt(marks.og, 1) : "", 0.5) +
      styleBar(t("sheet.fg"), x.fg, 1.5, " °P", marks.fg, marks.fg != null ? "≈" + fmt(marks.fg, 1) : "", 0.5) +
      styleBar(t("sheet.abv"), x.abv, 1.5, "%", marks.abv, marks.abv != null ? "→" + fmt(marks.abv, 1) : "", 0.3);
    const tips = StyleGuide.tips(x.yeast, lang).map((tip, i) => `<div class="sty-tip"><span class="ic">${TIP_ICONS[i % TIP_ICONS.length]}</span><span>${escapeHtml(tip)}</span></div>`).join("");
    const recs = recipeItems().filter((r) => r.style === id);
    const recRows = recs.map((r) => `<li class="rc-item">
        <button type="button" class="rc-open" data-recipe="${r.ref}"><i class="ebc" style="background:${ebcColour(r.ebc)}"></i>
          <span><b>${escapeHtml(rloc(r.name))}</b>${r.mine ? ` <span class="tag">${escapeHtml(t("rc.mineTag"))}</span>` : ""}
          <small>${escapeHtml([`${fmt(r.og, 1)} → ${fmt(r.fg, 1)} °P`, r.abv != null ? fmt(r.abv, 1) + " %" : null, r.ibu != null ? r.ibu + " IBU" : null].filter(Boolean).join(" · "))}</small></span></button>
        <button type="button" class="star" data-fav="${r.ref}" aria-pressed="${isFav(r.ref)}" aria-label="${escapeHtml(t("rc.fav"))}">★</button></li>`).join("");
    let action = "";
    if (st && view && view.hasBatch && !isCurrent) action = `<button type="button" class="main" data-choose="${id}">${escapeHtml(t("sheet.choose"))}</button>`;
    else if (st && view && !view.hasBatch) action = `<button type="button" class="main" data-choose="${id}">${escapeHtml(t("sheet.startWith"))}</button>`;
    const foot = action || recs.length ? `<div class="rc-foot">${recs.length ? `<button type="button" data-sty-recipes>${escapeHtml(t("sty.recipesN", { n: recs.length }))}</button>` : ""}${action}</div>` : "";
    openSheet(`<div class="sty-hero" style="background:${h.bg};color:${h.ink}">
        <div class="top-line">${fromCatalog ? `<button class="back" type="button" data-back style="color:${h.sub}">← ${escapeHtml(t("act.catalog"))}</button>` : ""}
          <button type="button" class="star big" data-fav-style="${id}" aria-pressed="${isFavStyle(id)}" aria-label="${escapeHtml(t("rc.fav"))}">★</button>
          <button class="x" type="button" data-close aria-label="${escapeHtml(t("sheet.close"))}" style="color:${h.sub}">×</button></div>
        <h2>${escapeHtml(name)}</h2>
        <div class="sub" style="color:${h.sub}">${escapeHtml([x.name.en !== name ? x.name.en : null, "BJCP " + StyleGuide.code(id)].filter(Boolean).join(" · "))}</div>
        <div class="pills">${pills}</div>${glassSvg(h.beer, colour === "dark")}</div>
      <p>${escapeHtml(StyleGuide.desc(id, lang))}</p>
      ${hasMarks ? `<div class="sty-leg"><span><i class="z"></i>${escapeHtml(t("sty.range"))}</span><span><i class="m"></i>${escapeHtml(t("sheet.yourBatch"))}</span></div>` : ""}
      <div class="sty-bars">${bars}</div>
      <h3>${escapeHtml(t("sheet.tips"))}</h3>
      <div class="sty-tips">${tips}</div>
      ${recs.length ? `<h3 id="sty-recipes">${escapeHtml(t("sty.recipes"))}</h3><ul class="rc-list">${recRows}</ul>` : ""}
      <div class="sty-links"><a href="${StyleGuide.wikiUrl(name, lang)}" target="_blank" rel="noopener">${escapeHtml(t("sheet.wiki"))} ${ACT_ICONS.ext}</a>
        <a href="${StyleGuide.bjcpUrl(x.name.en)}" target="_blank" rel="noopener">BJCP ${escapeHtml(StyleGuide.code(id))} ${ACT_ICONS.ext}</a></div>
      ${foot}`);
    // Рецепты стиля ещё не загружены — догружаем и перерисовываем карточку.
    if (!recipes.lib) ensureRecipeLists().then(() => { if (sheet.open && sheet.querySelector(`[data-fav-style="${id}"]`)) openStyle(id, fromCatalog); }).catch(() => {});
  }

  // Выбрать стиль: для идущей партии — сохранить сразу, без партии — открыть «Новая партия» с этим стилем.
  async function chooseStyle(id) {
    const st = cur();
    if (!st) return;
    if (view && view.hasBatch) {
      try { await postBatch(st, { style: id }); }
      catch (e) { notice(escapeHtml(t("err.batch", { message: e.message })), "error"); return; }
      sheet.close(); refresh();
    } else {
      sheet.close(); openBatchDialog(id);
    }
  }

  // ---------- Рецепты ----------
  // Библиотека — файлы recipes/ (их кэширует service worker, работают офлайн), свои — на сервере у стика.
  // Ссылка на рецепт: lib:<id> или my:<id>. Избранное хранится в этом браузере.
  const recipes = { lib: null, my: {}, full: {} };
  const rloc = (v) => Recipe.loc(v, I18N.lang());
  const recipeKey = (ref, st = cur()) => ref.startsWith("my:") ? `${st ? st.id : ""}|${ref}` : ref;
  async function loadLib() {
    if (!recipes.lib) {
      const res = await fetch("recipes/index.json");
      if (!res.ok) throw new Error(String(res.status));
      recipes.lib = await res.json();
    }
    return recipes.lib;
  }
  async function loadMine(st, force = false) {
    if (!st || !apiBase()) return [];
    if (!force && recipes.my[st.id]) return recipes.my[st.id];
    const data = await api("/api/recipes", {}, st.access);
    recipes.my[st.id] = data.recipes || [];
    return recipes.my[st.id];
  }
  async function loadRecipe(ref, st = cur()) {
    const key = recipeKey(ref, st);
    if (recipes.full[key]) return recipes.full[key];
    const [src, id] = ref.split(":");
    let r;
    if (src === "lib") {
      const res = await fetch(`recipes/${id}.json`);
      if (!res.ok) throw new Error(String(res.status));
      r = await res.json();
    } else {
      r = await api("/api/recipes/" + encodeURIComponent(id), {}, st.access);
    }
    recipes.full[key] = r;
    return r;
  }
  async function apiSend(method, path, body, st = cur()) {
    const res = await fetch(apiBase() + path, {
      method, headers: { "Content-Type": "application/json", "X-Access": st.access },
      body: body == null ? undefined : JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || String(res.status));
    return data;
  }
  // Привязать рецепт к партии: стиль, цель КП и норма температуры — из рецепта.
  const recipeBatch = (ref, r) => ({ recipe: ref, style: Brew.byId[r.style] ? r.style : null, fg: r.fg, range: Recipe.range(r) });

  // Избранное: свои рецепты — отдельно для каждого стика.
  const favKey = (ref) => ref.startsWith("my:") ? `${ref}@${cur() ? cur().id : ""}` : ref;
  const isFav = (ref) => (cfg.favs || []).includes(favKey(ref));
  function toggleFav(ref) {
    const k = favKey(ref), favs = cfg.favs || [];
    cfg.favs = favs.includes(k) ? favs.filter((x) => x !== k) : favs.concat(k);
    save();
  }

  // Цвет пива по EBC — для полоски в списке.
  function ebcColour(ebc) {
    const stops = [[5, "#f1dc7c"], [9, "#e8c55c"], [14, "#dca443"], [22, "#c9862e"], [35, "#a45a22"], [55, "#6b3419"], [Infinity, "#2b1810"]];
    return stops.find(([e]) => (ebc ?? 10) <= e)[1];
  }
  const fmtKg = (kg) => kg < 1 ? `${fmtMax1(Math.round(kg * 1000))} ${t("u.g")}` : `${(Math.round(kg * 100) / 100).toLocaleString(I18N.locale())} ${t("u.kg")}`;
  const fmtG = (g) => g >= 1000 ? fmtKg(g / 1000) : `${fmtMax1(g >= 20 ? Math.round(g) : Math.round(g * 10) / 10)} ${t("u.g")}`;
  const fmtL = (l) => `${fmtMax1(Math.round(l * 2) / 2)} ${t("u.l")}`;
  const untilText = (u) => u.stage ? t("rc.until.stage", { stage: t("stage." + u.stage) })
    : u.plato != null ? t("rc.until.plato", { p: fmtMax1(u.plato) }) : t("rc.until.days", { n: u.days });
  const tempText = (r) => r[0] === r[1] ? `${fmtMax1(r[0])} °C` : `${fmtMax1(r[0])}–${fmtMax1(r[1])} °C`;
  function hopUse(h) {

  // ----- Сахар для розлива -----

  function primingHtml(id, p, tcNote) {

  function updatePrime(box) {
    const v = (n) => parseFloat(String(box.querySelector(`[name=${n}]`).value).replace(",", "."));
    const liters = v("liters"), vol = v("vol"), tc = v("tc"), sugar = box.querySelector("[name=sugar]").value;
    const ok = [liters, vol, tc].every(Number.isFinite);
    const p = ok ? Recipe.priming({ vol, tc, liters, sugar }) : null;
    const other = ok ? Recipe.priming({ vol, tc, liters, sugar: sugar === "dextrose" ? "sucrose" : "dextrose" }) : null;
    const set = (k, s) => { box.querySelector(`[data-pr="${k}"]`).textContent = s; };
    set("what", t("prime.what", { sugar: t("prime." + sugar).toLowerCase() }));
    set("total", p ? `${Math.round(p.total)} ${t("u.g")}` : "–");
    set("basis", p ? t("prime.basis", { l: fmtMax1(liters), v: fmtMax1(vol), tc: fmtMax1(tc), perL: fmt(p.perL, 1) }) : "");
    box.querySelectorAll("[data-pr-b]").forEach((el) => { el.textContent = p ? `${fmt(p.bottle(Number(el.dataset.prB)), 1)} ${t("u.g")}` : "–"; });

    set("warn", warn.join(" "));
    box.querySelector('[data-pr="warn"]').classList.toggle("bad", !!(p && p.thick));
    if (box.dataset.prime === "batch" && cur()) {

    }

  // Карточка «Розлив» на главной: объём — из рецепта (минус литр на осадок), газация — из рецепта или

  function batchPrimingHtml(rows, a, recipe, style, st, now) {
    const checking = (a.stages || []).find((x) => x.id === "checking");
    const from = Math.min(now - 48 * 3600e3, checking ? checking.from : Infinity);

  // ----- День варки -----
  // Состояние — в этом браузере: рецепт, объём, отмеченные шаги и таймер {i, end | left}.

  const setBrew = (st, b) => { try { b ? localStorage.setItem(brewKey(st), JSON.stringify(b)) : localStorage.removeItem(brewKey(st)); } catch { /* приватный режим */ } };

    const k = liters / r.batch_l, w = r.water || {}, S = [];

      .concat((r.other || []).filter((x) => x.use === "mash").map((x) => `${rloc(x.name)} ${fmtG(x.g * k)}`));
    if (grist.length) S.push({ title: mash.length ? t("brew.mashIn", { temp: fmtMax1(mash[0].temp) }) : t("brew.mashInPlain"), sub: grist.join(", ") });
    mash.forEach((m) => S.push({ title: t("brew.rest", { temp: fmtMax1(m.temp), min: m.min }), sub: "", min: m.min }));
    if (mash.length || w.sparge_l) S.push({ title: t("brew.sparge"), sub: w.preboil_l ? t("brew.preboil", { l: fmtL(w.preboil_l * k) }) : "" });
    const adds = (r.hops || []).filter((x) => x.use === "boil" || x.use === "first_wort").map((x) => ({ min: x.use === "first_wort" ? r.boil_min || 60 : x.min ?? 0, text: `${x.name} ${fmtG(x.g * k)}` }))
      .concat((r.fermentables || []).filter((x) => x.use === "boil").map((x) => ({ min: x.min ?? 0, text: `${rloc(x.name)} ${fmtKg(x.kg * k)}` })))
      .concat((r.other || []).filter((x) => x.use === "boil").map((x) => ({ min: x.min ?? 0, text: `${rloc(x.name)}${x.g != null ? " " + fmtG(x.g * k) : ""}` })))
      .sort((p, q) => q.min - p.min);

  const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return `${h ? h + ":" + String(m).padStart(2, "0") : m}:${String(s % 60).padStart(2, "0")}`; };
  const timerLeft = (tm) => tm.end ? tm.end - Date.now() : tm.left;
  async function startBrew(ref, liters) {
    const st = cur();
    if (!st) return;
    let r;
    try { r = await loadRecipe(ref); } catch (e) { notice(escapeHtml(t("rc.loadError", { message: e.message })), "error"); return; }
    const old = getBrew(st);
    if (old && (old.ref !== ref || old.liters !== liters) && old.done.length && !confirm(t("brew.replace", { name: old.name }))) { openBrew(); return; }
    if (!old || old.ref !== ref || old.liters !== liters) setBrew(st, { ref, liters: liters || r.batch_l, name: rloc(r.name), done: [], timer: null, started: Date.now() });
    openBrew();
  }
  let brewView = null; // { b, r, steps }
  async function openBrew() {
    const st = cur(), b = getBrew(st);
    if (!b) return;
    let r;
    try { r = await loadRecipe(b.ref); } catch (e) { notice(escapeHtml(t("rc.loadError", { message: e.message })), "error"); return; }
    brewView = { b, r, steps: brewSteps(r, b.liters) };
