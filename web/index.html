<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beer iSpindel</title>
<meta name="description" content="Gravity, temperature and battery from an iSpindel while the beer ferments.">
<meta name="theme-color" content="#eef1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131715" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beer iSpindel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="vendor/chart-4.4.1.umd.min.js"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="analysis.js"></script>
<script src="styles.js"></script>
<script src="recipe.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #eef1ec;
  --surface: #f8faf6;
  --ink: #1e2522;
  --muted: #5e6a64;
  --rule: #cfd6cf;
  --amber: #c9861a;
  --amber-soft: rgba(201, 134, 26, .18);
  --amber-deep: #8a5a0f;
  --teal: #2f6f73;
  --violet: #7a4fa3;
  --alert: #b4412c;
  --ok: #3f7a4a;
  --glass: rgba(255, 255, 255, .55);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #131715;
    --surface: #1b201d;
    --ink: #e6ebe7;
    --muted: #94a199;
    --rule: #2e3631;
    --amber: #e3a43a;
    --amber-soft: rgba(227, 164, 58, .2);
    --amber-deep: #f0c070;
    --teal: #6bb3b6;
    --violet: #b48ed8;
    --alert: #e0735c;
    --ok: #7fbf8a;
    --glass: rgba(255, 255, 255, .06);
  }
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
}
main { max-width: 980px; margin: 0 auto; padding: 20px 20px 48px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* Шапка */
.top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { font: 600 28px/1.1 var(--display); margin: 0; letter-spacing: .01em; min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top h1 select { max-width: 100%; }
.seen-row { display: flex; align-items: center; gap: 4px; min-height: 32px; }
.icon-btn.round {
  display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0; flex: none;
  border: 0; border-radius: 50%; background: transparent; color: var(--muted);
}
.icon-btn.round.small { width: 32px; height: 32px; }
.icon-btn.round:hover { background: var(--surface); color: var(--ink); }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .icon-btn.spin svg { animation: none; opacity: .5; } }
.top h1 select {
  font: 600 28px/1.1 var(--display); border: 0; background: transparent; padding: 0; cursor: pointer;
}
.top-actions select.icon-btn { padding: 6px 8px; }
.seen { color: var(--muted); font-size: 15px; }
.seen.stale { color: var(--alert); }
.top-actions { display: flex; gap: 8px; align-items: center; flex: none; }
.icon-btn {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; font-size: 15px;
}
.icon-btn:hover { border-color: var(--muted); }

/* Главная плашка: две одинаковые плитки — плотность (с алкоголем) и температура.
   Цвет каждой — по своему показателю: зелёный в норме, жёлтый у границы, красный — проблема. */
.hero { margin-top: 16px; display: grid; gap: 10px; }
.band { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile {
  display: flex; flex-direction: column; gap: 6px; min-width: 0; border-radius: 18px; padding: 12px 13px; color: #fff;
  background: linear-gradient(140deg, #8f9b94, #67746c);
}
.tile.good { background: linear-gradient(140deg, #4f9a5b, #2f6f45); }
.tile.warn { background: linear-gradient(140deg, #d99a2b, #b4740f); }
.tile.bad { background: linear-gradient(140deg, #c95a3f, #9b3220); }
.band button { border: 0; background: none; color: inherit; padding: 0; text-align: left; cursor: pointer; display: grid; gap: 5px; align-content: start; border-radius: 10px; font: inherit; min-width: 0; }
.band button.tile { display: flex; padding: 12px 13px; border-radius: 18px; color: #fff; }
.band button:focus-visible { outline-color: #fff; }
.band-label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; opacity: .92; }
.band-label svg { width: 22px; height: 22px; }
.band-label { width: 100%; }
.band .trend { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: rgba(255, 255, 255, .2); }
.band .trend:empty { display: none; }
.band .trend svg { width: 18px; height: 18px; }
.band .big { font: 500 clamp(44px, 13.5vw, 66px)/.9 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.band .big small { font-size: .36em; margin-left: 3px; opacity: .85; }
.band .sub { font-size: 12.5px; opacity: .92; }
.band .bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .3); overflow: hidden; }
.band .bar i { display: block; height: 100%; background: #fff; border-radius: 3px; }
.band .scale { position: relative; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .3); margin-top: 4px; }
.band .scale .zone { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: rgba(255, 255, 255, .6); }
.band .scale .mark { position: absolute; top: -4px; width: 4px; height: 14px; border-radius: 2px; background: #fff; transform: translateX(-50%); box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .25); }
.band .scale-l { display: flex; justify-content: space-between; font-size: 12px; opacity: .92; }
.band .msg { font-size: 12.5px; background: rgba(0, 0, 0, .14); border-radius: 8px; padding: 4px 7px; }
.band-g { flex: 1; }
.band-abv { gap: 2px !important; margin-top: auto; border-top: 1px solid rgba(255, 255, 255, .3); padding-top: 6px !important; border-radius: 0 !important; }
.band-abv span { font-size: 12.5px; opacity: .92; }
.band-abv b { font: 600 24px/1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.band-abv b small { font: 500 13px var(--body); opacity: .9; margin-left: 4px; }
.band-abv { position: relative; }
.band-abv.bad::after {
  content: "!"; position: absolute; top: -9px; right: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--alert); color: #fff;
  font: 700 12px/18px var(--body); text-align: center; box-shadow: 0 0 0 2px #fff;
}

/* Уведомления: колокольчик в шапке, журнал, вкладка включения */
.icon-btn.bell { position: relative; }
.icon-btn.bell.has-new { color: var(--alert); border-color: color-mix(in srgb, var(--alert) 45%, var(--rule)); }
.icon-btn.bell .badge {
  position: absolute; top: -4px; right: -4px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
  background: var(--alert); color: #fff; font: 700 11.5px/19px var(--body); text-align: center; box-shadow: 0 0 0 2px var(--bg);
}
.alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.alerts .day { font: 600 12px/1 var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 8px 2px 0; }
.alerts .ev { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 10px; border-radius: 12px; background: var(--bg); border: 1px solid var(--rule); }
.alerts .ev.new { border-color: color-mix(in srgb, var(--alert) 40%, var(--rule)); background: color-mix(in srgb, var(--alert) 5%, var(--bg)); }
.alerts .ic { grid-row: 1 / 3; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; }
.alerts .ic svg { width: 20px; height: 20px; }
.alerts .ic.bad { background: var(--alert); } .alerts .ic.warn { background: var(--amber); } .alerts .ic.ok { background: var(--ok); } .alerts .ic.info { background: var(--teal); }
.alerts b { font-size: 14.5px; }
.alerts .t { font-size: 12px; color: var(--muted); white-space: nowrap; }
.alerts small { grid-column: 2 / 4; color: var(--muted); font-size: 13px; }
.alerts .dotnew { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--alert); margin-left: 6px; vertical-align: middle; }
.sheet .link { border: 0; background: none; color: var(--teal); font-weight: 600; font-size: 14px; cursor: pointer; padding: 4px 0; }
/* Вкладки стика: пять равных колонок, иконка и короткая подпись */
.seg.seg5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; }
.seg.seg5 button { display: grid; justify-items: center; gap: 2px; padding: 6px 0 5px; font: 600 11px/1.1 var(--body); min-width: 0; }
.seg.seg5 button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg.seg5 svg { width: 19px; height: 19px; }
.seg.seg5 button[aria-pressed="true"] { color: var(--amber-deep); }
.push-off { justify-items: center; text-align: center; }
.push-off b { font: 600 19px/1.2 var(--display); }
.push-off button { width: 100%; }
.push-bell { width: 58px; height: 58px; border-radius: 18px; background: var(--amber-soft); color: var(--amber); display: flex; align-items: center; justify-content: center; }
.push-steps { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.push-status { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.push-status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
label.sw-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink); cursor: pointer; }
.sw-row span { display: grid; gap: 1px; min-width: 0; }
.sw-row b { font-weight: 500; font-size: 14.5px; }
.sw-row small { color: var(--muted); font-size: 12.5px; }
input.switch { appearance: none; -webkit-appearance: none; flex: none; width: 42px; height: 25px; border-radius: 13px; background: var(--rule); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
input.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: left .15s; }
input.switch:checked { background: var(--ok); }
input.switch:checked::after { left: 20px; }
.push .note:empty { display: none; }

/* Демо: пока не добавлено ни одного iSpindel */
.demo { margin-top: 14px; display: grid; gap: 8px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px dashed var(--amber); }
.demo-head { display: flex; align-items: center; gap: 8px; }
.demo-tag { font: 700 12px/1 var(--body); letter-spacing: .08em; color: #fff; background: var(--amber); border-radius: 6px; padding: 4px 7px; }
.demo p, .demo ul { margin: 0; font-size: 14px; color: var(--muted); }
.demo ul { padding-left: 18px; display: grid; gap: 4px; }
.demo button { justify-self: start; }
body.is-demo .hero, body.is-demo .charts { position: relative; }
body.is-demo .hero::before, body.is-demo .charts::before {
  content: attr(data-demo); position: absolute; z-index: 2; top: -9px; left: 50%; transform: translateX(-50%);
  font: 700 11px/1 var(--body); letter-spacing: .2em; color: #fff; background: var(--amber); border-radius: 6px; padding: 4px 8px; pointer-events: none;
}

/* Значки показателей */
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.chip {
  display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 0;
  border: 1px solid var(--rule); background: var(--surface); border-radius: 12px; padding: 8px 4px; cursor: pointer;
  font: 600 17px/1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip svg { width: 22px; height: 22px; flex: none; }
.chip:hover { border-color: var(--muted); }
/* Уровень: зелёный — в норме с запасом, жёлтый — у границы, красный — за пределами */
.chip.good { border-color: color-mix(in srgb, var(--ok) 55%, var(--rule)); background: color-mix(in srgb, var(--ok) 7%, var(--surface)); }
.chip.good svg { color: var(--ok) !important; }
.chip.warn { border-color: var(--amber); color: var(--amber-deep); background: color-mix(in srgb, var(--amber) 10%, var(--surface)); }
.chip.warn svg { color: var(--amber) !important; }
.chip.bad { border-color: var(--alert); color: var(--alert); background: color-mix(in srgb, var(--alert) 8%, var(--surface)); }
.chip.bad svg { color: var(--alert) !important; }

/* Информационная панель брожения */
.info { background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--muted); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.info.ok { border-left-color: var(--ok); } .info.ok b { color: var(--ok); }
.info.idle { border-left-color: var(--amber); } .info.idle b { color: var(--amber-deep); }
.info.bad { border-left-color: var(--alert); } .info.bad b { color: var(--alert); }
.info .row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; color: var(--muted); font-size: 13px; }

/* Панель партии */
.batchp { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
.batchp h3 { margin: 0; font: 600 18px/1.2 var(--display); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.batchp h3 small { font: 400 13px var(--body); color: var(--muted); }
.batchp .style { color: var(--muted); font-size: 13px; margin-top: 2px; }
.prog { display: block; height: 10px; border-radius: 5px; background: var(--rule); position: relative; margin: 12px 0 6px; overflow: hidden; }
.prog i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #d99a2b, #b8741a); border-radius: 5px; }
/* Стадии над шкалой партии */
.stages { display: block; width: 100%; border: 0; background: none; padding: 0; margin: 10px 0 0; cursor: pointer; text-align: left; font: inherit; color: inherit; position: relative; }
.st-labels { display: block; position: relative; height: 16px; font-size: 11.5px; color: var(--muted); }
.st-labels span { position: absolute; top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
.st-labels span.end { text-align: right; padding: 0; }
.st-labels span.cur { color: var(--amber-deep); font-weight: 700; overflow: visible; z-index: 1; }
.stages .prog { margin: 4px 0 6px; overflow: visible; }
.stages .prog i:first-child { border-radius: 5px; }
.stages .prog i.tick { top: -5px; bottom: -3px; width: 0; border-left: 2px solid var(--muted); background: none; border-radius: 0; }
.stages .prog i.tick.exp { border-left-style: dashed; border-left-width: 1.5px; opacity: .7; }
.st-alarm { position: absolute; top: 14px; right: 0; font: 700 11px/1 var(--body); color: #fff; border-radius: 6px; padding: 3px 7px; }
.st-alarm.bad { background: var(--alert); } .st-alarm.warn { background: var(--amber); }
.st-now { margin: 6px 0 0; font-size: 14px; font-weight: 600; color: var(--amber-deep); }
.st-tip { margin: 2px 0 8px; font-size: 13px; color: var(--muted); }
.st-alarm-text { margin: 6px 0 0; font-size: 13px; padding: 6px 9px; border-radius: 8px; }
.st-alarm-text.bad { background: color-mix(in srgb, var(--alert) 12%, transparent); color: var(--alert); }
.st-alarm-text.warn { background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber-deep); }
.stage-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.stage-list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 11px; border-radius: 10px; background: var(--bg); border: 1px solid var(--rule); font-size: 14px; }
.stage-list li span { color: var(--muted); text-align: right; }
.stage-list li.cur { border-color: var(--amber); }
.stage-list li.cur b { color: var(--amber-deep); }
.stage-list li { flex-wrap: wrap; }
.stage-list .sl { min-width: 0; }
.stage-list .manual { display: block; font-size: 12px; color: var(--muted); }
.stage-list .manual .link { font-size: 12px; }
.stage-done { flex-basis: 100%; margin-top: 4px; padding: 9px 10px; border-radius: 9px; border: 0; background: var(--amber); color: #fff; font-size: 14.5px; font-weight: 600; cursor: pointer; }
.stage-done:disabled { opacity: .7; }
.stage-list li.next { background: transparent; border-style: dashed; }
.stage-list li.next b { font-weight: 500; color: var(--muted); }
@media (max-width: 380px) { .st-labels span:not(.cur) { visibility: hidden !important; } }
.scale { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.kv { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; }
.kv div { display: grid; }
.kv small { font-size: 12px; color: var(--muted); }
.kv b { font: 600 21px/1.15 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.eta { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.eta b { color: var(--ink); }
.batchp .hint { color: var(--muted); font-size: 14px; margin: 0; }
.batchp button.act {
  margin-top: 10px; padding: 8px 14px; border: 1px solid var(--amber); border-radius: 8px;
  background: transparent; color: var(--amber-deep); font-size: 15px; font-weight: 600; cursor: pointer;
}
.batchp button.act:hover { background: var(--amber-soft); }

/* Панель действий партии */
.actbar { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin: 12px -12px -12px; border-top: 1px solid var(--rule); }
.actbar button {
  display: grid; justify-items: center; gap: 3px; padding: 9px 4px; border: 0; background: none; cursor: pointer;
  font-size: 13px; color: var(--ink); line-height: 1.2;
}
.actbar button + button { border-left: 1px solid var(--rule); }
.actbar button.main { color: var(--amber-deep); font-weight: 600; }
.actbar button:hover { background: var(--amber-soft); }
.actbar button:first-child { border-bottom-left-radius: 12px; } .actbar button:last-child { border-bottom-right-radius: 12px; }
.actbar svg { width: 20px; height: 20px; }
.ai-actions > * + * { border-top: 1px solid var(--rule); }
.ai-actions .set-row .t b { white-space: normal; }
.set-row.danger-row b { color: var(--alert); }
.ok-chip:empty { display: none; }
.ok-chip { font: 600 12px var(--body); border-radius: 999px; padding: 2px 9px; background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); white-space: nowrap; }
.ok-chip.bad { background: color-mix(in srgb, var(--alert) 13%, transparent); color: var(--alert); }
.ai-close { width: 100%; margin-top: 8px; }
/* Заголовок чата остаётся сверху при прокрутке листа */
.sheet .ai-head { position: sticky; top: -10px; z-index: 3; margin: 0 -16px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.actbar button.ai { color: var(--violet); font-weight: 600; background: color-mix(in srgb, var(--violet) 9%, transparent); }
/* AI-чат партии */
.ai-count { font: 600 12px var(--body); border-radius: 999px; padding: 3px 9px; background: color-mix(in srgb, var(--violet) 13%, transparent); color: var(--violet); white-space: nowrap; }
.ai-count.low { background: color-mix(in srgb, var(--alert) 13%, transparent); color: var(--alert); }
.ai-thread { display: grid; gap: 8px; margin: 8px 0; }
.ai-thread .q { justify-self: end; max-width: 85%; background: var(--violet); color: #fff; border-radius: 14px 14px 4px 14px; padding: 7px 11px; font-size: 14.5px; white-space: pre-wrap; }
.ai-thread .a { justify-self: start; max-width: 92%; background: var(--bg); border: 1px solid var(--rule); border-radius: 14px 14px 14px 4px; padding: 8px 11px; font-size: 14.5px; white-space: pre-wrap; }
.ai-thread small { display: block; font-size: 11px; opacity: .72; margin-top: 3px; }
.ai-thread .who { display: inline-flex; align-items: center; gap: 4px; font: 600 11.5px var(--body); color: var(--violet); }
.ai-thread .who svg { width: 14px; height: 14px; }
.ai-thread .a.wait { color: var(--muted); font-style: italic; }
.ai-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.ai-chips button { font-size: 13px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; }
.ai-ask { display: flex; gap: 6px; align-items: flex-end; border: 1px solid var(--rule); background: var(--surface); border-radius: 12px; padding: 6px; }
.ai-ask textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; font: inherit; color: var(--ink); padding: 6px; max-height: 120px; }
.ai-ask textarea:focus { outline: none; }
.ai-ask button { flex: none; width: 38px; height: 38px; border-radius: 10px; border: 0; background: var(--violet); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.ai-ask button:disabled { opacity: .5; }
.ai-foot { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.ai-note { text-align: center; font-size: 13.5px; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 10px; }

/* Карточка стиля и справочник — лист снизу */
dialog.sheet {
  margin: auto auto 0; width: min(560px, 100%); max-width: 100%; max-height: 88vh; overflow: auto;
  border-radius: 18px 18px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px));
}
dialog.sheet::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--rule); margin: 0 auto 10px; }
@media (prefers-reduced-motion: no-preference) {
  dialog.sheet[open] { animation: sheet-in .28s cubic-bezier(.2, .7, .2, 1); }
  @keyframes sheet-in { from { transform: translateY(40px); opacity: .4; } }
}
.sheet .top-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.sheet .back, .sheet .x { border: 0; background: none; color: var(--amber-deep); font-size: 14px; cursor: pointer; padding: 4px 0; }
.sheet .x { color: var(--muted); font-size: 22px; line-height: 1; margin-left: auto; }
.sheet h2 { font: 600 26px/1.1 var(--display); margin: 0; }
.sheet .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.sheet p { font-size: 15px; margin: 10px 0; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
.facts div { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.facts small { display: block; font-size: 12px; color: var(--muted); }
.facts b { font: 600 19px/1.2 var(--display); }
.cmp { font-size: 13px; color: var(--muted); margin: 8px 0; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.cmp .okk { color: var(--ok); font-weight: 600; } .cmp .out { color: var(--alert); font-weight: 600; }
.sheet h3 { font: 600 17px/1.2 var(--display); margin: 12px 0 4px; }
.tips { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 4px; }
.sheet .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.sheet .btns a, .sheet .btns button {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-size: 15px; font-weight: 600;
  border: 1px solid var(--rule); background: transparent; color: var(--ink); text-decoration: none; cursor: pointer;
}
.sheet .btns .main { border-color: var(--amber); background: var(--amber); color: #fff; }
.sheet .btns svg { width: 16px; height: 16px; }
.current-mark { display: inline-block; font-size: 12px; color: var(--ok); font-weight: 600; margin-top: 4px; }
.cat-search { width: 100%; border: 1px solid var(--rule); border-radius: 10px; padding: 9px 12px; background: var(--bg); color: var(--ink); font-size: 15px; margin: 10px 0 8px; }
.cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.cats button { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; cursor: pointer; color: var(--ink); }
.cats button[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: #fff; }
.cat-list { list-style: none; margin: 0; padding: 0; }
.cat-list button {
  width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 0;
  border: 0; border-top: 1px solid var(--rule); background: none; cursor: pointer; text-align: left; color: var(--ink); font-size: 15px;
}
.cat-list small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.cat-list .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.cat-list .cur { color: var(--ok); font-weight: 600; }

/* Справочник: вкладки «Стили | Рецепты», список рецептов, карточка, день варки, розлив */
.tabs2 { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; background: var(--bg); border-radius: 10px; margin: 8px 0 2px; }
.tabs2 button { border: 0; border-radius: 8px; padding: 7px 6px; background: transparent; color: var(--muted); font-size: 14.5px; font-weight: 600; cursor: pointer; }
.tabs2 button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.rc-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; }
.rc-item { display: flex; align-items: stretch; background: var(--bg); border-radius: 12px; border: 1px solid var(--rule); }
.rc-open { flex: 1; min-width: 0; display: flex; gap: 10px; align-items: stretch; border: 0; background: none; padding: 10px 4px 10px 10px; text-align: left; color: var(--ink); cursor: pointer; font-size: 15px; }
.rc-open > span { min-width: 0; }
.rc-open b { font-weight: 600; }
.rc-open small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; margin-top: 2px; }
.rc-open .cur { color: var(--ok); font-weight: 600; }
.ebc { flex: none; width: 8px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.star { flex: none; border: 0; background: none; font-size: 21px; line-height: 1; padding: 6px 12px; color: var(--rule); cursor: pointer; }
.star[aria-pressed="true"] { color: var(--amber); }
.star.big { font-size: 26px; margin-left: auto; padding: 2px 6px; }
.sheet .star.big + .x { margin-left: 6px; }
.rc-tools { margin-top: 10px; }
.rc-note { font-size: 12.5px; color: var(--muted); }
.facts5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 10px 0; }
.facts5 div { background: var(--bg); border-radius: 10px; padding: 6px 4px; text-align: center; min-width: 0; }
.facts5 small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.facts5 b { font: 600 19px/1.15 var(--display); font-variant-numeric: tabular-nums; }
.rc-vol { margin: 4px 0 6px; color: var(--muted); }
.rc-vol > span { display: flex; justify-content: space-between; }
.rc-vol b { color: var(--ink); }
.rc-vol input[type=range] { accent-color: var(--amber); padding: 0; border: 0; background: none; }
.rc-sec { border-top: 1px solid var(--rule); padding: 8px 0 6px; }
.rc-sec h4 { margin: 0 0 2px; font: 600 13px/1.4 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.rc-sec h4 span { color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 13.5px; text-align: right; }
.rc-sec .li { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.rc-sec .li span:last-child { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.rc-notes { margin: 0 0 6px; padding-left: 18px; font-size: 13.5px; color: var(--muted); }
.rc-notes:empty { display: none; }
.rc-text { font-size: 14px !important; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 8px; }
.rc-links { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 4px; }
.sheet .link.danger, .link.danger { color: var(--alert); }
.rc-foot { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; margin: 10px -16px calc(-18px - env(safe-area-inset-bottom, 0px));
  padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--rule); }
.rc-foot button { flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 8px; border-radius: 10px;
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; }
.rc-foot button.wide { flex-basis: 100%; }
.rc-foot button.main { background: var(--amber); border-color: var(--amber); color: #fff; }
.rc-foot button.main.teal { background: var(--teal); border-color: var(--teal); }
.rc-foot button:disabled { opacity: .6; }
.rc-foot svg, .brew-banner svg, .bottling h4 svg, .rc-line svg { width: 18px; height: 18px; flex: none; }
/* Розлив: сахар */
.prime { display: grid; gap: 8px; }
.pr-big { text-align: center; background: var(--bg); border-radius: 12px; padding: 8px; }
.pr-big small { display: block; font-size: 12.5px; color: var(--muted); }
.pr-big b { display: block; font: 600 44px/1.05 var(--display); color: var(--amber-deep); font-variant-numeric: tabular-nums; }
.pr-bottles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pr-bottles div { border: 1px solid var(--rule); border-radius: 10px; text-align: center; padding: 4px; }
.pr-bottles b { display: block; font: 600 19px/1.2 var(--display); }
.pr-bottles small { font-size: 11.5px; color: var(--muted); }
.pr-in { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; }
.pr-in label { font-size: 12.5px; gap: 2px; }
.pr-in input, .pr-in select { padding: 6px 8px; font-size: 15px; }
.pr-warn { margin: 0 !important; font-size: 13px !important; color: var(--amber-deep); }
.pr-warn.bad { background: var(--amber-soft); border-radius: 8px; padding: 6px 8px; }
.pr-warn:empty { display: none; }
.pr-note { margin: 0 !important; font-size: 12px !important; color: var(--muted); }
.bottling { margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 10px; }
.bottling h4 { margin: 0 0 8px; display: flex; align-items: center; gap: 6px; font: 600 18px/1.2 var(--display); }
.bottling h4 small { margin-left: auto; font: 400 12.5px var(--body); color: var(--muted); }
/* Рецепт партии и идущая варка в панели партии */
.rc-line { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; border: 0; background: none; padding: 0; margin-top: 2px; color: var(--amber-deep); cursor: pointer; text-align: left; font-size: 14px; }
.rc-line svg { align-self: center; }
.rc-line small { color: var(--muted); font-size: 12.5px; }
.brew-banner { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; margin: 0 0 10px; padding: 9px 12px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--amber); background: var(--amber-soft); color: var(--ink); font-size: 14px; }
.brew-banner > span:first-of-type { flex: 1; min-width: 0; }
.brew-banner small { display: block; color: var(--muted); font-size: 12.5px; }
.brew-banner [data-bt] { font: 600 17px var(--display); color: var(--amber-deep); font-variant-numeric: tabular-nums; }
.brew-banner i { font-style: normal; font-size: 20px; color: var(--amber-deep); }
.brew-banner svg { color: var(--amber-deep); }
/* День варки */
.brew { list-style: none; margin: 10px 0 6px; padding: 0; display: grid; gap: 8px; }
.brew li { display: flex; gap: 10px; align-items: flex-start; background: var(--bg); border: 1px solid var(--rule); border-radius: 12px; padding: 9px 10px; }
.brew li.cur { border-color: var(--amber); background: var(--amber-soft); }
.brew li.done .bs { opacity: .62; }
.brew .chk { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--rule); background: var(--surface); color: var(--muted); font-weight: 600; cursor: pointer; }
.brew li.cur .chk { border-color: var(--amber); background: var(--amber); color: #fff; }
.brew li.done .chk { border-color: var(--ok); background: var(--ok); color: #fff; }
.brew .bs { flex: 1; min-width: 0; }
.brew .bt { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.brew .bt b { font-size: 15px; }
.brew small { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; }
.brew small.next { color: var(--amber-deep); font-weight: 600; margin-top: 3px; }
.brew .tm { display: inline-flex; align-items: center; gap: 4px; }
.brew .tm b { font: 600 20px var(--display); font-variant-numeric: tabular-nums; color: var(--muted); }
.brew .tm.run b { color: var(--amber-deep); }
.brew .tm button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; font-size: 13px; }
.brew .tm.run button[data-timer] { background: var(--amber); border-color: var(--amber); color: #fff; }
.brew-top h2 { font-size: 24px !important; }
/* Свой рецепт: форма */
.sheet form.rc-edit { padding: 0; gap: 12px; margin-top: 8px; }
.rc-edit textarea { border: 1px solid var(--rule); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 15px; color: var(--ink); width: 100%; font-family: inherit; }
.rc-edit [name=json] { font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
.ed3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ferm-ed { border: 1px solid var(--rule); border-radius: 10px; padding: 6px 10px 8px; margin: 0; min-width: 0; }
.ferm-ed legend { font-size: 14px; color: var(--muted); padding: 0 4px; }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 5px 0; border-bottom: 1px dashed var(--rule); font-size: 14px; color: var(--muted); }
.frow input, .frow select { border: 1px solid var(--rule); background: var(--bg); border-radius: 8px; padding: 6px 6px; font-size: 15px; color: var(--ink); min-width: 0; }
.frow input[name=lo], .frow input[name=hi] { width: 58px; }
.frow input[name=uv] { width: 70px; }
.frow select { flex: 1 1 110px; }
.frow .x-row { border: 0; background: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; }
.ed-json summary { cursor: pointer; font-size: 14px; color: var(--teal); font-weight: 600; }
.ed-json small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
/* Новая партия: рецепт и «Варим сейчас | Уже сварено» */
.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; background: var(--bg); border-radius: 10px; }
.seg2 button { border: 0; border-radius: 8px; padding: 8px 6px; background: transparent; color: var(--muted); font-size: 14.5px; font-weight: 600; cursor: pointer; }
.seg2 button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.bfields { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
#recipe-info:empty { display: none; }
@media (max-width: 380px) { .facts5 b { font-size: 17px; } .facts5 small { font-size: 10.5px; } }

/* Карточка стиля (вариант A): шапка в цвете пива, шкалы диапазонов */
.sty-hero { position: relative; margin: 0 -16px 4px; padding: 6px 16px 14px; overflow: hidden; }
.sty-hero h2 { max-width: calc(100% - 70px); margin-top: 6px !important; color: inherit; }
.sty-hero .sub { max-width: calc(100% - 70px); }
.sty-hero .star.big { margin-left: auto; color: rgba(255,255,255,.75); text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.sty-hero .star.big[aria-pressed="true"] { color: #ffcf3a; }
.sty-hero .pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; max-width: calc(100% - 66px); }
.sty-hero .pill { font: 600 12px var(--body); border-radius: 999px; padding: 3px 9px; background: rgba(255,255,255,.5); color: #4a3307; }
.sty-glass { position: absolute; right: 16px; bottom: 12px; width: 50px; height: 70px; }
.sty-leg { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.sty-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.sty-leg i.z { background: color-mix(in srgb, var(--ok) 30%, transparent); } .sty-leg i.m { background: var(--ok); }
.sty-bars { display: grid; gap: 10px; margin: 8px 0 4px; }
.sty-rng .hd { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; color: var(--muted); }
.sty-rng .hd b { color: var(--ink); font-variant-numeric: tabular-nums; }
.sty-bar { position: relative; height: 10px; border-radius: 5px; background: var(--bg); margin-top: 3px; }
.sty-bar.has-m { margin-top: 18px; }
.sty-bar .z { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: color-mix(in srgb, var(--ok) 30%, transparent); }
.sty-bar .m { position: absolute; top: -4px; width: 4px; height: 18px; border-radius: 2px; background: var(--ok); transform: translateX(-50%); }
.sty-bar .m.bad { background: var(--alert); }
.sty-bar .m em { position: absolute; bottom: 19px; left: 50%; transform: translateX(-50%); font: 600 12px var(--body); font-style: normal; color: var(--ok); white-space: nowrap; }
.sty-bar .m.bad em { color: var(--alert); }
.sty-rng .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 1px; }
.sty-tips { display: grid; gap: 8px; }
.sty-tip { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 9px; font-size: 14px; align-items: start; }
.sty-tip .ic { width: 26px; height: 26px; border-radius: 8px; background: var(--amber-soft); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.sty-links { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 14px 0 4px; }
.sty-links a { display: inline-flex; align-items: center; gap: 4px; color: var(--teal); font-weight: 600; font-size: 14px; text-decoration: none; }
.sty-links svg { width: 15px; height: 15px; }
.cat-list .fav-mark { color: var(--amber); }

/* Кто подключён к стику */
.members { background: var(--bg); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
.members h4 { margin: 0 0 6px; font: 600 16px/1.2 var(--display); }
.members ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.members li {
  display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: start; gap: 0 8px; font-size: 14px;
  padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none;
}
.members li svg { width: 20px; height: 20px; color: var(--muted); margin-top: 1px; }
.members li small { grid-column: 2 / 4; color: var(--muted); font-size: 12px; }
.members .revoke { font-size: 12px; padding: 2px 8px; border: 1px solid var(--alert); color: var(--alert); background: transparent; border-radius: 6px; cursor: pointer; }
.members .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.members .role { font-size: 12px; padding: 2px 8px; border: 1px solid var(--rule); color: var(--ink); background: var(--surface); border-radius: 6px; cursor: pointer; }
.members .revoke:hover { background: color-mix(in srgb, var(--alert) 10%, transparent); }
.members .you { color: var(--ok); font-weight: 600; }
.members .note { margin: 6px 0 0; font-size: 12px; color: var(--muted); }

/* Рекомендации */
.recs { margin-top: 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
.recs h2 { font: 600 20px/1.2 var(--display); margin: 0 0 6px; }
.rec { display: grid; grid-template-columns: 22px 1fr; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--rule); }
.rec:first-of-type { border-top: 0; }
.rec .mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--body); color: #fff; background: var(--ok); margin-top: 1px; }
.rec.warn .mark, .rec.bad .mark { background: var(--alert); }
.rec b { font-weight: 600; }
.rec ul { margin: 2px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; color: var(--muted); grid-column: 2; }
.rec li.warn, .rec li.bad { color: var(--ink); }
.rec li.warn::before, .rec li.bad::before { content: "▲ "; color: var(--alert); font-size: 11px; }
.rec li.warn::before { color: var(--amber); }

/* Всплывающая подсказка у показателей */
.pop {
  position: absolute; z-index: 20; width: min(330px, calc(100vw - 24px));
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.4;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .28);
}
.pop h4 { margin: 0 0 6px; font: 600 17px/1.2 var(--display); }
.pop dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 8px; font-size: 13px; }
.pop dt { opacity: .7; } .pop dd { margin: 0; font-variant-numeric: tabular-nums; }
.pop ul { margin: 0; padding-left: 16px; display: grid; gap: 4px; }
.pop li.warn { color: #ffd27a; }
.pop li.bad { color: #ffb4a6; }
.pop .close { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: inherit; opacity: .6; font-size: 18px; cursor: pointer; }

/* Графики */
.charts { margin-top: 24px; display: grid; gap: 10px; }
.chart-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 8px 10px; }
.chart-card .chart-label { margin-top: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; }
.chart-note { margin-left: auto; font-size: 12px; }
.charts-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.charts-head h2 { font: 600 22px/1.2 var(--display); margin: 0; }
.ranges { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.ranges button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.ranges button + button { border-left: 1px solid var(--rule); }
.ranges button[aria-pressed="true"] { background: var(--amber); color: #fff; }
.ranges button[hidden] { display: none; }
.chart-box { position: relative; height: 200px; margin-top: 6px; }
.chart-label { font-size: 14px; color: var(--muted); margin-top: 18px; }
.chart-label .sw { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.smooth { font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; margin-left: 12px; }

.notice { margin-top: 24px; padding: 14px 16px; border-left: 3px solid var(--amber); background: var(--surface); border-radius: 0 8px 8px 0; }
.notice.error { border-left-color: var(--alert); }

/* Настройки */
dialog {
  border: 0; border-radius: 14px; padding: 0; width: min(520px, calc(100vw - 32px));
  background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
dialog::backdrop { background: rgba(10, 14, 12, .45); }
dialog form { padding: 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (max-width: 480px) { dialog form { padding: 18px 16px; } }
dialog h2 { font: 600 24px/1.1 var(--display); margin: 0; }
label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
label select { min-width: 0; border: 1px solid var(--rule); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 15px; color: var(--ink); width: 100%; }
label input { border: 1px solid var(--rule); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 15px; color: var(--ink); min-width: 0; width: 100%; }
label small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: end; }
.row label { flex: 1; min-width: 0; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
/* Нижняя панель окна настроек: «Закрыть | Сохранить», всегда видна */
#set-actions { position: sticky; bottom: -22px; margin: 0 -22px -22px; padding: 12px 22px 18px; background: var(--surface); border-top: 1px solid var(--rule); z-index: 2; }
#set-actions button { flex: 1; }
@media (max-width: 480px) { #set-actions { bottom: -18px; margin: 0 -16px -18px; padding: 12px 16px 16px; } }
/* Пока идёт запрос к серверу — всё в окне неактивно, на нажатой кнопке крутится индикатор */
dialog.busy button, dialog.busy input, dialog.busy select, dialog.busy a { pointer-events: none; }
dialog.busy button:not(.loading) { opacity: .5; }
button.loading::before { content: ""; display: inline-block; width: 13px; height: 13px; margin-right: 7px; vertical-align: -2px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.field-row { display: flex; gap: 6px; flex-wrap: wrap; }
.field-row button { flex: none; }
.field-row input { flex: 1 1 160px; min-width: 0; width: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.field-error { color: var(--alert); font-size: 13px; }
.field-error:empty { display: none; }
.link { background: none; border: 0; padding: 0; color: var(--amber-deep); text-decoration: underline; cursor: pointer; font-size: 14px; }
.server { font-size: 14px; color: var(--muted); display: grid; gap: 6px; }
.server b { color: var(--ink); font-weight: 500; word-break: break-all; }
.guide { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; background: var(--bg); }
.guide summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.guide ol { margin: 10px 0 4px; padding-left: 20px; display: grid; gap: 8px; font-size: 14px; }
.guide dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; margin: 8px 0 0; align-items: center; }
.guide dt { color: var(--muted); font-size: 13px; }
.guide dd { margin: 0; display: flex; gap: 6px; align-items: center; min-width: 0; }
.guide code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 2px 6px; overflow-wrap: anywhere; }
.copy { font-size: 12px; padding: 2px 8px; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; cursor: pointer; flex: none; }
.guide .note { color: var(--muted); font-size: 13px; }
/* Настройки: список → страница стика (разделы Партия / Измерения / Доступ) */
.set-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.set-head h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set-icon { flex: none; border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 6px; cursor: pointer; }
.set-icon.back { color: var(--teal); font-size: 30px; margin-left: -6px; }
.tag { flex: none; font-size: 12px; border-radius: 999px; padding: 2px 8px; background: var(--amber-soft); color: var(--amber-deep); white-space: nowrap; }
.tag.guest { background: var(--bg); color: var(--muted); border: 1px solid var(--rule); }
.set-page, .set-seg { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.gl { font: 600 12px/1 var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 4px -6px; }
.set-list { list-style: none; margin: 0; padding: 0; background: var(--bg); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.set-list li + li { border-top: 1px solid var(--rule); }
.set-list li.empty { padding: 12px; color: var(--muted); font-size: 14px; }
.set-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; border: 0; background: none; text-align: left; color: var(--ink); font: inherit; cursor: pointer; }
.set-row .t { flex: 1; min-width: 0; }
.set-row .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set-row .t small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set-row .accent { color: var(--teal); }
.set-row .ic { flex: none; width: 22px; display: flex; justify-content: center; color: var(--teal); }
.set-row .ic svg { width: 20px; height: 20px; }
.set-row .v { color: var(--muted); font-size: 13px; white-space: nowrap; }
.set-row .ch { color: var(--muted); font-size: 20px; line-height: 1; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--rule); margin: 0 6px; }
.dot.on { background: var(--ok); }
.seg { display: flex; gap: 2px; padding: 3px; background: var(--bg); border: 1px solid var(--rule); border-radius: 10px; }
.seg button { flex: 1; min-width: 0; border: 0; background: none; padding: 7px 4px; border-radius: 7px; font: 600 14px var(--body); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
.set-card { display: grid; gap: 8px; padding: 12px; background: var(--bg); border: 1px solid var(--rule); border-radius: 12px; }
.set-card h4 { margin: 0; font: 600 16px/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.set-card.danger { border-color: color-mix(in srgb, var(--alert) 45%, transparent); }
.set-card.danger h4 { color: var(--alert); }
.set-card .note { color: var(--muted); font-size: 13px; }
.set-card .note:empty { display: none; }
.set-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
.set-note { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--bg); color: var(--muted); font-size: 14px; }
.btn-danger { flex: none; font-size: 13px; padding: 5px 10px; border: 1px solid var(--alert); color: var(--alert); background: transparent; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn-danger:hover { background: color-mix(in srgb, var(--alert) 10%, transparent); }
.muted { color: var(--muted); font-size: 14px; margin: 0; }
.share-box { display: grid; gap: 6px; }
.share-box code { flex: 1; min-width: 0; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 6px; overflow-wrap: anywhere; }
#stick-switch { font: 600 28px/1.1 var(--display); border: 0; background: transparent; padding: 0; cursor: pointer; max-width: 100%; }
#device-switch { margin-top: 4px; font-size: 15px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); padding: 2px 6px; }
.guide dd code { flex: 1 1 auto; min-width: 0; }
@media (max-width: 480px) {
  .guide { padding: 10px 12px; }
  .guide ol { padding-left: 18px; }
  .guide dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .guide dt { margin-top: 6px; }
}
.primary { background: var(--amber); color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
.secondary { background: transparent; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 14px; cursor: pointer; }

/* Предложение установить приложение */
.install {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  max-width: 520px; margin: 0 auto; display: flex; gap: 12px; align-items: flex-start;
  padding: 14px; border-radius: 14px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--rule); box-shadow: 0 12px 40px rgba(0, 0, 0, .22);
}
.install img { border-radius: 10px; flex: none; }
body.has-install main { padding-bottom: 220px; }
.install-body { flex: 1; min-width: 0; display: grid; gap: 6px; font-size: 14px; }
.install-body b { font: 600 18px/1.2 var(--display); }
.install-body p { margin: 0; color: var(--muted); }
.install-body ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.install-actions { display: flex; gap: 8px; margin-top: 4px; }
.ios-share { width: 18px; height: 18px; vertical-align: -3px; color: #0a84ff; }
@media (prefers-reduced-motion: no-preference) {
  .install:not([hidden]) { animation: install-in .35s cubic-bezier(.2, .7, .2, 1); }
  @keyframes install-in { from { transform: translateY(24px); opacity: 0; } }
}

@media (max-width: 640px) {
  main { padding: 16px 14px 40px; }
  .chart-box { height: 170px; }
}

</style>
</head>
<body>
<main>

        <button class="icon-btn round" id="open-settings" type="button" data-i18n-label="ui.settings" data-i18n-title="ui.settings"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
