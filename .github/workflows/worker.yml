name: Worker

# Deploys the worker to Cloudflare. Repository secrets:
#   CLOUDFLARE_API_TOKEN   required; "Edit Cloudflare Workers" template + D1: Edit
#   CLOUDFLARE_ACCOUNT_ID  only if the token has access to several accounts
#   INGEST_TOKEN           token iSpindel sends; written to the worker's secrets
#   READ_TOKEN             optional; if set, reading data requires this key
# Creates the ispindel D1 database if it doesn't exist and applies schema.sql.
# Without CLOUDFLARE_API_TOKEN the job is skipped.

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      READ_TOKEN: ${{ secrets.READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — worker deploy skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.token.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Install
        if: steps.token.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund

      - name: Database
        if: steps.token.outputs.skip != 'true'
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name == "ispindel") | .uuid'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create ispindel
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "::error::Could not find or create D1 database 'ispindel'"; exit 1; }
          echo "D1 ispindel: $id"
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          npx wrangler d1 execute ispindel --remote --file=schema.sql

      - name: Deploy
        if: steps.token.outputs.skip != 'true'
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy | tee deploy.log
          if [ -n "$INGEST_TOKEN" ]; then
            printf '%s' "$INGEST_TOKEN" | npx wrangler secret put INGEST_TOKEN
          else
            echo "::warning::INGEST_TOKEN secret is not set — the worker will reject iSpindel data until it is."
          fi
          if [ -n "$READ_TOKEN" ]; then
            printf '%s' "$READ_TOKEN" | npx wrangler secret put READ_TOKEN
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Worker URL: ${url:-see deploy log}" >> "$GITHUB_STEP_SUMMARY"
          [ -z "$url" ] || curl -fsS "$url/api/health"
