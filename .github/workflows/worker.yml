name: Worker

# Deploys the worker to Cloudflare. Repository secrets:
#   CLOUDFLARE_API_TOKEN   required; "Edit Cloudflare Workers" template + D1: Edit
#   CLOUDFLARE_ACCOUNT_ID  only if the token has access to several accounts
#   INGEST_TOKEN           optional; an iSpindel that exists from the start, claimed once in the app
# Creates the ispindel D1 database if it doesn't exist and applies schema.sql.
# Without CLOUDFLARE_API_TOKEN the job is skipped.

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — worker deploy skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.token.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Install
        if: steps.token.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund

      - name: Database
        if: steps.token.outputs.skip != 'true'
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          CREATE=1 scripts/resolve-db.sh
          npx wrangler d1 execute ispindel --remote --file=schema.sql

      - name: Deploy
        if: steps.token.outputs.skip != 'true'
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy | tee deploy.log
          if [ -n "$INGEST_TOKEN" ]; then
            printf '%s' "$INGEST_TOKEN" | npx wrangler secret put INGEST_TOKEN
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Worker URL: ${url:-see deploy log}" >> "$GITHUB_STEP_SUMMARY"
          # A new workers.dev URL can take a few minutes to start answering.
          if [ -n "$url" ]; then
            for i in $(seq 12); do
              curl -fsS "$url/api/health" && exit 0
              sleep 15
            done
            echo "::warning::$url/api/health is not answering yet — check again in a few minutes."
          fi
