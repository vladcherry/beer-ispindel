name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/check-recipes.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # число коммитов — номер версии

      # Встроенные рецепты: формат, стиль, НП > КП, index.json совпадает с файлами.
      - name: Check recipes
        run: node scripts/check-recipes.mjs

      # Новая версия кэша service worker'а на каждый деплой — телефоны подтянут обновление сами.
      - name: Stamp service worker version
        run: sed -i "s/^const VERSION = \".*\";/const VERSION = \"${GITHUB_SHA::7}\";/" web/sw.js && grep '^const VERSION' web/sw.js

      # Версия приложения: 1.<число коммитов>. version.json проверяет приложение, ту же версию
      # получает index.html — так открытая страница знает, что она устарела.
      - name: Stamp app version
        run: |
          V="1.$(git rev-list --count HEAD)"; B="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{ "version": "%s", "sha": "%s", "built": "%s" }\n' "$V" "${GITHUB_SHA::7}" "$B" > web/version.json
          sed -i "s|<meta name=\"app-version\" content=\"dev\" data-sha=\"\" data-built=\"\">|<meta name=\"app-version\" content=\"$V\" data-sha=\"${GITHUB_SHA::7}\" data-built=\"$B\">|" web/index.html
          cat web/version.json && grep -c "content=\"$V\"" web/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
