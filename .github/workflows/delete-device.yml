name: Delete device

# Manual cleanup: deletes every reading of one device name (e.g. after renaming the iSpindel).
# Actions → Delete device → Run workflow → device name. Counts before and after go to the run summary.

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device name exactly as the iSpindel sends it
        required: true

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEVICE: ${{ inputs.device }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Delete readings
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          # The name goes into SQL, so only plain characters are allowed (no quotes).
          if ! printf '%s' "$DEVICE" | grep -qE '^[A-Za-z0-9_. -]{1,64}$'; then
            echo "::error::Device name may contain only letters, digits, space, _ . -"; exit 1
          fi
          scripts/resolve-db.sh
          count() {
            npx wrangler d1 execute ispindel --remote --json --command \
              "SELECT device, COUNT(*) AS n FROM readings GROUP BY device" | jq -c '.[0].results[]'
          }
          {
            echo "### Before"; echo '```'; count; echo '```'
            npx wrangler d1 execute ispindel --remote --json --command \
              "DELETE FROM readings WHERE device = '$DEVICE'; DELETE FROM latest WHERE device = '$DEVICE'" \
              | jq -c '.[] | {deleted: .meta.changes}'
            echo "### After"; echo '```'; count; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
