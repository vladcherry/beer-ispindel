name: Status

# Manual check: is the worker up and what did iSpindel send last.
# Actions → Status → Run workflow. Output goes to the run summary.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Health and latest readings
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          url=https://ispindel.vladcherry.workers.dev
          scripts/resolve-db.sh
          {
            site=https://vladcherry.github.io/beer-ispindel
            echo "### Site"
            echo '```'
            curl -sS -o /dev/null -w "index: %{http_code}\n" "$site/" || true
            curl -sSI "$site/" | grep -iE '^(last-modified|cache-control|age):' || true
            curl -sS "$site/sw.js" | grep -m1 '^const VERSION' || true
            echo "install banner in index: $(curl -sS "$site/" | grep -c 'id="install"')"
            echo "config: $(curl -sS "$site/config.js" | grep -o 'api: *"[^"]*"')"
            echo '```'
            echo "### Health"
            echo '```'
            curl -sS "$url/api/health" || true
            echo
            echo '```'
            echo "### Readings"
            echo '```'
            npx wrangler d1 execute ispindel --remote --json --command \
              "SELECT COUNT(*) AS total, datetime(MIN(ts)/1000,'unixepoch') AS first_utc, datetime(MAX(ts)/1000,'unixepoch') AS last_utc FROM readings" \
              | jq -c 'if type == "array" then .[0].results[] else . end'
            echo
            npx wrangler d1 execute ispindel --remote --json --command \
              "SELECT datetime(ts/1000,'unixepoch') AS utc, device, angle, temperature, gravity, battery, rssi, interval_s FROM readings ORDER BY ts DESC LIMIT 10" \
              | jq -c 'if type == "array" then .[0].results[] else . end'
            echo '```'
            echo "### Tokens"
            echo '```'
            npx wrangler d1 execute ispindel --remote --json --command \
              "SELECT (SELECT COUNT(*) FROM tokens) AS sticks, (SELECT COUNT(*) FROM access_keys) AS access_keys, (SELECT datetime(MAX(last_seen)/1000,'unixepoch') FROM tokens) AS last_seen_utc" \
              | jq -c 'if type == "array" then .[0].results[] else . end' || true
            echo '```'
            echo "### Sticks and access keys (UTC)"
            echo '```'
            npx wrangler d1 execute ispindel --remote --json --command \
              "SELECT t.id AS stick, (SELECT GROUP_CONCAT(DISTINCT device) FROM latest WHERE owner = t.hash) AS devices, a.kind, datetime(a.created/1000,'unixepoch') AS created, datetime(a.last_used/1000,'unixepoch') AS last_used, a.user_agent FROM tokens t LEFT JOIN access_keys a ON a.token_hash = t.hash ORDER BY t.id, a.kind DESC, a.created" \
              | jq -c 'if type == "array" then .[0].results[] else . end' || true
            echo '```'
            echo "### Last ingest attempts (UTC)"
            echo '```'
            npx wrangler d1 execute ispindel --remote --json --command \
              "SELECT datetime(ts/1000,'unixepoch') AS utc, path, status, reason, user_agent, content_type, body FROM ingest_log ORDER BY id DESC LIMIT 10" \
              | jq -c 'if type == "array" then .[0].results[] else . end'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
